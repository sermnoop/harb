                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF
          fi

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle (Release)
        run: |
          mkdir -p build
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild-release.log

      - name: Package & Verify IPA Bundle
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HarborIOS.app was not produced!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          rm -rf build/Payload build/Harbor.ipa
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          test -f build/Payload/Harbor.app/HarborIOS
          test -f build/Payload/Harbor.app/Info.plist
          test -f build/Payload/Harbor.app/ThmanyahSans-Regular.ttf
          du -sh build/Payload/Harbor.app
          cd build && zip -r -9 Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact (No Double-Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: |
            build/Harbor.ipa
            build/xcodebuild-release.log
          compression-level: 0

      - name: Publish Direct Harbor.ipa to GitHub Releases (No Unzip Required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.0.0-latest build/Harbor.ipa \
            --title "Harbor iOS v3.0.0 — Full Media Player, 12-Option Subtitles (SRT/VTT/ASS), Reflowable EPUB/PDF Reader & Keychain Security (Direct Harbor.ipa)" \
            --notes "Direct Harbor.ipa download for iPhone & iPad — Upgraded v3.0.0 architecture with 12-option subtitle customization (Embedded HLS + SRT/WebVTT/ASS-SSA + RTL + Timing Delay), Reflowable EPUB/TXT/HTML + PDFKit Reader, Music Queue/Playlists/Favorites + Manual Lyric Scroll Override, iOS Keychain credential encryption, and Bounded LRU Disk Cache." \
            --latest || gh release upload v3.0.0-latest build/Harbor.ipa --clobber || true
