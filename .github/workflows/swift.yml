          raw_json = lzma.decompress(base64.b64decode(payload_b64))
          bundle = json.loads(raw_json.decode("utf-8"))
          for fname, content_b64 in bundle.items():
              out_path = os.path.join("Sources/HarborIOS", fname)
              with open(out_path, "wb") as f:
                  f.write(base64.b64decode(content_b64))
              print("Wrote:", out_path, os.path.getsize(out_path), "bytes")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: HarborIOS
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "2.9.3"
                  CFBundleVersion: "15"
                  UIAppFonts:
                    - ThmanyahSans-Regular.ttf
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: false
                  LSSupportsOpeningDocumentsInPlace: true
                  UIFileSharingEnabled: true
                  UILaunchScreen:
                    UIColorName: ""
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact (No Double-Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
          compression-level: 0

      - name: Publish Direct Harbor.ipa to GitHub Releases (No Unzip Required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.9.3-latest build/Harbor.ipa \
            --title "Harbor iOS v2.9.3 Control Center, Glowing Lyrics & Responsive Layout (Direct Harbor.ipa)" \
            --notes "Direct Harbor.ipa download for iPhone — iOS Control Center & Lock Screen Scrubber, Glowing Active Lyrics, Mini-Bar Full Tap/Swipe/Close, and Portrait/Landscape Alignment." \
            --latest || gh release upload v2.9.3-latest build/Harbor.ipa --clobber || true
