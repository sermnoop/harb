          // MARK: - 2. Pure-Swift Reflowable EPUB & Text Parser (ZIP + OPF Spine + XHTML Extraction)

          public enum HarborEPUBParser {

              public struct ParsedEPUBBook: Sendable {
                  public let title: String?
                  public let author: String?
                  public let chapters: [HarborReflowableChapter]
              }

              /// Extracts ZIP archive entries in pure Swift (supporting Stored method 0 and Deflate method 8 via Apple Compression)
              /// and parses `META-INF/container.xml` -> `.opf` manifest & spine -> reflowable XHTML chapters.
              public static func parseEPUB(at fileURL: URL) throws -> [HarborReflowableChapter] {
                  let book = try parseEPUBBook(at: fileURL)
                  return book.chapters
              }

              public static func parseEPUBBook(at fileURL: URL) throws -> ParsedEPUBBook {
                  let archiveData = try Data(contentsOf: fileURL)
                  let entries = extractZipEntries(from: archiveData)
                  guard !entries.isEmpty else {
                      throw NSError(domain: "HarborEPUBParser", code: 101, userInfo: [NSLocalizedDescriptionKey: "ملف EPUB تالف أو غير صالح"])
                  }

                  // 1. Locate OPF path from META-INF/container.xml
                  var opfPath: String? = nil
                  if let containerData = entries["META-INF/container.xml"] ?? entries.first(where: { $0.key.lowercased().hasSuffix("container.xml") })?.value,
                     let containerXML = String(data: containerData, encoding: .utf8) {
                      opfPath = extractAttribute("full-path", inTagContaining: "rootfile", from: containerXML)
                  }
                  if opfPath == nil {
                      opfPath = entries.keys.first(where: { $0.lowercased().hasSuffix(".opf") })
                  }

                  var bookTitle: String? = nil
                  var bookAuthor: String? = nil
                  var orderedChapterPaths: [String] = []

                  if let resolvedOPF = opfPath,
                     let opfData = entries[resolvedOPF] ?? entries.first(where: { $0.key.lowercased() == resolvedOPF.lowercased() })?.value,
                     let opfXML = String(data: opfData, encoding: .utf8) {

                      let opfBaseDir = (resolvedOPF as NSString).deletingLastPathComponent
                      bookTitle = extractFirstTagContent("dc:title", from: opfXML) ?? extractFirstTagContent("title", from: opfXML)
                      bookAuthor = extractFirstTagContent("dc:creator", from: opfXML) ?? extractFirstTagContent("creator", from: opfXML)

                      // Parse <manifest> items: id -> href
                      var manifestMap: [String: String] = [:]
                      let itemTags = extractAllTags(named: "item", from: opfXML)
                      for tag in itemTags {
                          if let id = extractAttribute("id", fromTag: tag),
                             let href = extractAttribute("href", fromTag: tag) {
                              let cleanHref = href.removingPercentEncoding ?? href
                              let fullPath = opfBaseDir.isEmpty ? cleanHref : "\(opfBaseDir)/\(cleanHref)"
                              manifestMap[id] = fullPath
                          }
                      }

                      // Parse <spine> itemrefs: idref
                      let itemrefTags = extractAllTags(named: "itemref", from: opfXML)
                      for tag in itemrefTags {
                          if let idref = extractAttribute("idref", fromTag: tag),
                             let path = manifestMap[idref] {
                              orderedChapterPaths.append(path)
                          }
                      }
                  }

                  // Fallback if spine was empty: sort all .xhtml / .html files in the archive
                  if orderedChapterPaths.isEmpty {
                      orderedChapterPaths = entries.keys.filter { key in
                          let lower = key.lowercased()
                          return (lower.hasSuffix(".xhtml") || lower.hasSuffix(".html") || lower.hasSuffix(".htm")) && !lower.contains("nav") && !lower.contains("toc")
                      }.sorted()
                  }

                  var chapters: [HarborReflowableChapter] = []
                  for (idx, path) in orderedChapterPaths.enumerated() {
                      guard let data = entries[path] ?? entries.first(where: { $0.key.lowercased() == path.lowercased() || $0.key.hasSuffix("/" + (path as NSString).lastPathComponent) })?.value,
                            let html = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .isoLatin1) else {
                          continue
                      }
                      let (extractedTitle, paragraphs) = extractTitleAndParagraphs(fromHTML: html, fallbackIndex: idx + 1)
                      if !paragraphs.isEmpty {
                          chapters.append(
                              HarborReflowableChapter(
                                  id: "ch_\(idx)_\(path)",
                                  index: chapters.count,
                                  title: extractedTitle,
                                  paragraphs: paragraphs
                              )
                          )
                      }
                  }

                  guard !chapters.isEmpty else {
                      throw NSError(domain: "HarborEPUBParser", code: 102, userInfo: [NSLocalizedDescriptionKey: "لم يتم العثور على فصول نصية قابلة للقراءة داخل ملف EPUB"])
                  }

                  return ParsedEPUBBook(title: bookTitle, author: bookAuthor, chapters: chapters)
              }

              public static func parsePlainTextFile(at fileURL: URL) throws -> [HarborReflowableChapter] {
                  let ext = fileURL.pathExtension.lowercased()
                  let isHTML = (ext == "html" || ext == "htm" || ext == "xhtml")
                  return try parsePlainTextOrHTML(at: fileURL, isHTML: isHTML)
              }

              public static func parsePlainTextOrHTML(at fileURL: URL, isHTML: Bool) throws -> [HarborReflowableChapter] {
                  let data = try Data(contentsOf: fileURL)
                  guard let rawText = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .windowsCP1256) ?? String(data: data, encoding: .isoLatin1) else {
                      throw NSError(domain: "HarborBookParser", code: 103, userInfo: [NSLocalizedDescriptionKey: "تعذر قراءة ترميز الملف النصي"])
                  }

                  if isHTML {
                      let (title, paragraphs) = extractTitleAndParagraphs(fromHTML: rawText, fallbackIndex: 1)
                      return [HarborReflowableChapter(id: "html_0", index: 0, title: title, paragraphs: paragraphs)]
                  }

                  let normalized = rawText.replacingOccurrences(of: "\r\n", with: "\n").replacingOccurrences(of: "\r", with: "\n")
                  let allParagraphs = normalized.components(separatedBy: "\n\n")
                      .map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
                      .filter { !$0.isEmpty }

                  // Group into comfortable chapters of ~45 paragraphs each
                  let chunkSize = 45
                  var chapters: [HarborReflowableChapter] = []
                  var i = 0
                  var chapterIdx = 0
                  while i < allParagraphs.count {
                      let end = min(i + chunkSize, allParagraphs.count)
                      let slice = Array(allParagraphs[i..<end])
                      let firstLine = slice.first?.components(separatedBy: "\n").first ?? "الفصل \(chapterIdx + 1)"
                      let chapterTitle = firstLine.count <= 60 ? firstLine : "القسم \(chapterIdx + 1)"
                      chapters.append(
                          HarborReflowableChapter(
                              id: "txt_\(chapterIdx)",
                              index: chapterIdx,
                              title: chapterTitle,
                              paragraphs: slice
                          )
                      )
                      chapterIdx += 1
                      i = end
                  }

                  if chapters.isEmpty {
                      chapters.append(HarborReflowableChapter(id: "txt_0", index: 0, title: fileURL.deletingPathExtension().lastPathComponent, paragraphs: [normalized]))
                  }
                  return chapters
              }

              public static func extractReadableText(fromXHTML xhtml: String, fallbackTitle: String = "الفصل 1") -> (title: String, body: String) {
                  let (title, paragraphs) = extractTitleAndParagraphs(fromHTML: xhtml, fallbackIndex: 1, fallbackTitle: fallbackTitle)
                  return (title: title, body: paragraphs.joined(separator: "\n\n"))
              }

              public static func extractPDFOutline(from document: PDFDocument) -> [HarborPDFOutlineNode] {
                  guard let root = document.outlineRoot else { return [] }
                  var nodes: [HarborPDFOutlineNode] = []
                  func traverse(_ outline: PDFOutline, depth: Int) {
                      for i in 0..<outline.numberOfChildren {
                          guard let child = outline.child(at: i) else { continue }
                          let label = child.label?.trimmingCharacters(in: .whitespacesAndNewlines) ?? "قسم"
                          var pageIdx = 0
                          if let destPage = child.destination?.page {
                              pageIdx = max(0, document.index(for: destPage))
                          }
                          if !label.isEmpty {
                              nodes.append(HarborPDFOutlineNode(title: label, pageIndex: pageIdx, depth: depth))
                          }
                          traverse(child, depth: min(depth + 1, 3))
                      }
                  }
                  traverse(root, depth: 0)
                  return nodes
              }

              // MARK: - Internal ZIP & XHTML Helpers

              private static func extractZipEntries(from data: Data) -> [String: Data] {
                  var entries: [String: Data] = [:]
                  let bytes = [UInt8](data)
                  let count = bytes.count

                  // Scan Central Directory from End of Central Directory (EOCD) signature 0x06054b50 when available
                  var eocdOffset = -1
                  let minSearch = max(0, count - 65557)
                  if count >= 22 {
                      for idx in stride(from: count - 22, through: minSearch, by: -1) {
                          if bytes[idx] == 0x50 && bytes[idx + 1] == 0x4B && bytes[idx + 2] == 0x05 && bytes[idx + 3] == 0x06 {
                              eocdOffset = idx
                              break
                          }
                      }
                  }

                  if eocdOffset >= 0 && eocdOffset + 20 <= count {
                      let cdCount = Int(readUInt16LE(bytes, eocdOffset + 10))
                      let cdOffset = Int(readUInt32LE(bytes, eocdOffset + 16))
                      var ptr = cdOffset
                      for _ in 0..<cdCount {
                          guard ptr + 46 <= count,
                                bytes[ptr] == 0x50, bytes[ptr + 1] == 0x4B, bytes[ptr + 2] == 0x01, bytes[ptr + 3] == 0x02 else {
                              break
                          }
                          let method = readUInt16LE(bytes, ptr + 10)
                          let compSize = Int(readUInt32LE(bytes, ptr + 20))
                          let uncompSize = Int(readUInt32LE(bytes, ptr + 24))
                          let nameLen = Int(readUInt16LE(bytes, ptr + 28))
                          let extraLen = Int(readUInt16LE(bytes, ptr + 30))
                          let commentLen = Int(readUInt16LE(bytes, ptr + 32))
                          let localHeaderOffset = Int(readUInt32LE(bytes, ptr + 42))

                          guard ptr + 46 + nameLen <= count else { break }
                          let nameData = Data(bytes[(ptr + 46)..<(ptr + 46 + nameLen)])
                          let fileName = String(data: nameData, encoding: .utf8) ?? ""

                          if !fileName.hasSuffix("/"), localHeaderOffset + 30 <= count {
                              let localNameLen = Int(readUInt16LE(bytes, localHeaderOffset + 26))
                              let localExtraLen = Int(readUInt16LE(bytes, localHeaderOffset + 28))
                              let dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen
                              if dataStart + compSize <= count && compSize >= 0 {
                                  let slice = Data(bytes[dataStart..<(dataStart + compSize)])
                                  if method == 0 {
                                      entries[fileName] = slice
                                  } else if method == 8, let inflated = inflateRawDeflate(slice, expectedSize: uncompSize) {
                                      entries[fileName] = inflated
                                  }
                              }
                          }
                          ptr += 46 + nameLen + extraLen + commentLen
                      }
                  }

                  // Fallback linear scan of Local File Headers (0x04034b50) if EOCD was not used
                  if entries.isEmpty {
                      var offset = 0
                      while offset + 30 <= count {
                          guard bytes[offset] == 0x50, bytes[offset + 1] == 0x4B, bytes[offset + 2] == 0x03, bytes[offset + 3] == 0x04 else {
                              break
                          }
                          let method = readUInt16LE(bytes, offset + 8)
                          let compSize = Int(readUInt32LE(bytes, offset + 18))
                          let uncompSize = Int(readUInt32LE(bytes, offset + 22))
                          let nameLen = Int(readUInt16LE(bytes, offset + 26))
                          let extraLen = Int(readUInt16LE(bytes, offset + 28))
                          let dataStart = offset + 30 + nameLen + extraLen
                          guard dataStart + compSize <= count, compSize >= 0 else { break }

                          let nameData = Data(bytes[(offset + 30)..<(offset + 30 + nameLen)])
                          let fileName = String(data: nameData, encoding: .utf8) ?? ""
                          if !fileName.hasSuffix("/") {
                              let slice = Data(bytes[dataStart..<(dataStart + compSize)])
                              if method == 0 {
                                  entries[fileName] = slice
                              } else if method == 8, let inflated = inflateRawDeflate(slice, expectedSize: uncompSize) {
                                  entries[fileName] = inflated
                              }
                          }
                          offset = dataStart + compSize
                      }
                  }

                  return entries
              }

              private static func inflateRawDeflate(_ compressed: Data, expectedSize: Int) -> Data? {
                  guard !compressed.isEmpty else { return Data() }
                  let destCapacity = max(expectedSize * 2, compressed.count * 6, 65536)
                  var destBuffer = [UInt8](repeating: 0, count: destCapacity)
                  let decodedBytes = compressed.withUnsafeBytes { srcPtr -> Int in
                      guard let baseAddress = srcPtr.bindMemory(to: UInt8.self).baseAddress else { return 0 }
                      return compression_decode_buffer(
                          &destBuffer,
                          destCapacity,
                          baseAddress,
                          compressed.count,
                          nil,
                          COMPRESSION_ZLIB
                      )
                  }
                  guard decodedBytes > 0 else { return nil }
                  return Data(destBuffer.prefix(decodedBytes))
              }

              private static func readUInt16LE(_ bytes: [UInt8], _ offset: Int) -> UInt16 {
                  UInt16(bytes[offset]) | (UInt16(bytes[offset + 1]) << 8)
              }

              private static func readUInt32LE(_ bytes: [UInt8], _ offset: Int) -> UInt32 {
                  UInt32(bytes[offset]) |
                  (UInt32(bytes[offset + 1]) << 8) |
                  (UInt32(bytes[offset + 2]) << 16) |
                  (UInt32(bytes[offset + 3]) << 24)
              }

              private static func extractFirstTagContent(_ tagName: String, from xml: String) -> String? {
                  guard let openRange = xml.range(of: "<\(tagName)", options: .caseInsensitive),
                        let gtRange = xml.range(of: ">", range: openRange.upperBound..<xml.endIndex),
                        let closeRange = xml.range(of: "</\(tagName)>", options: .caseInsensitive, range: gtRange.upperBound..<xml.endIndex) else {
                      return nil
                  }
                  let raw = String(xml[gtRange.upperBound..<closeRange.lowerBound])
                  let decoded = decodeHTMLEntities(raw).trimmingCharacters(in: .whitespacesAndNewlines)
                  return decoded.isEmpty ? nil : decoded
              }

              private static func extractAllTags(named tagName: String, from xml: String) -> [String] {
                  var results: [String] = []
                  var searchStart = xml.startIndex
                  while let start = xml.range(of: "<\(tagName)", options: .caseInsensitive, range: searchStart..<xml.endIndex),
                        let end = xml.range(of: ">", range: start.lowerBound..<xml.endIndex) {
                      results.append(String(xml[start.lowerBound...end.lowerBound]))
                      searchStart = end.upperBound
                  }
                  return results
              }

              private static func extractAttribute(_ attr: String, inTagContaining tagKeyword: String, from xml: String) -> String? {
                  let tags = extractAllTags(named: tagKeyword, from: xml)
                  for tag in tags {
                      if let val = extractAttribute(attr, fromTag: tag) {
                          return val
                      }
                  }
                  return nil
              }

              private static func extractAttribute(_ attr: String, fromTag tag: String) -> String? {
                  for quote in ["\"", "'"] {
                      let pattern = "\(attr)=\(quote)"
                      if let r1 = tag.range(of: pattern, options: .caseInsensitive),
                         let r2 = tag.range(of: quote, range: r1.upperBound..<tag.endIndex) {
                          return String(tag[r1.upperBound..<r2.lowerBound])
                      }
                  }
                  return nil
              }

              public static func extractTitleAndParagraphs(fromHTML html: String, fallbackIndex: Int, fallbackTitle: String? = nil) -> (String, [String]) {
                  let headingTitle = extractFirstTagContent("h1", from: html)
                      ?? extractFirstTagContent("h2", from: html)
                      ?? extractFirstTagContent("title", from: html)

                  var body = html
                  for ignoredTag in ["head", "style", "script"] {
                      while let s = body.range(of: "<\(ignoredTag)", options: .caseInsensitive),
                            let e = body.range(of: "</\(ignoredTag)>", options: .caseInsensitive, range: s.lowerBound..<body.endIndex) {
                          body.removeSubrange(s.lowerBound..<e.upperBound)
                      }
                  }

                  let blockReplacements = ["</p>", "</div>", "</h1>", "</h2>", "</h3>", "</h4>", "</li>", "<br>", "<br/>", "<br />"]
                  for token in blockReplacements {
                      body = body.replacingOccurrences(of: token, with: "\n\n", options: .caseInsensitive)
                  }

                  var plain = ""
                  var inTag = false
                  for ch in body {
                      if ch == "<" { inTag = true; continue }
                      if ch == ">" { inTag = false; continue }
                      if !inTag { plain.append(ch) }
                  }

                  let decoded = decodeHTMLEntities(plain)
                  let paragraphs = decoded
                      .components(separatedBy: "\n")
                      .map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
                      .filter { !$0.isEmpty }

                  let defaultFallback = fallbackTitle ?? "الفصل \(fallbackIndex)"
                  let resolvedTitle = (headingTitle?.isEmpty == false ? headingTitle! : (paragraphs.first?.count ?? 100 <= 55 ? paragraphs.first! : defaultFallback))
                  return (resolvedTitle, paragraphs)
              }

              private static func decodeHTMLEntities(_ text: String) -> String {
                  text.replacingOccurrences(of: "&nbsp;", with: " ")
                      .replacingOccurrences(of: "&amp;", with: "&")
                      .replacingOccurrences(of: "&quot;", with: "\"")
                      .replacingOccurrences(of: "&#39;", with: "'")
                      .replacingOccurrences(of: "&apos;", with: "'")
                      .replacingOccurrences(of: "&lt;", with: "<")
                      .replacingOccurrences(of: "&gt;", with: ">")
                      .replacingOccurrences(of: "&#8211;", with: "–")
                      .replacingOccurrences(of: "&#8212;", with: "—")
              }
          }
