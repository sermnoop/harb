          struct HarborMusicTrackRow: View {
              @EnvironmentObject var store: HarborStore
              @EnvironmentObject var audioManager: HarborAudioPlayerManager
              let track: HarborMusicTrack
              let isCurrent: Bool
              let isPlaying: Bool
              let onTapTrack: () -> Void
              var onTapArtist: () -> Void = {}

