      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact (No Double-Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
          compression-level: 0

      - name: Publish Direct Harbor.ipa to GitHub Releases (No Unzip Required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.8.0-latest build/Harbor.ipa             --title "Harbor iOS v2.8.0 Noir Edition (Direct Harbor.ipa)"             --notes "Direct Harbor.ipa download for iPhone — no ZIP extraction required."             --latest || gh release upload v2.8.0-latest build/Harbor.ipa --clobber || true
