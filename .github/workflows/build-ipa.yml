                                                                  .frame(width: 50, height: 50)
                                                              }
                                                          }
                                                          .frame(width: 50, height: 50)

                                                          VStack(alignment: .leading, spacing: 2) {
                                                              Text(item.title)
                                                                  .font(.system(size: 12.5, weight: .bold))
                                                                  .foregroundStyle(.white)
                                                                  .lineLimit(1)
                                                              Text(item.artist)
                                                                  .font(.system(size: 10.5, weight: .medium))
                                                                  .foregroundStyle(.white.opacity(0.55))
                                                                  .lineLimit(1)
