                                          .font(.harborSubheadline)
                                          .foregroundStyle(.secondary)
                                      Button("إعادة المحاولة") {
                                          Task { await reloadStreams(episodeId: selectedEpisode?.id) }
                                      }
                                      .font(.harborCaption.weight(.bold))
                                      .foregroundStyle(store.theme.accent)
                                  }
                                  .padding(.vertical, 12)
                              } else {
