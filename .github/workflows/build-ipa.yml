name: Build Harbor iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Source Files and Project Spec
        run: |
          rm -f /tmp/ThmanyahSans-Regular.ttf
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z" "*ThmanyahSans-Regular.ttf" -d /tmp/harbor_font_extract 2>/dev/null || true
            fi
          done
          FOUND_TTF=$(find . /tmp/harbor_font_extract -maxdepth 4 -name "ThmanyahSans-Regular.ttf" 2>/dev/null | head -n 1 || true)
          if [ -n "$FOUND_TTF" ] && [ -f "$FOUND_TTF" ]; then
            cp -f "$FOUND_TTF" /tmp/ThmanyahSans-Regular.ttf
          fi
          rm -rf Sources/HarborIOS
          mkdir -p Sources/HarborIOS
          if [ -f /tmp/ThmanyahSans-Regular.ttf ]; then
            cp -f /tmp/ThmanyahSans-Regular.ttf Sources/HarborIOS/ThmanyahSans-Regular.ttf
          elif [ -f "/System/Library/Fonts/SFArabic.ttf" ]; then
            cp -f "/System/Library/Fonts/SFArabic.ttf" Sources/HarborIOS/ThmanyahSans-Regular.ttf
          elif [ -f "/System/Library/Fonts/Supplemental/Arial Unicode.ttf" ]; then
            cp -f "/System/Library/Fonts/Supplemental/Arial Unicode.ttf" Sources/HarborIOS/ThmanyahSans-Regular.ttf
          fi

          cat << 'EOF' > Sources/HarborIOS/Models.swift
          import SwiftUI
          import Foundation

          // MARK: - 1. Harbor Theme Engine & App Configuration

          enum HarborThemePreset: String, CaseIterable, Identifiable, Codable {
              case harbor = "Harbor"
              case nord = "Nord"
              case dracula = "Dracula"
              case royal = "Royal"
              case noir = "Noir"
              case aurora = "Aurora"

              var id: String { rawValue }

              var backgroundPrimary: Color {
                  switch self {
                  case .harbor:  return Color.black
                  case .nord:    return Color(red: 0.18, green: 0.20, blue: 0.25)
                  case .dracula: return Color(red: 0.16, green: 0.16, blue: 0.21)
                  case .royal:   return Color(red: 0.08, green: 0.05, blue: 0.16)
                  case .noir:    return Color.black
                  case .aurora:  return Color(red: 0.04, green: 0.11, blue: 0.12)
                  }
              }

              var backgroundSecondary: Color {
                  switch self {
                  case .harbor:  return Color(white: 0.07)
                  case .nord:    return Color(red: 0.23, green: 0.26, blue: 0.32)
                  case .dracula: return Color(red: 0.21, green: 0.22, blue: 0.29)
                  case .royal:   return Color(red: 0.14, green: 0.09, blue: 0.26)
                  case .noir:    return Color(white: 0.07)
                  case .aurora:  return Color(red: 0.07, green: 0.18, blue: 0.20)
                  }
              }

              var accent: Color {
                  switch self {
                  case .harbor:  return Color(red: 0.22, green: 0.68, blue: 0.98)
                  case .nord:    return Color(red: 0.53, green: 0.75, blue: 0.82)
                  case .dracula: return Color(red: 0.74, green: 0.58, blue: 0.98)
                  case .royal:   return Color(red: 0.95, green: 0.73, blue: 0.25)
                  case .noir:    return Color.white
                  case .aurora:  return Color(red: 0.20, green: 0.88, blue: 0.68)
                  }
              }
          }

          enum StreamSafetyFilter: String, CaseIterable, Identifiable, Codable {
              case strict = "Strict"
              case balanced = "Balanced"
              case off = "Off"

              var id: String { rawValue }

              var localizedTitle: String {
                  switch self {
                  case .strict: return "صارم (Strict)"
                  case .balanced: return "متوازن (Balanced)"
                  case .off: return "متوقف (Off)"
                  }
              }
          }

          enum DebridProviderType: String, CaseIterable, Identifiable, Codable {
              case none = "Direct HTTP / HLS"
              case realDebrid = "Real-Debrid"
              case torBox = "TorBox"

              var id: String { rawValue }
          }

          // MARK: - 2. Stremio Protocol & Media Domain Models

          enum MediaType: String, Codable, CaseIterable, Identifiable {
              case movie = "movie"
              case series = "series"
              case anime = "anime"

              var id: String { rawValue }

              var arabicTitle: String {
                  switch self {
                  case .movie: return "أفلام"
                  case .series: return "مسلسلات"
                  case .anime: return "أنمي"
                  }
              }
          }

          struct StremioManifest: Codable, Identifiable, Hashable {
              let id: String
              let version: String
              let name: String
              let description: String?
              let logo: String?
              let types: [String]?
              let catalogs: [StremioCatalogDescriptor]?
              var transportUrl: String?
          }

          struct StremioCatalogDescriptor: Codable, Hashable, Identifiable {
              var id: String { "\(type)_\(catalogId)" }
              let type: String
              let catalogId: String
              let name: String?

              enum CodingKeys: String, CodingKey {
                  case type
                  case catalogId = "id"
                  case name
              }
          }

          struct StremioCatalogResponse: Codable {
              let metas: [StremioMetaPreview]
          }

          struct StremioMetaResponse: Codable {
              let meta: StremioMetaDetail
          }

          struct StremioMetaPreview: Codable, Identifiable, Hashable {
              let id: String
              let type: String
              let name: String
              let poster: String?
              let background: String?
              let logo: String?
              let description: String?
              let releaseInfo: String?
              let imdbRating: String?
              let genres: [String]?

              var displayYear: String {
                  releaseInfo ?? ""
              }
          }

          struct StremioMetaDetail: Codable, Identifiable, Hashable {
              let id: String
              let type: String
              let name: String
              let poster: String?
              let background: String?
              let logo: String?
              let description: String?
              let releaseInfo: String?
              let imdbRating: String?
              let runtime: String?
              let genres: [String]?
              let cast: [String]?
              let director: [String]?
              let awards: String?
              let videos: [StremioEpisodeVideo]?
          }

          struct StremioEpisodeVideo: Codable, Identifiable, Hashable {
              let id: String
              let title: String?
              let season: Int?
              let episode: Int?
              let overview: String?
              let thumbnail: String?
              let released: String?

              var displayTitle: String {
                  if let ep = episode {
                      return "\(ep). \(title ?? "Episode \(ep)")"
                  }
                  return title ?? id
              }
          }

          struct StremioStreamResponse: Codable {
              let streams: [StremioRawStream]
          }

          struct StremioRawStream: Codable, Hashable {
              let name: String?
              let title: String?
              let description: String?
              let url: String?
              let infoHash: String?
              let fileIdx: Int?
              let externalUrl: String?
              let behaviorHints: StremioBehaviorHints?

              var combinedText: String {
                  [name, title, description].compactMap { $0 }.joined(separator: " ")
              }
          }

          struct StremioBehaviorHints: Codable, Hashable {
              let bingeGroup: String?
              let filename: String?
              let videoSize: Int64?
              let notWebReady: Bool?
          }

          struct WatchProgressItem: Codable, Identifiable, Hashable {
              let id: String
              let mediaType: String
              let title: String
              let subtitle: String?
              let poster: String?
              let backdrop: String?
              let streamURL: String
              var positionSeconds: Double
              var durationSeconds: Double
              var updatedAt: Date

              var progressFraction: Double {
                  guard durationSeconds > 0 else { return 0 }
                  return min(max(positionSeconds / durationSeconds, 0), 1)
              }

              var isCompleted: Bool {
                  progressFraction >= 0.85
              }
          }

          // MARK: - 3. Music & Audio Domain Models

          struct HarborMusicTrack: Identifiable, Codable, Hashable {
              let id: String
              let title: String
              let artist: String
              let album: String
              let artworkURL: String?
              let streamURL: String
              let durationSeconds: Double
              let genre: String?
              let isLiveStream: Bool
          }

          struct ITunesSearchResponse: Codable {
              let results: [ITunesTrackItem]
          }

          struct ITunesTrackItem: Codable {
              let trackId: Int?
              let trackName: String?
              let artistName: String?
              let collectionName: String?
              let artworkUrl100: String?
              let previewUrl: String?
              let trackTimeMillis: Int?
              let primaryGenreName: String?
          }

          struct LRCLibResponse: Codable {
              let id: Int?
              let trackName: String?
              let artistName: String?
              let plainLyrics: String?
              let syncedLyrics: String?
          }

          struct SyncedLyricLine: Identifiable, Codable, Hashable {
              var id: UUID = UUID()
              let timestampSeconds: Double
              let text: String
          }

          // MARK: - 3B. User Music Playlist Model (v3.0)

          struct HarborMusicPlaylist: Identifiable, Codable, Hashable {
              let id: String
              var name: String
              var tracks: [HarborMusicTrack]
              var createdAt: Date

              init(id: String = UUID().uuidString, name: String, tracks: [HarborMusicTrack] = [], createdAt: Date = Date()) {
                  self.id = id
                  self.name = name
                  self.tracks = tracks
                  self.createdAt = createdAt
              }
          }

          // MARK: - 4. Books & Ebooks Domain Models (Open Library & Project Gutenberg)

          struct HarborBookItem: Identifiable, Codable, Hashable {
              let id: String
              let title: String
              let authors: [String]
              let coverURL: String?
              let publishYear: String?
              let subjects: [String]
              let description: String?
              let textContentURL: String?
              let sampleChapters: [HarborBookChapter]
              var savedBookmarkChapter: Int = 0
              var savedScrollProgress: Double = 0.0

              var authorLine: String {
                  authors.isEmpty ? "مؤلف غير معروف" : authors.joined(separator: "، ")
              }
          }

          struct HarborBookChapter: Identifiable, Codable, Hashable {
              var id: String { "\(number)-\(title)" }
              let number: Int
              let title: String
              let body: String
          }

          struct GutendexResponse: Codable {
              let results: [GutendexBook]
          }

          struct GutendexBook: Codable {
              let id: Int
              let title: String
              let authors: [GutendexAuthor]
              let subjects: [String]?
              let formats: [String: String]
              let downloadCount: Int?

              enum CodingKeys: String, CodingKey {
                  case id, title, authors, subjects, formats
                  case downloadCount = "download_count"
              }
          }

          struct GutendexAuthor: Codable {
              let name: String
          }

          struct OpenLibrarySearchResponse: Codable {
              let docs: [OpenLibraryDoc]
          }

          struct OpenLibraryDoc: Codable {
              let key: String?
              let title: String?
              let author_name: [String]?
              let first_publish_year: Int?
              let cover_i: Int?
              let subject: [String]?
          }
          EOF

          cat << 'EOF' > Sources/HarborIOS/HarborStreamEngine.swift
          import Foundation

          // MARK: - 5. Harbor Stream Engine (Port of harbor-core Rust crate)
          // Implements the 4-stage pipeline: Parse -> Trust -> Score -> Rank

          enum StreamQualityTier: String, CaseIterable, Comparable, Codable {
              case uhd4KDV = "4K DV"
              case uhd4KHDR = "4K HDR"
              case uhd4K = "4K"
              case fhd1080pHDR = "1080p HDR"
              case fhd1080p = "1080p"
              case hd720p = "720p"
              case sd = "SD"

              private var sortOrder: Int {
                  switch self {
                  case .uhd4KDV: return 7
                  case .uhd4KHDR: return 6
                  case .uhd4K: return 5
                  case .fhd1080pHDR: return 4
                  case .fhd1080p: return 3
                  case .hd720p: return 2
                  case .sd: return 1
                  }
              }

              static func < (lhs: StreamQualityTier, rhs: StreamQualityTier) -> Bool {
                  lhs.sortOrder < rhs.sortOrder
              }
          }

          struct HarborRankedStream: Identifiable, Hashable {
              let id = UUID()
              let addonName: String
              let raw: StremioRawStream
              let resolution: String
              let hdrFlavor: String?
              let videoCodec: String?
              let audioTag: String?
              let sourceType: String?
              let fileSizeDisplay: String?
              let seeders: Int
              let isCachedDebrid: Bool
              let debridBadge: String?
              let tier: StreamQualityTier
              let score: Int
              let scoreReasons: [String]
              let isTrusted: Bool
              let rejectionReason: String?

              var playableHTTPURL: URL? {
                  guard let urlStr = raw.url, let url = URL(string: urlStr) else { return nil }
                  return url
              }
          }

          enum HarborStreamEngine {

              /// Executes Harbor's 4-stage pipeline (`parse -> trust -> score -> rank`)
              static func processStreams(
                  rawStreams: [(addonName: String, stream: StremioRawStream)],
                  expectedTitle: String,
                  safetyFilter: StreamSafetyFilter
              ) -> [HarborRankedStream] {
                  var results: [HarborRankedStream] = []

                  for entry in rawStreams {
                      let parsed = parse(addonName: entry.addonName, raw: entry.stream)
                      let trusted = trust(parsed: parsed, expectedTitle: expectedTitle, filter: safetyFilter)
                      let scored = score(stream: trusted)
                      results.append(scored)
                  }

                  // Stage 4: Rank (filter untrusted unless safetyFilter == .off, then sort by cached status, tier, and score)
                  return results
                      .filter { safetyFilter == .off ? true : $0.isTrusted }
                      .sorted { lhs, rhs in
                          if lhs.isCachedDebrid != rhs.isCachedDebrid {
                              return lhs.isCachedDebrid && !rhs.isCachedDebrid
                          }
                          if lhs.tier != rhs.tier {
                              return lhs.tier > rhs.tier
                          }
                          return lhs.score > rhs.score
                      }
              }

              // Stage 1: Parse
              private static func parse(addonName: String, raw: StremioRawStream) -> HarborRankedStream {
                  let text = raw.combinedText
                  let upper = text.uppercased()

                  // Resolution
                  let resolution: String
                  if upper.contains("2160P") || upper.contains("4K") || upper.contains("UHD") {
                      resolution = "4K"
                  } else if upper.contains("1080P") || upper.contains("FHD") {
                      resolution = "1080p"
                  } else if upper.contains("720P") || upper.contains("HD") {
                      resolution = "720p"
                  } else {
                      resolution = "SD"
                  }

                  // HDR Flavor
                  let hdrFlavor: String?
                  if upper.contains("DOLBY VISION") || upper.contains("DV") || upper.contains("DOVI") {
                      hdrFlavor = "Dolby Vision"
                  } else if upper.contains("HDR10+") {
                      hdrFlavor = "HDR10+"
                  } else if upper.contains("HDR10") || upper.contains("HDR") {
                      hdrFlavor = "HDR10"
                  } else if upper.contains("HLG") {
                      hdrFlavor = "HLG"
                  } else {
                      hdrFlavor = nil
                  }

                  // Video Codec
                  let videoCodec: String?
                  if upper.contains("HEVC") || upper.contains("X265") || upper.contains("H265") || upper.contains("H.265") {
                      videoCodec = "HEVC"
                  } else if upper.contains("AV1") {
                      videoCodec = "AV1"
                  } else if upper.contains("X264") || upper.contains("H264") || upper.contains("H.264") || upper.contains("AVC") {
                      videoCodec = "AVC"
                  } else {
                      videoCodec = nil
                  }

                  // Audio Codec & Channels
                  let audioTag: String?
                  if upper.contains("ATMOS") {
                      audioTag = "Dolby Atmos"
                  } else if upper.contains("TRUEHD") {
                      audioTag = "TrueHD"
                  } else if upper.contains("DTS-HD") || upper.contains("DTS-MA") {
                      audioTag = "DTS-HD MA"
                  } else if upper.contains("DDP") || upper.contains("EAC3") || upper.contains("5.1") || upper.contains("7.1") {
                      audioTag = "5.1 Surround"
                  } else if upper.contains("AAC") || upper.contains("FLAC") {
                      audioTag = "Stereo AAC"
                  } else {
                      audioTag = nil
                  }

                  // Source Type
                  let sourceType: String?
                  if upper.contains("REMUX") {
                      sourceType = "BluRay Remux"
                  } else if upper.contains("BLURAY") || upper.contains("BLU-RAY") {
                      sourceType = "BluRay"
                  } else if upper.contains("WEB-DL") || upper.contains("WEBDL") {
                      sourceType = "WEB-DL"
                  } else if upper.contains("WEBRIP") {
                      sourceType = "WEBRip"
                  } else if upper.contains("HDCAM") || upper.contains("TELESYNC") {
                      sourceType = "CAM"
                  } else {
                      sourceType = nil
                  }

                  // Cached Debrid Detection
                  let isCached = upper.contains("[RD+]") || upper.contains("[TB+]") || upper.contains("[AD+]") ||
                                 upper.contains("⚡") || upper.contains("INSTANT") || (raw.url?.hasPrefix("http") == true)

                  let debridBadge: String?
                  if upper.contains("RD+") || upper.contains("REAL-DEBRID") {
                      debridBadge = "RD+"
                  } else if upper.contains("TB+") || upper.contains("TORBOX") {
                      debridBadge = "TB+"
                  } else if raw.url?.hasPrefix("http") == true {
                      debridBadge = "HTTP/HLS"
                  } else {
                      debridBadge = nil
                  }

                  // Extract Seeders (👤 145 or S: 145)
                  var seeders = 0
                  if let range = text.range(of: #"👤\s*(\d+)"#, options: .regularExpression) {
                      let digits = text[range].filter { $0.isNumber }
                      seeders = Int(digits) ?? 0
                  }

                  // Extract File Size (💾 4.2 GB)
                  var fileSizeDisplay: String? = nil
                  if let sizeBytes = raw.behaviorHints?.videoSize, sizeBytes > 0 {
                      let gb = Double(sizeBytes) / 1_073_741_824.0
                      fileSizeDisplay = gb >= 1.0 ? String(format: "%.2f GB", gb) : String(format: "%.0f MB", gb * 1024)
                  } else if let range = text.range(of: #"(\d+(?:\.\d+)?\s*(?:GB|MB))"#, options: [.regularExpression, .caseInsensitive]) {
                      fileSizeDisplay = String(text[range])
                  }

                  // Quality Tier
                  let tier: StreamQualityTier
                  switch (resolution, hdrFlavor) {
                  case ("4K", .some("Dolby Vision")): tier = .uhd4KDV
                  case ("4K", .some(_)):              tier = .uhd4KHDR
                  case ("4K", .none):                 tier = .uhd4K
                  case ("1080p", .some(_)):           tier = .fhd1080pHDR
                  case ("1080p", .none):              tier = .fhd1080p
                  case ("720p", _):                   tier = .hd720p
                  default:                            tier = .sd
                  }

                  return HarborRankedStream(
                      addonName: addonName,
                      raw: raw,
                      resolution: resolution,
                      hdrFlavor: hdrFlavor,
                      videoCodec: videoCodec,
                      audioTag: audioTag,
                      sourceType: sourceType,
                      fileSizeDisplay: fileSizeDisplay,
                      seeders: seeders,
                      isCachedDebrid: isCached,
                      debridBadge: debridBadge,
                      tier: tier,
                      score: 0,
                      scoreReasons: [],
                      isTrusted: true,
                      rejectionReason: nil
                  )
              }

              // Stage 2: Trust
              private static func trust(
                  parsed: HarborRankedStream,
                  expectedTitle: String,
                  filter: StreamSafetyFilter
              ) -> HarborRankedStream {
                  let upper = parsed.raw.combinedText.uppercased()

                  // Must have either a valid URL or an infoHash for Debrid resolution
                  let hasValidTarget = (parsed.raw.url != nil && !parsed.raw.url!.isEmpty) ||
                                       (parsed.raw.infoHash != nil && !parsed.raw.infoHash!.isEmpty)
                  if !hasValidTarget {
                      return HarborRankedStream(
                          addonName: parsed.addonName, raw: parsed.raw, resolution: parsed.resolution,
                          hdrFlavor: parsed.hdrFlavor, videoCodec: parsed.videoCodec, audioTag: parsed.audioTag,
                          sourceType: parsed.sourceType, fileSizeDisplay: parsed.fileSizeDisplay, seeders: parsed.seeders,
                          isCachedDebrid: parsed.isCachedDebrid, debridBadge: parsed.debridBadge, tier: parsed.tier,
                          score: -100, scoreReasons: ["رابط غير صالح"], isTrusted: false, rejectionReason: "Dead or empty link"
                      )
                  }

                  if filter == .strict && parsed.sourceType == "CAM" {
                      return HarborRankedStream(
                          addonName: parsed.addonName, raw: parsed.raw, resolution: parsed.resolution,
                          hdrFlavor: parsed.hdrFlavor, videoCodec: parsed.videoCodec, audioTag: parsed.audioTag,
                          sourceType: parsed.sourceType, fileSizeDisplay: parsed.fileSizeDisplay, seeders: parsed.seeders,
                          isCachedDebrid: parsed.isCachedDebrid, debridBadge: parsed.debridBadge, tier: parsed.tier,
                          score: -50, scoreReasons: ["تم استبعاد نسخة CAM بواسطة الفلتر الصارم"], isTrusted: false, rejectionReason: "Low-quality CAM filtered"
                      )
                  }

                  if filter != .off && (upper.contains("SAMPLE") || upper.contains("TRAILER ONLY") || upper.contains(".EXE")) {
                      return HarborRankedStream(
                          addonName: parsed.addonName, raw: parsed.raw, resolution: parsed.resolution,
                          hdrFlavor: parsed.hdrFlavor, videoCodec: parsed.videoCodec, audioTag: parsed.audioTag,
                          sourceType: parsed.sourceType, fileSizeDisplay: parsed.fileSizeDisplay, seeders: parsed.seeders,
                          isCachedDebrid: parsed.isCachedDebrid, debridBadge: parsed.debridBadge, tier: parsed.tier,
                          score: -200, scoreReasons: ["ملف مشبوه أو عينة فقط"], isTrusted: false, rejectionReason: "Sample / unsafe file"
                      )
                  }

                  return parsed
              }

              // Stage 3: Score
              private static func score(stream: HarborRankedStream) -> HarborRankedStream {
                  var total = 0
                  var reasons: [String] = []

                  if stream.isCachedDebrid {
                      total += 100
                      reasons.append("+100 جاهز للبث المباشر (Debrid/HTTP)")
                  }

                  switch stream.resolution {
                  case "4K":
                      total += 60
                      reasons.append("+60 دقة 4K UHD")
                  case "1080p":
                      total += 45
                      reasons.append("+45 دقة 1080p FHD")
                  case "720p":
                      total += 25
                      reasons.append("+25 دقة 720p HD")
                  default:
                      total += 10
                  }

                  if let hdr = stream.hdrFlavor {
                      total += 25
                      reasons.append("+25 دعم \(hdr)")
                  }

                  if let codec = stream.videoCodec {
                      total += (codec == "HEVC" || codec == "AV1") ? 15 : 10
                      reasons.append("+15 ترميز \(codec)")
                  }

                  if let audio = stream.audioTag {
                      total += audio.contains("Atmos") || audio.contains("TrueHD") ? 20 : 10
                      reasons.append("+15 صوت \(audio)")
                  }

                  if let src = stream.sourceType {
                      if src == "BluRay Remux" || src == "WEB-DL" {
                          total += 20
                          reasons.append("+20 مصدر \(src)")
                      } else if src == "CAM" {
                          total -= 40
                          reasons.append("-40 جودة CAM")
                      }
                  }

                  if stream.seeders > 50 {
                      total += 15
                      reasons.append("+15 توافر عالٍ (\(stream.seeders) متاح)")
                  }

                  return HarborRankedStream(
                      addonName: stream.addonName,
                      raw: stream.raw,
                      resolution: stream.resolution,
                      hdrFlavor: stream.hdrFlavor,
                      videoCodec: stream.videoCodec,
                      audioTag: stream.audioTag,
                      sourceType: stream.sourceType,
                      fileSizeDisplay: stream.fileSizeDisplay,
                      seeders: stream.seeders,
                      isCachedDebrid: stream.isCachedDebrid,
                      debridBadge: stream.debridBadge,
                      tier: stream.tier,
                      score: total,
                      scoreReasons: reasons,
                      isTrusted: stream.isTrusted,
                      rejectionReason: stream.rejectionReason
                  )
              }
          }
          EOF

          cat << 'EOF' > Sources/HarborIOS/DebridService.swift
          import Foundation

          enum DebridError: LocalizedError {
              case missingAPIKey(String)
              case unrestrictFailed(String)
              case noPlayableURL

              var errorDescription: String? {
                  switch self {
                  case .missingAPIKey(let provider):
                      return "يرجى إدخال مفتاح API الخاص بخدمة \(provider) في الإعدادات لتحويل ملفات التورنت (InfoHash) إلى بث مباشر."
                  case .unrestrictFailed(let msg):
                      return "تعذر فك تقييد الرابط عبر خدمة Real-Debrid: \(msg)"
                  case .noPlayableURL:
                      return "لا يتوفر رابط HTTP/HLS مباشر قابل للتشغيل لهذا المصدر."
                  }
              }
          }

          actor DebridService {
              static let shared = DebridService()

              struct RDUnrestrictResponse: Codable {
                  let id: String?
                  let filename: String?
                  let download: String?
                  let streamable: Int?
              }

              struct RDAddMagnetResponse: Codable {
                  let id: String
                  let uri: String?
              }

              struct RDTorrentFile: Codable {
                  let id: Int
                  let path: String
                  let bytes: Int64
                  let selected: Int?
              }

              struct RDTorrentInfoResponse: Codable {
                  let id: String
                  let status: String
                  let links: [String]?
                  let files: [RDTorrentFile]?
              }

              private func cleanToken(_ raw: String) -> String {
                  var t = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  if t.lowercased().hasPrefix("bearer ") {
                      t = String(t.dropFirst(7)).trimmingCharacters(in: .whitespacesAndNewlines)
                  }
                  return t
              }

              func verifyRealDebridAccount(token: String) async -> String {
                  let clean = cleanToken(token)
                  guard !clean.isEmpty, let url = URL(string: "https://api.real-debrid.com/rest/1.0/user") else {
                      return "يرجى إدخال مفتاح API أولاً"
                  }
                  var req = URLRequest(url: url)
                  req.setValue("Bearer \(clean)", forHTTPHeaderField: "Authorization")
                  req.timeoutInterval = 8
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse, http.statusCode == 200,
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                          return "❌ مفتاح Real-Debrid غير صالح أو منتهي الصلاحية"
                      }
                      let username = (json["username"] as? String) ?? "User"
                      let type = (json["type"] as? String)?.uppercased() ?? "PREMIUM"
                      let exp = String(((json["expiration"] as? String) ?? "").prefix(10))
                      return "✅ متصل بنجاح: \(username) (\(type)) • ينتهي: \(exp)"
                  } catch {
                      return "❌ تعذر الاتصال بخادم Real-Debrid"
                  }
              }

              func resolvePlayableURL(
                  for stream: HarborRankedStream,
                  provider: DebridProviderType,
                  realDebridToken: String,
                  torBoxKey: String
              ) async throws -> URL {
                  let rdClean = cleanToken(realDebridToken)
                  let tbClean = cleanToken(torBoxKey)

                  // 1. If the stream has an InfoHash and user entered a Real-Debrid token, ALWAYS resolve via Real-Debrid first!
                  if let infoHash = stream.raw.infoHash, !infoHash.isEmpty {
                      if !rdClean.isEmpty {
                          return try await resolveInfoHashWithRealDebrid(infoHash: infoHash, fileIdx: stream.raw.fileIdx, token: rdClean)
                      }
                      if !tbClean.isEmpty {
                          return try await resolveInfoHashWithTorBox(infoHash: infoHash, apiKey: tbClean)
                      }
                      // Fallback to cloud stream if user hasn't entered any Debrid key
                      if let ext = stream.raw.externalUrl, let fallbackURL = URL(string: ext) {
                          return fallbackURL
                      }
                      throw DebridError.missingAPIKey("Real-Debrid")
                  }

                  // 2. If the stream has a direct URL (from Torrentio RD, PlavioHD, or Cloud Server)
                  if let rawURLStr = stream.raw.url, !rawURLStr.isEmpty, let directURL = URL(string: rawURLStr) {
                      if !rdClean.isEmpty && (rawURLStr.contains("real-debrid.com/d/") == false) && (rawURLStr.contains("magnet:?") || rawURLStr.contains("1fichier") || rawURLStr.contains("rapidgator")) {
                          if let unrestricted = try? await unrestrictRealDebridLink(link: rawURLStr, token: rdClean) {
                              return unrestricted
                          }
                      }
                      return directURL
                  }

                  if let ext = stream.raw.externalUrl, let fallbackURL = URL(string: ext) {
                      return fallbackURL
                  }
                  throw DebridError.noPlayableURL
              }

              private func unrestrictRealDebridLink(link: String, token: String) async throws -> URL {
                  guard let url = URL(string: "https://api.real-debrid.com/rest/1.0/unrestrict/link") else {
                      throw DebridError.noPlayableURL
                  }
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                  request.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                  var allowed = CharacterSet.alphanumerics
                  allowed.insert(charactersIn: "-._~")
                  let encodedLink = link.addingPercentEncoding(withAllowedCharacters: allowed) ?? link
                  request.httpBody = "link=\(encodedLink)".data(using: .utf8)

                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {
                      throw DebridError.unrestrictFailed("تعذر فك الرابط (HTTP \((response as? HTTPURLResponse)?.statusCode ?? 0))")
                  }
                  let decoded = try JSONDecoder().decode(RDUnrestrictResponse.self, from: data)
                  guard let dl = decoded.download, let resolvedURL = URL(string: dl) else {
                      throw DebridError.noPlayableURL
                  }
                  return resolvedURL
              }

              private func resolveInfoHashWithRealDebrid(infoHash: String, fileIdx: Int?, token: String) async throws -> URL {
                  let cleanHash = infoHash.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  let magnet = "magnet:?xt=urn:btih:\(cleanHash)"
                  guard let addURL = URL(string: "https://api.real-debrid.com/rest/1.0/torrents/addMagnet") else {
                      throw DebridError.noPlayableURL
                  }
                  var allowed = CharacterSet.alphanumerics
                  allowed.insert(charactersIn: "-._~")
                  let encodedMagnet = magnet.addingPercentEncoding(withAllowedCharacters: allowed) ?? magnet

                  var addReq = URLRequest(url: addURL)
                  addReq.httpMethod = "POST"
                  addReq.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                  addReq.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                  addReq.httpBody = "magnet=\(encodedMagnet)".data(using: .utf8)

                  let (addData, addResp) = try await URLSession.shared.data(for: addReq)
                  guard let addHttp = addResp as? HTTPURLResponse, (200..<300).contains(addHttp.statusCode) else {
                      throw DebridError.unrestrictFailed("تأكد من صلاحية مفتاح Real-Debrid API (كود \((addResp as? HTTPURLResponse)?.statusCode ?? 0))")
                  }
                  let added = try JSONDecoder().decode(RDAddMagnetResponse.self, from: addData)

                  // Step 2: Inspect files inside torrent and pick the largest video file (.mp4 preferred for native iOS AVPlayer, then .mkv)
                  guard let infoURL = URL(string: "https://api.real-debrid.com/rest/1.0/torrents/info/\(added.id)") else {
                      throw DebridError.noPlayableURL
                  }
                  var infoReq = URLRequest(url: infoURL)
                  infoReq.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")

                  var selectedFileParam = "all"
                  if let (initialData, _) = try? await URLSession.shared.data(for: infoReq),
                     let initialInfo = try? JSONDecoder().decode(RDTorrentInfoResponse.self, from: initialData),
                     let files = initialInfo.files, !files.isEmpty {
                      let videoExtensions = [".mp4", ".m4v", ".mkv", ".mov", ".avi", ".webm", ".ts"]
                      let videoFiles = files.filter { f in
                          let lower = f.path.lowercased()
                          return videoExtensions.contains(where: { lower.hasSuffix($0) }) && !lower.contains("sample")
                      }
                      if let mp4File = videoFiles.filter({ $0.path.lowercased().hasSuffix(".mp4") }).max(by: { $0.bytes < $1.bytes }) {
                          selectedFileParam = "\(mp4File.id)"
                      } else if let largestVideo = videoFiles.max(by: { $0.bytes < $1.bytes }) {
                          selectedFileParam = "\(largestVideo.id)"
                      } else if let largestAny = files.max(by: { $0.bytes < $1.bytes }) {
                          selectedFileParam = "\(largestAny.id)"
                      }
                  }

                  // Step 3: Select the target video file WITH Content-Type: application/x-www-form-urlencoded!
                  if let selectURL = URL(string: "https://api.real-debrid.com/rest/1.0/torrents/selectFiles/\(added.id)") {
                      var selectReq = URLRequest(url: selectURL)
                      selectReq.httpMethod = "POST"
                      selectReq.setValue("Bearer \(token)", forHTTPHeaderField: "Authorization")
                      selectReq.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                      selectReq.httpBody = "files=\(selectedFileParam)".data(using: .utf8)
                      _ = try? await URLSession.shared.data(for: selectReq)
                  }

                  // Step 4: Poll torrent info (up to 3 quick checks) for the generated hoster link
                  for _ in 0..<3 {
                      let (finalData, _) = try await URLSession.shared.data(for: infoReq)
                      let finalInfo = try JSONDecoder().decode(RDTorrentInfoResponse.self, from: finalData)
                      if let firstLink = finalInfo.links?.first, !firstLink.isEmpty {
                          return try await unrestrictRealDebridLink(link: firstLink, token: token)
                      }
                      try? await Task.sleep(nanoseconds: 450_000_000)
                  }

                  throw DebridError.unrestrictFailed("هذا التورنت غير مخزن مؤقتاً (Not Cached) على خوادم Real-Debrid حالياً؛ جرب مصدراً آخر يحمل شارة ⚡ [RD+].")
              }

              private func resolveInfoHashWithTorBox(infoHash: String, apiKey: String) async throws -> URL {
                  guard let url = URL(string: "https://api.torbox.app/v1/api/torrents/createtorrent") else {
                      throw DebridError.noPlayableURL
                  }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")
                  req.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                  req.httpBody = "magnet=magnet:?xt=urn:btih:\(infoHash)".data(using: .utf8)

                  let (data, response) = try await URLSession.shared.data(for: req)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {
                      throw DebridError.unrestrictFailed("TorBox API HTTP Error")
                  }
                  if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                     let dataObj = json["data"] as? [String: Any],
                     let torrentId = dataObj["torrent_id"] as? Int,
                     let dlURL = URL(string: "https://api.torbox.app/v1/api/torrents/requestdl?token=\(apiKey)&torrent_id=\(torrentId)&file_id=0") {
                      let (dlData, _) = try await URLSession.shared.data(from: dlURL)
                      if let dlJson = try? JSONSerialization.jsonObject(with: dlData) as? [String: Any],
                         let directLink = dlJson["data"] as? String,
                         let finalURL = URL(string: directLink) {
                          return finalURL
                      }
                  }
                  throw DebridError.unrestrictFailed("تعذر استخراج رابط HTTP مباشر من TorBox")
              }
          }
