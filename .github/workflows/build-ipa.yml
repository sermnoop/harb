name: Build Harbor iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Source Files and Project Spec
        run: |
          mkdir -p Sources/HarborIOS
          if [ -d "Harbor-iOS-SwiftUI/Sources/HarborIOS" ]; then
            cp -r Harbor-iOS-SwiftUI/Sources/HarborIOS/* Sources/HarborIOS/
          elif [ -f "HarborIOS.swift" ] && [ ! -f "Sources/HarborIOS/HarborViews.swift" ]; then
            cp HarborIOS.swift Sources/HarborIOS/
          else
            find . -maxdepth 2 -name "*.swift" -not -path "*/Sources/*" -not -name "Package.swift" -exec cp {} Sources/HarborIOS/ \;
          fi
          rm -f Sources/HarborIOS/Package.swift
          rm -f Sources/HarborIOS/Info.plist
          if [ -f "Sources/HarborIOS/HarborIOS.swift" ] && [ -f "Sources/HarborIOS/HarborViews.swift" ]; then
            rm -f Sources/HarborIOS/HarborIOS.swift
          fi

          cat << 'EOF' >> Sources/HarborIOS/HarborStore.swift

          // MARK: - Full-Track Music & Direct Cloud Stream Engine

          enum JioSaavnStreamCrypto {
              static func decryptURL(_ enc: String) -> String? {
                  guard let data = Data(base64Encoded: enc.trimmingCharacters(in: .whitespacesAndNewlines)),
                        let key = "38346591".data(using: .utf8), !data.isEmpty else { return nil }
                  let bufSize = data.count + kCCBlockSizeDES
                  var out = [UInt8](repeating: 0, count: bufSize)
                  var outLen: size_t = 0
                  let status = data.withUnsafeBytes { inPtr in
                      key.withUnsafeBytes { keyPtr in
                          CCCrypt(CCOperation(kCCDecrypt), CCAlgorithm(kCCAlgorithmDES),
                                  CCOptions(kCCOptionECBMode | kCCOptionPKCS7Padding),
                                  keyPtr.baseAddress, kCCKeySizeDES, nil,
                                  inPtr.baseAddress, data.count, &out, bufSize, &outLen)
                      }
                  }
                  guard status == kCCSuccess,
                        var str = String(data: Data(bytes: out, count: outLen), encoding: .utf8)?
                            .trimmingCharacters(in: .controlCharacters.union(.whitespacesAndNewlines)),
                        str.hasPrefix("http") else { return nil }
                  return str.replacingOccurrences(of: "http://", with: "https://")
                            .replacingOccurrences(of: "_96.mp4", with: "_160.mp4")
                            .replacingOccurrences(of: "_48.mp4", with: "_160.mp4")
              }

              static func searchFullLengthTracks(query: String) async -> [HarborMusicTrack] {
                  let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? query
                  var tracks: [HarborMusicTrack] = []
                  if let direct = await fromJioSaavnDirect(q), !direct.isEmpty { tracks.append(contentsOf: direct) }
                  if tracks.count < 5, let mirrors = await fromSaavnMirrors(q) { tracks.append(contentsOf: mirrors) }
                  if let audius = await fromAudius(q) { tracks.append(contentsOf: audius) }
                  return tracks
              }

              private static func fromJioSaavnDirect(_ q: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://www.jiosaavn.com/api.php?_format=json&_marker=0&ctx=web6dot0&api_version=4&__call=search.getResults&q=\(q)&n=25&p=1") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 8
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["results"] as? [[String: Any]] else { return nil }
                  return items.compactMap { item in
                      let info = item["more_info"] as? [String: Any]
                      guard let enc = info?["encrypted_media_url"] as? String, let stream = decryptURL(enc) else { return nil }
                      let id = (item["id"] as? String) ?? UUID().uuidString
                      let title = clean((item["title"] as? String) ?? (item["song"] as? String) ?? "Song")
                      let artist = clean((info?["music"] as? String) ?? (item["subtitle"] as? String) ?? "Artist")
                      let album = clean((info?["album"] as? String) ?? "Full Track")
                      let dur = Double((info?["duration"] as? String) ?? "") ?? Double((info?["duration"] as? Int) ?? 210)
                      let art = (item["image"] as? String)?.replacingOccurrences(of: "150x150", with: "500x500").replacingOccurrences(of: "http://", with: "https://")
                      return HarborMusicTrack(id: "saavn-\(id)", title: title, artist: artist, album: "\(album) • كامل", artworkURL: art, streamURL: stream, durationSeconds: max(dur, 60), genre: "Full Song", isLiveStream: false)
                  }
              }

              private static func fromSaavnMirrors(_ q: String) async -> [HarborMusicTrack]? {
                  for host in ["https://saavn.sumit.co", "https://saavn.dev"] {
                      guard let url = URL(string: "\(host)/api/search/songs?query=\(q)&limit=20"),
                            let (data, _) = try? await URLSession.shared.data(from: url),
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let dataObj = root["data"] as? [String: Any],
                            let items = dataObj["results"] as? [[String: Any]] else { continue }
                      let list: [HarborMusicTrack] = items.compactMap { item in
                          guard let dls = item["downloadUrl"] as? [[String: Any]],
                                let lastDL = dls.last,
                                let rawLink = (lastDL["url"] as? String) ?? (lastDL["link"] as? String) else { return nil }
                          let title = clean((item["name"] as? String) ?? "Song")
                          let dur = (item["duration"] as? Double) ?? Double((item["duration"] as? Int) ?? 210)
                          let imgs = item["image"] as? [[String: Any]]
                          let art = ((imgs?.last?["url"] as? String) ?? (imgs?.last?["link"] as? String))?.replacingOccurrences(of: "http://", with: "https://")
                          return HarborMusicTrack(id: UUID().uuidString, title: title, artist: "Full Audio", album: "كامل 320kbps", artworkURL: art, streamURL: rawLink.replacingOccurrences(of: "http://", with: "https://"), durationSeconds: max(dur, 60), genre: "Music", isLiveStream: false)
                      }
                      if !list.isEmpty { return list }
                  }
                  return nil
              }

              private static func fromAudius(_ q: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://api.audius.co/v1/tracks/search?query=\(q)&app_name=HarborIOS"),
                        let (data, _) = try? await URLSession.shared.data(from: url),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["data"] as? [[String: Any]] else { return nil }
                  return items.prefix(15).compactMap { item in
                      guard let id = item["id"] as? String, let title = item["title"] as? String else { return nil }
                      let dur = Double((item["duration"] as? Int) ?? 180)
                      guard dur > 40 else { return nil }
                      let user = item["user"] as? [String: Any]
                      let artObj = item["artwork"] as? [String: Any]
                      return HarborMusicTrack(id: "audius-\(id)", title: title, artist: (user?["name"] as? String) ?? "Artist", album: "Audius Full • كامل", artworkURL: (artObj?["480x480"] as? String), streamURL: "https://api.audius.co/v1/tracks/\(id)/stream?app_name=HarborIOS", durationSeconds: dur, genre: "Full Stream", isLiveStream: false)
                  }
              }

              static func clean(_ s: String) -> String {
                  s.replacingOccurrences(of: "&quot;", with: "\"").replacingOccurrences(of: "&amp;", with: "&").replacingOccurrences(of: "&#039;", with: "'")
              }
          }

          enum HarborCloudStreamBuilder {
              static func defaultAddons() -> [StremioManifest] {
                  let specs: [(String, String, String, String)] = [
                      ("com.plaviohd.streams", "PlavioHD Direct HTTPS", "بث مباشر للأفلام والمسلسلات بدقة حتى 4K عبر HTTPS", "https://plaviohd.vercel.app/manifest.json"),
                      ("com.plaviohd.worker", "PlavioHD Edge Mirror", "خادم PlavioHD الاحتياطي للبث المباشر عبر HTTPS", "https://plaviohd.edon.workers.dev/manifest.json"),
                      ("uk.pengu.streams", "PenguPlay HTTP Streams", "سيرفرات بث HTTP مباشرة للأفلام والمسلسلات والأنمي", "https://pengu.uk/manifest.json"),
                      ("org.webstreamrmbg.addon", "WebStreamrMBG HTTP", "روابط بث HTTP مباشرة من 25+ موقع سينمائي", "https://87d6a6ef6b58-webstreamrmbg.baby-beamup.club/manifest.json"),
                      ("app.flixnest.free", "Flix-Streams Free HTTP", "روابط HTTP وHLS مباشرة للأفلام والمسلسلات والأنمي", "https://free.flixnest.app/manifest.json"),
                      ("io.qzz.hdhub", "HdHub Direct Streams", "روابط مشاهدة مباشرة للأفلام والمسلسلات بجودة عالية", "https://hdhub.thevolecitor.qzz.io/manifest.json"),
                      ("com.stremio.torrentio.addon", "Torrentio", "أشهر إضافة مصادر بث 4K/1080p في Stremio", "https://torrentio.strem.fun/manifest.json"),
                      ("mov.peerflix.addon", "Peerflix", "مصادر بث إضافية للأفلام والمسلسلات والأنمي", "https://peerflix.mov/manifest.json"),
                      ("com.linvo.cinemeta", "Cinemeta", "الكتالوج الرسمي للأفلام والمسلسلات في Stremio", "https://v3-cinemeta.strem.io/manifest.json")
                  ]
                  return specs.map { StremioManifest(id: $0.0, version: "1.5.0", name: $0.1, description: $0.2, logo: nil, types: ["movie", "series", "anime"], catalogs: [], transportUrl: $0.3) }
              }

              static func fetchAndRankAllStreams(for item: StremioMetaPreview, episodeId: String?, installedAddons: [StremioManifest], safetyFilter: StreamSafetyFilter) async -> [HarborRankedStream] {
                  let targetId = episodeId ?? item.id
                  let mediaType = item.type == "anime" ? "series" : item.type
                  let parts = targetId.components(separatedBy: ":")
                  let imdbId = parts.first ?? item.id
                  let s = parts.count >= 2 ? (Int(parts[1]) ?? 1) : 1
                  let e = parts.count >= 3 ? (Int(parts[2]) ?? 1) : 1
                  let epTag = mediaType == "movie" ? "" : " S\(String(format: "%02d", s))E\(String(format: "%02d", e))"
                  let isMov = (mediaType == "movie")

                  let cloudList: [(String, String, String, String)] = [
                      ("VidLink Pro Cloud", "⚡ [RD+] VidLink Pro 4K/1080p", "\(item.name)\(epTag) • 2160p Dolby Vision / 1080p WEB-DL HEVC Atmos Multi-Subs\n👤 950 💾 6.4 GB (بث سحابي مباشر)", isMov ? "https://vidlink.pro/movie/\(imdbId)?autoplay=true" : "https://vidlink.pro/tv/\(imdbId)/\(s)/\(e)?autoplay=true"),
                      ("VidSrc CC v2", "⚡ [RD+] VidSrc CC 1080p FHD", "\(item.name)\(epTag) • 1080p BluRay WEB-DL HDR10 HEVC 5.1 (ترجمة عربية / إنجليزية)\n👤 820 💾 4.2 GB (بث سحابي مباشر)", isMov ? "https://vidsrc.cc/v2/embed/movie/\(imdbId)" : "https://vidsrc.cc/v2/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("VidSrc ICU", "⚡ [TB+] VidSrc ICU 1080p", "\(item.name)\(epTag) • 1080p WEB-DL AVC AAC Multi-Server Cloud\n👤 640 💾 3.1 GB (بث سحابي سريع)", isMov ? "https://vidsrc.icu/embed/movie/\(imdbId)" : "https://vidsrc.icu/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("AutoEmbed Pro", "⚡ [HTTP/HLS] AutoEmbed 1080p FHD", "\(item.name)\(epTag) • 1080p WEB-DL HEVC Multi-Audio Server\n👤 510 💾 2.8 GB (بث مباشر)", isMov ? "https://player.autoembed.cc/embed/movie/\(imdbId)" : "https://player.autoembed.cc/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("MultiEmbed VIP", "⚡ [HTTP/HLS] SuperEmbed 1080p VIP", "\(item.name)\(epTag) • 1080p BluRay WEB-DL Direct VIP Server\n👤 430 💾 2.5 GB (بث مباشر)", isMov ? "https://multiembed.mov/directstream.php?video_id=\(imdbId)" : "https://multiembed.mov/directstream.php?video_id=\(imdbId)&s=\(s)&e=\(e)"),
                      ("VidSrc XYZ", "⚡ [HTTP/HLS] VidSrc XYZ 1080p", "\(item.name)\(epTag) • 1080p WEB-DL Backup Cloud Server\n👤 390 💾 2.2 GB (خادم احتياطي)", isMov ? "https://vidsrc.xyz/embed/movie/\(imdbId)" : "https://vidsrc.xyz/embed/tv/\(imdbId)/\(s)/\(e)")
                  ]
                  let fallbackURL = cloudList[0].3
                  var collected: [(addonName: String, stream: StremioRawStream)] = cloudList.map {
                      ($0.0, StremioRawStream(name: $0.1, title: $0.2, description: $0.0, url: $0.3, infoHash: nil, fileIdx: nil, externalUrl: $0.3, behaviorHints: nil))
                  }

                  await withTaskGroup(of: [(String, StremioRawStream)].self) { group in
                      for addon in installedAddons where addon.id != "com.linvo.cinemeta" {
                          guard let t = addon.transportUrl, t.hasPrefix("http"), t.hasSuffix("/manifest.json") else { continue }
                          let base = t.replacingOccurrences(of: "/manifest.json", with: "")
                          let addonName = addon.name
                          group.addTask {
                              let enc = targetId.replacingOccurrences(of: ":", with: "%3A")
                              for uStr in ["\(base)/stream/\(mediaType)/\(targetId).json", "\(base)/stream/\(mediaType)/\(enc).json"] {
                                  guard let u = URL(string: uStr) else { continue }
                                  var req = URLRequest(url: u)
                                  req.timeoutInterval = 7
                                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) Stremio/4.4", forHTTPHeaderField: "User-Agent")
                                  if let (data, resp) = try? await URLSession.shared.data(for: req),
                                     let http = resp as? HTTPURLResponse, http.statusCode == 200,
                                     let dec = try? JSONDecoder().decode(StremioStreamResponse.self, from: data), !dec.streams.isEmpty {
                                      return dec.streams.prefix(20).map { r in
                                          (addonName, StremioRawStream(name: r.name ?? addonName, title: r.title ?? r.description ?? item.name, description: r.description, url: r.url ?? r.externalUrl, infoHash: r.infoHash, fileIdx: r.fileIdx, externalUrl: r.externalUrl ?? fallbackURL, behaviorHints: r.behaviorHints))
                                      }
                                  }
                              }
                              return []
                          }
                      }
                      for await batch in group { collected.append(contentsOf: batch) }
                  }
                  return HarborStreamEngine.processStreams(rawStreams: collected, expectedTitle: item.name, safetyFilter: .off)
              }
          }

          struct HarborSmartVideoContainer: View {
              let url: URL
              let player: AVPlayer
              static func isEmbedURL(_ url: URL) -> Bool {
                  let h = (url.host ?? "").lowercased()
                  let p = url.path.lowercased()
                  if p.hasSuffix(".m3u8") || p.hasSuffix(".mp4") || p.hasSuffix(".mkv") || h.contains("real-debrid") || h.contains("torbox") || h.contains("apple.com") || h.contains("googleapis.com") { return false }
                  return h.contains("vidlink") || h.contains("vidsrc") || h.contains("autoembed") || h.contains("multiembed") || p.contains("/embed/") || p.contains("directstream")
              }
              var body: some View {
                  if Self.isEmbedURL(url) {
                      HarborCloudStreamWebView(url: url).ignoresSafeArea().onAppear { player.pause(); player.replaceCurrentItem(with: nil) }
                  } else {
                      VideoPlayer(player: player).ignoresSafeArea()
                  }
              }
          }

          struct HarborCloudStreamWebView: UIViewRepresentable {
              let url: URL
              func makeCoordinator() -> Coordinator { Coordinator(host: url.host) }
              func makeUIView(context: Context) -> WKWebView {
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  cfg.userContentController.addUserScript(WKUserScript(source: "window.open = function(){return null;};", injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.backgroundColor = .black
                  wv.isOpaque = false
                  wv.scrollView.isScrollEnabled = false
                  wv.navigationDelegate = context.coordinator
                  wv.uiDelegate = context.coordinator
                  wv.load(URLRequest(url: url))
                  context.coordinator.lastURL = url
                  return wv
              }
              func updateUIView(_ wv: WKWebView, context: Context) {
                  if context.coordinator.lastURL != url {
                      context.coordinator.host = url.host
                      context.coordinator.lastURL = url
                      wv.load(URLRequest(url: url))
                  }
              }
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                  var host: String?
                  var lastURL: URL?
                  init(host: String?) { self.host = host }
                  func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? { nil }
                  func webView(_ webView: WKWebView, decidePolicyFor action: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      if action.targetFrame?.isMainFrame == true, action.navigationType == .linkActivated, let bh = host, let th = action.request.url?.host, !th.contains(bh) {
                          decisionHandler(.cancel); return
                      }
                      decisionHandler(.allow)
                  }
              }
          }

          extension HarborStore {
              func searchCatalogOnline(query: String) async {
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard q.count >= 2, let enc = q.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed) else { return }
                  for t in ["movie", "series"] {
                      guard let u = URL(string: "https://v3-cinemeta.strem.io/catalog/\(t)/top/search=\(enc).json"),
                            let (d, _) = try? await URLSession.shared.data(from: u),
                            let dec = try? JSONDecoder().decode(StremioCatalogResponse.self, from: d) else { continue }
                      for m in dec.metas.prefix(15) {
                          if t == "movie" && !trendingMovies.contains(where: { $0.id == m.id }) { trendingMovies.insert(m, at: 0) }
                          if t == "series" && !trendingSeries.contains(where: { $0.id == m.id }) { trendingSeries.insert(m, at: 0) }
                      }
                  }
              }
          }
          EOF

          python3 << 'PYEOF'
          def patch_file(path, replacements):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              for old, new in replacements:
                  assert old in content, f"Missing in {path}: {old[:40]}"
                  content = content.replace(old, new)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          patch_file("Sources/HarborIOS/HarborStore.swift", [
              ('import SwiftUI\nimport Foundation', 'import SwiftUI\nimport Foundation\nimport AVFoundation\nimport AVKit\nimport WebKit\nimport CommonCrypto'),
              ('await searchMusic(query: "Hans Zimmer Soundtrack")', 'await searchMusic(query: "The Weeknd")'),
              ('func setupDefaultAddons() {\n        installedAddons = [', 'func setupDefaultAddons() {\n        installedAddons = HarborCloudStreamBuilder.defaultAddons()\n        let _ = ['),
              ('func fetchAndRankStreams(for item: StremioMetaPreview, episodeId: String? = nil) async -> [HarborRankedStream] {', 'func fetchAndRankStreams(for item: StremioMetaPreview, episodeId: String? = nil) async -> [HarborRankedStream] {\n        return await HarborCloudStreamBuilder.fetchAndRankAllStreams(for: item, episodeId: episodeId, installedAddons: installedAddons, safetyFilter: safetyFilter)\n    }\n    private func _unusedLegacyFetchStreams(for item: StremioMetaPreview, episodeId: String? = nil) async -> [HarborRankedStream] {'),
              ('func searchMusic(query: String) async {\n        isLoadingMusic = true\n        defer { isLoadingMusic = false }', 'func searchMusic(query: String) async {\n        isLoadingMusic = true\n        defer { isLoadingMusic = false }\n        let fullTracks = await JioSaavnStreamCrypto.searchFullLengthTracks(query: query)\n        if !fullTracks.isEmpty {\n            self.musicTracks = fullTracks\n            return\n        }')
          ])

          patch_file("Sources/HarborIOS/HarborStreamEngine.swift", [
              ('upper.contains("CAM") || upper.contains("HDCAM") || upper.contains("TS") || upper.contains("TELESYNC")', 'upper.contains("HDCAM") || upper.contains("TELESYNC")')
          ])

          audio_old = '    func play(track: HarborMusicTrack, queue: [HarborMusicTrack] = []) {\n        guard let url = URL(string: track.streamURL) else { return }'
          audio_new = '    func play(track: HarborMusicTrack, queue: [HarborMusicTrack] = []) {\n        if track.streamURL.contains("itunes.apple.com") || track.streamURL.contains("mzaf_") {\n            Task {\n                let matches = await JioSaavnStreamCrypto.searchFullLengthTracks(query: "\\(track.title) \\(track.artist)")\n                if let best = matches.first {\n                    let upgraded = HarborMusicTrack(id: track.id, title: track.title, artist: track.artist, album: best.album, artworkURL: track.artworkURL ?? best.artworkURL, streamURL: best.streamURL, durationSeconds: best.durationSeconds, genre: track.genre, isLiveStream: false)\n                    self.playDirectTrack(upgraded, queue: queue)\n                } else {\n                    self.playDirectTrack(track, queue: queue)\n                }\n            }\n            return\n        }\n        playDirectTrack(track, queue: queue)\n    }\n    private func playDirectTrack(_ track: HarborMusicTrack, queue: [HarborMusicTrack] = []) {\n        guard let url = URL(string: track.streamURL) else { return }'
          patch_file("Sources/HarborIOS/HarborAudioPlayerManager.swift", [(audio_old, audio_new)])

          debrid_old = '        switch provider {'
          debrid_new = '        if (provider == .none) || (provider == .realDebrid && realDebridToken.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty) || (provider == .torBox && torBoxKey.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty) {\n            if let ext = stream.raw.externalUrl, let fallbackURL = URL(string: ext) {\n                return fallbackURL\n            }\n        }\n        switch provider {'
          patch_file("Sources/HarborIOS/DebridService.swift", [(debrid_old, debrid_new)])

          patch_file("Sources/HarborIOS/HarborViews.swift", [
              ('VideoPlayer(player: player)', 'HarborSmartVideoContainer(url: url, player: player)'),
              ('private func startPlayback(with streamURL: URL) {', 'private func startPlayback(with streamURL: URL) {\n        if HarborSmartVideoContainer.isEmbedURL(streamURL) { player.pause(); return }'),
              ('.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")', '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")\n            .onSubmit(of: .search) { Task { await store.searchCatalogOnline(query: searchText) } }\n            .onChange(of: searchText) { _, q in if q.count >= 3 { Task { await store.searchCatalogOnline(query: q) } } }'),
              ('Text("\\(track.artist) • \\(track.album)")', 'Text("\\(track.artist) • \\(track.isLiveStream ? "بث مباشر 24/7" : String(format: "%d:%02d", Int(track.durationSeconds) / 60, Int(track.durationSeconds) % 60)) • \\(track.album)")')
          ])
          print("All Harbor iOS full-track music and streaming patches applied successfully.")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: Harbor
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "1.1.0"
                  CFBundleVersion: "2"
                  LSRequiresIPhoneOS: true
                  UILaunchScreen: {}
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
