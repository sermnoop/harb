                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 14)
                                              .background(Color.white)
                                              .foregroundStyle(Color.black)
                                              .clipShape(Capsule())
                                          }
                                          .buttonStyle(SmoothPressButtonStyle())
                                          .padding(.bottom, 8)
                                      }
                                      Text("مصادر البث المصنفة (Harbor Stream Engine)")'''
          )

          views_c = views_c.replace('VideoPlayer(player: player)', 'HarborSmartVideoContainer(url: url, player: player)')
          views_c = views_c.replace(
              'private func startPlayback(with streamURL: URL) {',
              'private func startPlayback(with streamURL: URL) {\n        if HarborSmartVideoContainer.isEmbedURL(streamURL) { player.pause(); return }'
          )
          views_c = views_c.replace(
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")',
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")\n            .onSubmit(of: .search) { Task { await store.searchCatalogOnline(query: searchText) } }\n            .onChange(of: searchText) { _, q in if q.count >= 3 { Task { await store.searchCatalogOnline(query: q) } } }'
          )

          with open("Sources/HarborIOS/HarborViews.swift", "w", encoding="utf-8") as f:
              f.write(views_c)

          print("All Harbor iOS v2.4.0 patches (Full Studio Music + YouTube Music Player & Synced Lyrics + Harbor Desktop PDF Reader) applied cleanly!")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: HarborIOS
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "2.4.0"
                  CFBundleVersion: "7"
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: false
                  LSSupportsOpeningDocumentsInPlace: true
                  UIFileSharingEnabled: true
                  UILaunchScreen:
                    UIColorName: ""
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
