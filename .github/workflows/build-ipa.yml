          import SwiftUI
          import AVFoundation

          // MARK: - 8. Harbor Native Audio Player & Synced Lyrics Manager (Full-Length Studio Engine + LRCLIB Search)

          @MainActor
          final class HarborAudioPlayerManager: ObservableObject {
              @Published var currentTrack: HarborMusicTrack? = nil
              @Published var isPlaying: Bool = false
              @Published var currentTime: Double = 0
              @Published var duration: Double = 210
              @Published var queue: [HarborMusicTrack] = []
              @Published var syncedLyrics: [SyncedLyricLine] = []
              @Published var plainLyrics: String? = nil
              @Published var isShowingFullPlayer: Bool = false
              @Published var isShowingLyricsSheet: Bool = false
              @Published var isResolvingFullStream: Bool = false
              @Published var isShuffleEnabled: Bool = false
              @Published var isRepeatEnabled: Bool = false
              @Published var isLiked: Bool = true
              @Published var isVideoMode: Bool = false
              @Published var activeYouTubeVideoID: String? = nil

              private var player: AVPlayer?
              private var timeObserver: Any?
              private var endObserver: NSObjectProtocol?

              func play(track: HarborMusicTrack, queue: [HarborMusicTrack] = []) {
                  if !queue.isEmpty {
                      self.queue = queue
                  }
                  self.currentTrack = track
                  self.duration = max(track.durationSeconds, 180)
                  self.currentTime = 0
                  self.activeYouTubeVideoID = nil

                  let rawStream = track.streamURL
                  let needsFullResolution = rawStream.hasPrefix("tidal://") ||
                                            rawStream.hasPrefix("harborfull://") ||
                                            rawStream.contains("mzstatic.com") ||
                                            rawStream.contains("dzcdn.net")

                  if !needsFullResolution, let directURL = URL(string: rawStream) {
                      startAVPlayer(with: directURL, track: track)
                  } else {
                      // If there is an embedded fallback URL inside harborfull://, start it only if resolution takes >2s, or resolve immediately
                      isResolvingFullStream = true
                      Task {
                          if let resolved = await JioSaavnStreamCrypto.resolveBestFullStream(
                              title: track.title,
                              artist: track.artist,
                              currentStreamURL: rawStream
                          ), let fullURL = URL(string: resolved.url) {
                              let upgraded = HarborMusicTrack(
                                  id: track.id,
                                  title: track.title,
                                  artist: track.artist,
                                  album: track.album.contains("كامل") ? track.album : "\(track.album) • كامل",
                                  artworkURL: track.artworkURL,
                                  streamURL: resolved.url,
                                  durationSeconds: max(resolved.duration, track.durationSeconds),
                                  genre: "Hi-Fi Full Studio",
                                  isLiveStream: false
                              )
                              self.isResolvingFullStream = false
                              if self.currentTrack?.id == track.id {
                                  self.currentTrack = upgraded
                                  self.startAVPlayer(with: fullURL, track: upgraded)
                              }
                          } else {
                              self.isResolvingFullStream = false
                              // Extract fallback URL if present
                              let fallbackStr = rawStream
                                  .replacingOccurrences(of: "harborfull://resolve?fallback=", with: "")
                                  .removingPercentEncoding ?? rawStream
                              if let fbURL = URL(string: fallbackStr), fbURL.scheme?.hasPrefix("http") == true {
                                  self.startAVPlayer(with: fbURL, track: track)
                              }
                          }
                      }
                  }

                  Task {
                      await fetchLyricsWithSearchFallback(for: track)
                  }
                  Task {
                      if let vid = await JioSaavnStreamCrypto.resolveYouTubeVideoID(title: track.title, artist: track.artist) {
                          if self.currentTrack?.id == track.id {
                              self.activeYouTubeVideoID = vid
                          }
                      }
                  }
              }

              func upgradeCurrentTrackToFullStreamIfVerified() async {
                  guard let track = currentTrack else { return }
                  isResolvingFullStream = true
                  defer { isResolvingFullStream = false }
                  if let resolved = await JioSaavnStreamCrypto.resolveBestFullStream(
                      title: track.title,
                      artist: track.artist,
                      currentStreamURL: track.streamURL
                  ), let fullURL = URL(string: resolved.url) {
                      let upgraded = HarborMusicTrack(
                          id: track.id,
                          title: track.title,
                          artist: track.artist,
                          album: track.album.contains("كامل") ? track.album : "\(track.album) • كامل",
                          artworkURL: track.artworkURL,
                          streamURL: resolved.url,
                          durationSeconds: max(resolved.duration, track.durationSeconds),
                          genre: "Hi-Fi Full Studio",
                          isLiveStream: false
                      )
                      self.currentTrack = upgraded
                      self.startAVPlayer(with: fullURL, track: upgraded)
                  }
              }

              private func startAVPlayer(with url: URL, track: HarborMusicTrack) {
                  #if os(iOS)
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)
                  #endif

                  if let obs = timeObserver {
                      player?.removeTimeObserver(obs)
                      timeObserver = nil
                  }
                  if let endObs = endObserver {
                      NotificationCenter.default.removeObserver(endObs)
                      endObserver = nil
                  }

                  let item = AVPlayerItem(url: url)
                  let avPlayer = AVPlayer(playerItem: item)
                  self.player = avPlayer
                  self.duration = max(track.durationSeconds, 30)
                  self.currentTime = 0

                  if !isVideoMode {
                      avPlayer.play()
                      self.isPlaying = true
                  }

                  let interval = CMTime(seconds: 0.35, preferredTimescale: CMTimeScale(NSEC_PER_SEC))
                  timeObserver = avPlayer.addPeriodicTimeObserver(forInterval: interval, queue: .main) { [weak self] time in
                      guard let self = self else { return }
                      let seconds = CMTimeGetSeconds(time)
                      if seconds.isFinite {
                          Task { @MainActor in
                              self.currentTime = seconds
                              if let d = self.player?.currentItem?.duration {
                                  let dSecs = CMTimeGetSeconds(d)
                                  if dSecs.isFinite && dSecs > 10 {
                                      self.duration = dSecs
                                  }
                              }
                          }
                      }
                  }

                  endObserver = NotificationCenter.default.addObserver(
                      forName: .AVPlayerItemDidPlayToEndTime,
                      object: item,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self else { return }
                      Task { @MainActor in
                          if self.isRepeatEnabled {
                              self.seek(to: 0)
                              self.player?.play()
                              self.isPlaying = true
                          } else {
                              self.playNext()
                          }
                      }
                  }
              }

              func togglePlayPause() {
                  guard let player = player else { return }
                  if isPlaying {
                      player.pause()
                      isPlaying = false
                  } else {
                      player.play()
                      isPlaying = true
                  }
              }

              func seek(to seconds: Double) {
                  let cm = CMTime(seconds: seconds, preferredTimescale: 600)
                  player?.seek(to: cm)
                  currentTime = seconds
              }

              func playNext() {
                  guard !queue.isEmpty else { return }
                  if isShuffleEnabled, let randomTrack = queue.randomElement() {
                      play(track: randomTrack, queue: queue)
                      return
                  }
                  guard let current = currentTrack,
                        let idx = queue.firstIndex(where: { $0.id == current.id }) else {
                      if let first = queue.first { play(track: first, queue: queue) }
                      return
                  }
                  let nextIdx = (idx + 1) % queue.count
                  play(track: queue[nextIdx], queue: queue)
              }

              func playPrevious() {
                  if currentTime > 4.0 {
                      seek(to: 0)
                      return
                  }
                  guard !queue.isEmpty,
                        let current = currentTrack,
                        let idx = queue.firstIndex(where: { $0.id == current.id }) else { return }
                  let prevIdx = (idx - 1 + queue.count) % queue.count
                  play(track: queue[prevIdx], queue: queue)
              }

              /// Queries LRCLIB API (exact get + broad search fallback) so almost every song has synced lyrics!
              private func fetchLyricsWithSearchFallback(for track: HarborMusicTrack) async {
                  self.syncedLyrics = []
                  self.plainLyrics = nil
                  guard !track.isLiveStream else {
                      self.plainLyrics = "بث إذاعي مباشر على مدار الساعة عبر محرك الصوت في Harbor."
                      return
                  }

                  let cleanTitle = track.title.components(separatedBy: "(").first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? track.title
                  let cleanArtist = track.artist.components(separatedBy: ",").first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? track.artist
                  let artistEnc = cleanArtist.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                  let titleEnc = cleanTitle.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""

                  // 1. Try exact LRCLIB endpoint
                  if let url = URL(string: "https://lrclib.net/api/get?artist_name=\(artistEnc)&track_name=\(titleEnc)"),
                     let (data, resp) = try? await URLSession.shared.data(from: url),
                     let http = resp as? HTTPURLResponse, http.statusCode == 200,
                     let decoded = try? JSONDecoder().decode(LRCLibResponse.self, from: data) {
                      self.plainLyrics = decoded.plainLyrics
                      if let lrc = decoded.syncedLyrics {
                          let parsed = Self.parseLRC(lrc)
                          if !parsed.isEmpty {
                              self.syncedLyrics = parsed
                              return
                          }
                      }
                  }

                  // 2. Fallback: LRCLIB full-text search endpoint (/api/search?q=...)
                  let searchQuery = "\(cleanTitle) \(cleanArtist)".addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? titleEnc
                  if let sURL = URL(string: "https://lrclib.net/api/search?q=\(searchQuery)"),
                     let (sData, sResp) = try? await URLSession.shared.data(from: sURL),
                     let sHttp = sResp as? HTTPURLResponse, sHttp.statusCode == 200,
                     let list = try? JSONDecoder().decode([LRCLibResponse].self, from: sData),
                     let best = list.first(where: { $0.syncedLyrics != nil && !($0.syncedLyrics ?? "").isEmpty }) ?? list.first {
                      self.plainLyrics = best.plainLyrics
                      if let lrc = best.syncedLyrics {
                          self.syncedLyrics = Self.parseLRC(lrc)
                      } else if let plain = best.plainLyrics {
                          // Convert plain lines into evenly spaced lines so they still display cleanly in the YouTube Music lyrics view!
                          let rawLines = plain.components(separatedBy: .newlines).map { $0.trimmingCharacters(in: .whitespaces) }.filter { !$0.isEmpty }
                          let step = max(track.durationSeconds / Double(max(rawLines.count, 1)), 3.5)
                          self.syncedLyrics = rawLines.enumerated().map { idx, txt in
                              SyncedLyricLine(timestampSeconds: Double(idx) * step, text: txt)
                          }
                      }
                  }
              }

              private static func parseLRC(_ lrc: String) -> [SyncedLyricLine] {
                  var lines: [SyncedLyricLine] = []
                  let pattern = #"\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)"#
                  guard let regex = try? NSRegularExpression(pattern: pattern) else { return [] }

                  for rawLine in lrc.components(separatedBy: .newlines) {
                      let nsRange = NSRange(rawLine.startIndex..<rawLine.endIndex, in: rawLine)
                      if let match = regex.firstMatch(in: rawLine, range: nsRange),
                         let minRange = Range(match.range(at: 1), in: rawLine),
                         let secRange = Range(match.range(at: 2), in: rawLine),
                         let txtRange = Range(match.range(at: 3), in: rawLine) {
                          let mins = Double(rawLine[minRange]) ?? 0
                          let secs = Double(rawLine[secRange]) ?? 0
                          let text = String(rawLine[txtRange]).trimmingCharacters(in: .whitespaces)
                          if !text.isEmpty {
                              lines.append(SyncedLyricLine(timestampSeconds: mins * 60 + secs, text: text))
                          }
                      }
                  }
                  return lines
              }
          }

