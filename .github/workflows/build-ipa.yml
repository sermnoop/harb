          struct HarborMusicTrackRow: View {
              @EnvironmentObject var store: HarborStore
              let track: HarborMusicTrack
              let isCurrent: Bool
              let isPlaying: Bool
              let onTap: () -> Void

              var body: some View {
                  Button(action: onTap) {
                      HStack(spacing: 14) {
                          ArtworkRadiationContainer(
                              artworkURL: track.artworkURL,
                              isActive: isCurrent,
                              glowRadius: 18,
                              scale: 1.32
                          ) {
                              AsyncImage(url: URL(string: track.artworkURL ?? "")) { phase in
                                  switch phase {
                                  case .success(let image):
                                      image.resizable().scaledToFill()
                                  default:
                                      ZStack {
                                          Color(red: 0.16, green: 0.16, blue: 0.20)
                                          Image(systemName: "music.note")
                                              .foregroundStyle(Color(red: 0.95, green: 0.24, blue: 0.34))
                                      }
                                  }
                              }
                              .frame(width: 56, height: 56)
                              .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 12, style: .continuous)
                                      .stroke(isCurrent ? Color.white.opacity(0.6) : Color.white.opacity(0.1), lineWidth: isCurrent ? 1.5 : 0.6)
                              )
                          }
                          .frame(width: 62, height: 62)

                          VStack(alignment: .leading, spacing: 4) {
                              Text(track.title)
                                  .font(.system(size: 16, weight: .bold))
                                  .foregroundStyle(isCurrent ? Color(red: 0.98, green: 0.30, blue: 0.40) : .white)
                                  .lineLimit(1)

                              let durText = track.isLiveStream
                                  ? "LIVE 24/7"
                                  : String(format: "%d:%02d", Int(track.durationSeconds) / 60, Int(track.durationSeconds) % 60)
                              Text("\\(track.artist) · \\(durText) · \\(track.album)")
                                  .font(.caption)
                                  .foregroundStyle(.white.opacity(0.62))
                                  .lineLimit(1)
                          }

                          Spacer()

                          if isCurrent {
                              Image(systemName: isPlaying ? "waveform" : "pause.circle.fill")
                                  .font(.title3.weight(.bold))
                                  .foregroundStyle(Color(red: 0.98, green: 0.30, blue: 0.40))
                                  .symbolEffect(.variableColor.iterative, isActive: isPlaying)
                          } else {
                              Image(systemName: "play.fill")
                                  .font(.subheadline)
                                  .foregroundStyle(.white.opacity(0.5))
                                  .padding(10)
                                  .background(Color.white.opacity(0.08))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 12)
                      .padding(.vertical, 10)
                      .background(
                          ZStack {
                              RoundedRectangle(cornerRadius: 16, style: .continuous)
                                  .fill(Color(red: 0.10, green: 0.10, blue: 0.13).opacity(0.88))
                              if isCurrent, let art = track.artworkURL, let url = URL(string: art) {
                                  AsyncImage(url: url) { phase in
                                      if case .success(let img) = phase {
                                          img.resizable()
                                              .scaledToFill()
                                              .saturation(2.0)
                                              .blur(radius: 36)
                                              .opacity(0.32)
                                      }
                                  }
                                  .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                              }
                          }
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: 16, style: .continuous)
                              .stroke(isCurrent ? Color.white.opacity(0.35) : Color.white.opacity(0.06), lineWidth: isCurrent ? 1.2 : 0.6)
                      )
                      .environment(\\.layoutDirection, .leftToRight)
                  }
                  .buttonStyle(SmoothPressButtonStyle())
              }
          }

