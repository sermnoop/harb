                                      .padding(.horizontal, 28)
                                      .environment(\\.layoutDirection, .leftToRight)
                                  }

                                  HStack(spacing: 46) {
                                      Button { audioManager.playPrevious() } label: {
                                          Image(systemName: "backward.fill").font(.title)
                                      }
                                      .buttonStyle(SmoothPressButtonStyle())

                                      Button { audioManager.togglePlayPause() } label: {
                                          Image(systemName: audioManager.isPlaying ? "pause.circle.fill" : "play.circle.fill")
                                              .font(.system(size: 64))
                                      }
                                      .buttonStyle(SmoothPressButtonStyle())

                                      Button { audioManager.playNext() } label: {
                                          Image(systemName: "forward.fill").font(.title)
                                      }
                                      .buttonStyle(SmoothPressButtonStyle())
                                  }
                                  .foregroundStyle(.white)
                                  .environment(\\.layoutDirection, .leftToRight)

                                  VStack(alignment: .leading, spacing: 8) {
                                      Label("Synced Lyrics · كلمات الأغنية", systemImage: "quote.bubble.fill")
                                          .font(.caption.weight(.bold))
                                          .foregroundStyle(.white.opacity(0.85))

                                      ScrollView {
                                          if !audioManager.syncedLyrics.isEmpty {
                                              VStack(alignment: .leading, spacing: 10) {
                                                  ForEach(audioManager.syncedLyrics) { line in
                                                      let isActive = abs(line.timestampSeconds - audioManager.currentTime) < 3.0
                                                      Text(line.text)
                                                          .font(isActive ? .headline.weight(.bold) : .subheadline)
                                                          .foregroundStyle(isActive ? .white : .white.opacity(0.50))
                                                          .scaleEffect(isActive ? 1.03 : 1.0, anchor: .leading)
                                                          .animation(.spring(response: 0.3, dampingFraction: 0.8), value: isActive)
                                                          .onTapGesture {
                                                              audioManager.seek(to: line.timestampSeconds)
                                                          }
                                                  }
                                              }
                                              .frame(maxWidth: .infinity, alignment: .leading)
                                          } else if let plain = audioManager.plainLyrics {
                                              Text(plain)
                                                  .font(.subheadline)
                                                  .foregroundStyle(.white.opacity(0.85))
                                          } else {
                                              Text("استمتع بالصوت الكامل مع الإشعاع المحيطي لغلاف الألبوم.")
                                                  .font(.caption)
                                                  .foregroundStyle(.white.opacity(0.6))
                                          }
                                      }
                                      .frame(maxHeight: 150)
                                  }
                                  .padding(14)
                                  .background(.ultraThinMaterial)
                                  .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                                  .padding(.horizontal, 20)
                              }
                              Spacer()
                          }
                      }
                      .toolbar {
                          ToolbarItem(placement: .topBarTrailing) {
                              Button("إغلاق") { dismiss() }
                                  .foregroundStyle(.white)
                          }
                      }
                  }
              }

              private func formatTime(_ secs: Double) -> String {
                  let total = max(Int(secs), 0)
                  return String(format: "%d:%02d", total / 60, total % 60)
              }
          }

          '''

          m_prefix = views_c[:views_c.index(music_start)]
          m_suffix = views_c[views_c.index(books_start):]
          views_c = m_prefix + apple_music_section + m_suffix

          views_c = views_c.replace(
              '.frame(height: 280)\n                    .clipped()',
              '.frame(width: UIScreen.main.bounds.width, height: 300)\n                    .clipped()'
          )

          views_c = views_c.replace(
              'Text("مصادر البث المصنفة (Harbor Stream Engine)")',
              '''if let firstStream = rankedStreams.first {
                                          Button {
                                              Task { await launchStream(firstStream) }
                                          } label: {
                                              HStack(spacing: 10) {
                                                  Image(systemName: "play.fill")
                                                  Text("تشغيل فوري الآن (Play Best Server)")
                                                      .font(.headline.weight(.bold))
                                              }
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 14)
                                              .background(Color.white)
                                              .foregroundStyle(Color.black)
                                              .clipShape(Capsule())
                                          }
                                          .buttonStyle(SmoothPressButtonStyle())
                                          .padding(.bottom, 8)
                                      }
                                      Text("مصادر البث المصنفة (Harbor Stream Engine)")'''
          )

          views_c = views_c.replace('VideoPlayer(player: player)', 'HarborSmartVideoContainer(url: url, player: player)')
          views_c = views_c.replace(
              'private func startPlayback(with streamURL: URL) {',
              'private func startPlayback(with streamURL: URL) {\n        if HarborSmartVideoContainer.isEmbedURL(streamURL) { player.pause(); return }'
          )
          views_c = views_c.replace(
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")',
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")\n            .onSubmit(of: .search) { Task { await store.searchCatalogOnline(query: searchText) } }\n            .onChange(of: searchText) { _, q in if q.count >= 3 { Task { await store.searchCatalogOnline(query: q) } } }'
          )

          with open("Sources/HarborIOS/HarborViews.swift", "w", encoding="utf-8") as f:
              f.write(views_c)

          print("All full readable Harbor iOS v2.2 patches applied cleanly!")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: HarborIOS
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "2.2.0"
                  CFBundleVersion: "5"
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: false
                  UILaunchScreen:
                    UIColorName: ""
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
