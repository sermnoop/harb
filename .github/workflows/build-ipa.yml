                                  .foregroundStyle(.white)
                                  .lineLimit(1)
                          }
                          .buttonStyle(.plain)

                          HStack(spacing: 5) {
                              Button(action: onTapArtist) {
                                  HStack(spacing: 3) {
                                      Text(track.artist)
                                          .font(.system(size: 12, weight: .semibold))
