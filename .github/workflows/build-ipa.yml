          ttf_raw = lzma.decompress(base64.b64decode(ttf_b64_data))
          with open("Sources/HarborIOS/ThmanyahSans-Regular.ttf", "wb") as tf:
              tf.write(ttf_raw)
          print("Extracted ThmanyahSans-Regular.ttf:", len(ttf_raw), "bytes")

          font_replacements = [
              (".font(.system(size:", ".font(.harbor(size:"),
              ("Font.system(size:", "Font.harbor(size:"),
              (".font(.largeTitle", ".font(.harborLargeTitle"),
              (".font(.title3", ".font(.harborTitle3"),
              (".font(.title2", ".font(.harborTitle2"),
              (".font(.title", ".font(.harborTitle"),
              (".font(.headline", ".font(.harborHeadline"),
              (".font(.subheadline", ".font(.harborSubheadline"),
              (".font(.body", ".font(.harborBody"),
              (".font(.callout", ".font(.harborCallout"),
              (".font(.footnote", ".font(.harborFootnote"),
              (".font(.caption2", ".font(.harborCaption2"),
              (".font(.caption", ".font(.harborCaption"),
          ]
          for swift_file in sorted(glob.glob("Sources/HarborIOS/*.swift")):
              with open(swift_file, "r", encoding="utf-8") as sf:
                  sc = sf.read()
              for old_f, new_f in font_replacements:
                  sc = sc.replace(old_f, new_f)
              with open(swift_file, "w", encoding="utf-8") as sf:
                  sf.write(sc)

          print("All Harbor iOS v2.4.0 patches (Full Studio Music + YouTube Music Player & Synced Lyrics + Harbor Desktop PDF Reader) applied cleanly!")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: HarborIOS
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "2.9.0"
                  CFBundleVersion: "11"
                  UIAppFonts:
                    - ThmanyahSans-Regular.ttf
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: false
                  LSSupportsOpeningDocumentsInPlace: true
                  UIFileSharingEnabled: true
                  UILaunchScreen:
                    UIColorName: ""
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact (No Double-Compression)
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
          compression-level: 0

      - name: Publish Direct Harbor.ipa to GitHub Releases (No Unzip Required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.9.0-latest build/Harbor.ipa             --title "Harbor iOS v2.9.0 Noir & Thmanyah Sans Edition (Direct Harbor.ipa)"             --notes "Direct Harbor.ipa download for iPhone — no ZIP extraction required."             --latest || gh release upload v2.9.0-latest build/Harbor.ipa --clobber || true
