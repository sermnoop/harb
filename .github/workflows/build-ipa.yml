          views_c = m_prefix + bespoke_music_section + m_suffix

          # Add Live Real-Debrid Account Test & Activation button inside HarborSettingsRoomView!
          settings_target = 'SecureField("مفتاح Real-Debrid API Token", text: $store.realDebridToken)'
          settings_replacement = '''SecureField("مفتاح Real-Debrid API Token", text: $store.realDebridToken)
                                  .onChange(of: store.realDebridToken) { _, newVal in
                                      if !newVal.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                                          store.debridProviderRaw = DebridProviderType.realDebrid.rawValue
                                      }
                                  }
                              Button {
                                  Task {
                                      store.debridProviderRaw = DebridProviderType.realDebrid.rawValue
                                      let status = await DebridService.shared.verifyRealDebridAccount(token: store.realDebridToken)
                                      store.statusBannerMessage = status
                                  }
                              } label: {
                                  Label("فحص وتفعيل حساب Real-Debrid الآن", systemImage: "bolt.shield.fill")
                                      .font(.subheadline.weight(.bold))
                                      .foregroundStyle(store.theme.accent)
                              }
                              if let msg = store.statusBannerMessage {
                                  Text(msg)
                                      .font(.caption.weight(.bold))
                                      .foregroundStyle(msg.contains("✅") ? .green : .orange)
                              }'''
          assert settings_target in views_c, "settings_target missing"
          views_c = views_c.replace(settings_target, settings_replacement)

          views_c = views_c.replace(
              '.frame(height: 280)\n                    .clipped()',
              '.frame(width: UIScreen.main.bounds.width, height: 300)\n                    .clipped()'
          )

          views_c = views_c.replace(
              'Text("مصادر البث المصنفة (Harbor Stream Engine)")',
              '''if let firstStream = rankedStreams.first {
                                          Button {
                                              Task { await launchStream(firstStream) }
                                          } label: {
                                              HStack(spacing: 10) {
                                                  Image(systemName: "play.fill")
                                                  Text("تشغيل فوري الآن (Play Best Server)")
                                                      .font(.headline.weight(.bold))
                                              }
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 14)
                                              .background(Color.white)
                                              .foregroundStyle(Color.black)
                                              .clipShape(Capsule())
                                          }
                                          .buttonStyle(SmoothPressButtonStyle())
                                          .padding(.bottom, 8)
                                      }
                                      Text("مصادر البث المصنفة (Harbor Stream Engine)")'''
          )

          views_c = views_c.replace('VideoPlayer(player: player)', 'HarborSmartVideoContainer(url: url, player: player)')
          views_c = views_c.replace(
              'private func startPlayback(with streamURL: URL) {',
              'private func startPlayback(with streamURL: URL) {\n        if HarborSmartVideoContainer.isEmbedURL(streamURL) { player.pause(); return }'
          )
          views_c = views_c.replace(
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")',
              '.searchable(text: $searchText, prompt: "ابحث عن فيلم، مسلسل، أو أنمي...")\n            .onSubmit(of: .search) { Task { await store.searchCatalogOnline(query: searchText) } }\n            .onChange(of: searchText) { _, q in if q.count >= 3 { Task { await store.searchCatalogOnline(query: q) } } }'
          )

          with open("Sources/HarborIOS/HarborViews.swift", "w", encoding="utf-8") as f:
              f.write(views_c)

          print("All Harbor iOS v2.3 patches (No Bubble + Authentic Vocals + Bespoke Studio + Real-Debrid Fix) applied cleanly!")
          PYEOF

          cat << 'EOF' > project.yml
          name: HarborIOS
          options:
            bundleIdPrefix: com.harbor
            deploymentTarget:
              iOS: "17.0"
          targets:
            HarborIOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources/HarborIOS
                  excludes:
                    - "**/*.plist"
                    - "Package.swift"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Harbor
                  CFBundleName: HarborIOS
                  CFBundleExecutable: $(EXECUTABLE_NAME)
                  CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
                  CFBundleInfoDictionaryVersion: "6.0"
                  CFBundlePackageType: APPL
                  CFBundleShortVersionString: "2.3.0"
                  CFBundleVersion: "6"
                  LSRequiresIPhoneOS: true
                  UIRequiresFullScreen: true
                  UIStatusBarStyle: UIStatusBarStyleLightContent
                  UIViewControllerBasedStatusBarAppearance: false
                  UILaunchScreen:
                    UIColorName: ""
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UIApplicationSupportsIndirectInputEvents: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ios
                  PRODUCT_NAME: HarborIOS
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
          EOF

          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Bundle
        run: |
          xcodebuild build \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "HarborIOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload
          ls -lh Harbor.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
