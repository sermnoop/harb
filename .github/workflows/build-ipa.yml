                      return .custom("ThmanyahSans-Regular", size: size)
                  case .systemRounded:
                      return .system(size: size, weight: .semibold, design: .rounded)
                  case .serif:
                      return .system(size: size, weight: .semibold, design: .serif)
                  case .monospaced:
                      return .system(size: size, weight: .semibold, design: .monospaced)
                  }
              }
          }

          public enum HarborSubtitleColorChoice: String, CaseIterable, Codable, Identifiable, Sendable {
              case white = "white"
              case yellow = "yellow"
              case cyan = "cyan"
              case green = "green"

              public var id: String { rawValue }

              public var displayName: String {
                  switch self {
                  case .white: return "أبيض نقي"
                  case .yellow: return "أصفر سينمائي"
                  case .cyan: return "سماوي"
                  case .green: return "أخضر مريح"
                  }
