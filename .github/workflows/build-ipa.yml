          import Foundation
          import SwiftUI
          import Security
          import AVKit
          #if canImport(UIKit)
          import UIKit
          #endif

          // MARK: - 1. HarborKeychainService (Secure Credential Storage with UserDefaults Migration)

          public typealias HarborCredentialKey = HarborKeychainService.CredentialKey

          public final class HarborKeychainService: @unchecked Sendable {
              public static let shared = HarborKeychainService()
              private let serviceName = "com.harbor.ios.credentials"
              private let lock = NSLock()

              public enum CredentialKey: String, CaseIterable, Sendable {
                  case realDebridToken = "harbor_rd_token"
                  case torBoxKey = "harbor_torbox_key"
                  case tmdbAPIKey = "harbor_tmdb_api_key_v1"
                  case rpdbKey = "harbor_rpdb_key"
              }

              private init() {
                  migrateLegacyUserDefaultsIfNeeded()
              }

              /// Automatically migrates any plain-text tokens previously stored in UserDefaults into the iOS Keychain
              /// and removes the plain-text copies from UserDefaults.
              public func migrateLegacyUserDefaultsIfNeeded() {
                  let defaults = UserDefaults.standard
                  for key in CredentialKey.allCases {
                      if let legacyValue = defaults.string(forKey: key.rawValue),
                         !legacyValue.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                          let existing = read(key)
                          if existing.isEmpty {
                              save(legacyValue, for: key)
                          }
                          defaults.removeObject(forKey: key.rawValue)
                      }
                  }
              }

              public func migrateLegacyDefaultsIfNeeded() {
                  migrateLegacyUserDefaultsIfNeeded()
              }

              @discardableResult
              public func set(_ value: String, forKey key: CredentialKey) -> Bool {
                  save(value, for: key)
              }

              public func get(_ key: CredentialKey) -> String {
                  read(key)
              }

              @discardableResult
              public func save(_ value: String, for key: CredentialKey) -> Bool {
                  lock.lock()
                  defer { lock.unlock() }

                  let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard let data = trimmed.data(using: .utf8) else { return false }

                  let deleteQuery: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: serviceName,
                      kSecAttrAccount as String: key.rawValue
                  ]
                  SecItemDelete(deleteQuery as CFDictionary)

                  guard !trimmed.isEmpty else { return true }

                  let addQuery: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: serviceName,
                      kSecAttrAccount as String: key.rawValue,
                      kSecValueData as String: data,
                      kSecAttrAccessible as String: kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly
                  ]
                  let status = SecItemAdd(addQuery as CFDictionary, nil)
                  return status == errSecSuccess
              }

              public func read(_ key: CredentialKey) -> String {
                  lock.lock()
                  defer { lock.unlock() }

                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: serviceName,
                      kSecAttrAccount as String: key.rawValue,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var item: CFTypeRef?
                  let status = SecItemCopyMatching(query as CFDictionary, &item)
                  guard status == errSecSuccess,
                        let data = item as? Data,
                        let string = String(data: data, encoding: .utf8) else {
                      return ""
                  }
                  return string
              }

              public func deleteAllCredentials() {
                  for key in CredentialKey.allCases {
                      save("", for: key)
                  }
              }
          }

          // MARK: - 2. HarborDiskCacheManager (Bounded LRU Disk & Memory Cache)

          public final class HarborDiskCacheManager: @unchecked Sendable {
              public static let shared = HarborDiskCacheManager()

              private let fileManager = FileManager.default
              private let cacheQueue = DispatchQueue(label: "com.harbor.ios.diskcache", qos: .utility)
              private let memoryCache = NSCache<NSString, NSData>()

              /// Maximum disk cache budget: 120 MB
              public let maxDiskBytes: Int64 = 120 * 1024 * 1024

              public enum CacheNamespace: String, CaseIterable, Sendable {
                  case catalogs = "Catalogs"
                  case lyrics = "Lyrics"
                  case subtitles = "Subtitles"
                  case metadata = "Metadata"
              }

              private init() {
                  memoryCache.countLimit = 180
                  memoryCache.totalCostLimit = 32 * 1024 * 1024 // 32 MB in-memory cap
                  configureSharedURLCache()
                  createDirectoriesIfNeeded()
              }

              public func configureSharedURLCache() {
                  // Bounded URLCache for AsyncImage posters, backdrops, and API responses (24 MB RAM / 96 MB Disk)
                  let cache = URLCache(
                      memoryCapacity: 24 * 1024 * 1024,
                      diskCapacity: 96 * 1024 * 1024,
                      diskPath: "com.harbor.ios.urlcache"
                  )
                  URLCache.shared = cache
              }

              private var baseDirectoryURL: URL {
                  if let caches = fileManager.urls(for: .cachesDirectory, in: .userDomainMask).first {
                      return caches.appendingPathComponent("HarborBoundedCache", isDirectory: true)
                  }
                  return URL(fileURLWithPath: NSTemporaryDirectory()).appendingPathComponent("HarborBoundedCache", isDirectory: true)
              }

              private func directoryURL(for namespace: CacheNamespace) -> URL {
                  baseDirectoryURL.appendingPathComponent(namespace.rawValue, isDirectory: true)
              }

              private func createDirectoriesIfNeeded() {
                  for ns in CacheNamespace.allCases {
                      let dir = directoryURL(for: ns)
                      if !fileManager.fileExists(atPath: dir.path) {
                          try? fileManager.createDirectory(at: dir, withIntermediateDirectories: true)
                      }
                  }
              }

              private func safeFileName(for key: String) -> String {
                  let allowed = CharacterSet.alphanumerics.union(CharacterSet(charactersIn: "-_"))
                  let cleaned = key.unicodeScalars.map { allowed.contains($0) ? Character($0) : "_" }
                  let prefix = String(cleaned.prefix(80))
                  var hash: UInt64 = 5381
                  for byte in key.utf8 {
                      hash = ((hash << 5) &+ hash) &+ UInt64(byte)
                  }
                  return "\(prefix)_\(String(hash, radix: 16)).cache"
              }

              public func storeData(_ data: Data, forKey key: String, namespace: CacheNamespace) {
                  let memKey = "\(namespace.rawValue):\(key)" as NSString
                  memoryCache.setObject(data as NSData, forKey: memKey, cost: data.count)

                  let fileURL = directoryURL(for: namespace).appendingPathComponent(safeFileName(for: key))
                  cacheQueue.async { [weak self] in
                      guard let self else { return }
                      try? data.write(to: fileURL, options: .atomic)
                      self.pruneIfNeededSync()
                  }
              }

              public func loadData(forKey key: String, namespace: CacheNamespace, maxAgeSeconds: TimeInterval = 7 * 86400) -> Data? {
                  let memKey = "\(namespace.rawValue):\(key)" as NSString
                  if let cached = memoryCache.object(forKey: memKey) {
                      return cached as Data
                  }

                  let fileURL = directoryURL(for: namespace).appendingPathComponent(safeFileName(for: key))
                  guard fileManager.fileExists(atPath: fileURL.path) else { return nil }

                  if let attrs = try? fileManager.attributesOfItem(atPath: fileURL.path),
                     let modDate = attrs[.modificationDate] as? Date {
                      if Date().timeIntervalSince(modDate) > maxAgeSeconds {
                          try? fileManager.removeItem(at: fileURL)
                          return nil
                      }
                  }

                  guard let data = try? Data(contentsOf: fileURL) else { return nil }
                  // Touch modification date for LRU tracking
                  try? fileManager.setAttributes([.modificationDate: Date()], ofItemAtPath: fileURL.path)
                  memoryCache.setObject(data as NSData, forKey: memKey, cost: data.count)
                  return data
              }

              public func storeCodable<T: Encodable>(_ value: T, forKey key: String, namespace: CacheNamespace) {
                  guard let data = try? JSONEncoder().encode(value) else { return }
                  storeData(data, forKey: key, namespace: namespace)
              }

              public func loadCodable<T: Decodable>(_ type: T.Type, forKey key: String, namespace: CacheNamespace, maxAgeSeconds: TimeInterval = 7 * 86400) -> T? {
                  guard let data = loadData(forKey: key, namespace: namespace, maxAgeSeconds: maxAgeSeconds) else { return nil }
                  return try? JSONDecoder().decode(T.self, from: data)
              }

              public func setCodable<T: Encodable>(_ value: T, forKey key: String, namespace: CacheNamespace = .metadata) {
                  storeCodable(value, forKey: key, namespace: namespace)
              }

              public func getCodable<T: Decodable>(forKey key: String, as type: T.Type, namespace: CacheNamespace = .metadata, maxAgeSeconds: TimeInterval = 7 * 86400) -> T? {
                  loadCodable(type, forKey: key, namespace: namespace, maxAgeSeconds: maxAgeSeconds)
              }

              public func totalDiskUsageBytes() -> Int64 {
                  var total: Int64 = 0
                  for ns in CacheNamespace.allCases {
                      let dir = directoryURL(for: ns)
                      if let enumerator = fileManager.enumerator(at: dir, includingPropertiesForKeys: [.fileSizeKey]) {
                          for case let fileURL as URL in enumerator {
                              if let size = try? fileURL.resourceValues(forKeys: [.fileSizeKey]).fileSize {
                                  total += Int64(size)
                              }
                          }
                      }
                  }
                  total += Int64(URLCache.shared.currentDiskUsage)
                  return total
              }

              public func formattedDiskUsage() -> String {
                  let bytes = totalDiskUsageBytes()
                  let mb = Double(bytes) / (1024.0 * 1024.0)
                  return String(format: "%.1f MB", max(0.1, mb))
              }

              public func clearAllCaches() {
                  memoryCache.removeAllObjects()
                  URLCache.shared.removeAllCachedResponses()
                  cacheQueue.sync {
                      try? fileManager.removeItem(at: baseDirectoryURL)
                      createDirectoriesIfNeeded()
                  }
              }

              private func pruneIfNeededSync() {
                  var files: [(url: URL, date: Date, size: Int64)] = []
                  var totalSize: Int64 = 0

                  for ns in CacheNamespace.allCases {
                      let dir = directoryURL(for: ns)
                      guard let urls = try? fileManager.contentsOfDirectory(
                          at: dir,
                          includingPropertiesForKeys: [.contentModificationDateKey, .fileSizeKey],
                          options: .skipsHiddenFiles
                      ) else { continue }

                      for url in urls {
                          let values = try? url.resourceValues(forKeys: [.contentModificationDateKey, .fileSizeKey])
                          let date = values?.contentModificationDate ?? .distantPast
                          let size = Int64(values?.fileSize ?? 0)
                          totalSize += size
                          files.append((url, date, size))
                      }
                  }

                  guard totalSize > maxDiskBytes else { return }
                  // Sort oldest first (LRU eviction)
                  files.sort { $0.date < $1.date }
                  let targetSize = Int64(Double(maxDiskBytes) * 0.75)

                  for file in files {
                      guard totalSize > targetSize else { break }
                      try? fileManager.removeItem(at: file.url)
                      totalSize -= file.size
                  }
              }
          }

          // MARK: - 3. HarborAirPlayRoutePicker (Native iOS AirPlay Picker for Audio & Video)

          public struct HarborAirPlayRoutePicker: UIViewRepresentable {
              public var tintColor: UIColor = .white
              public var activeTintColor: UIColor = .systemCyan

              public init(tintColor: UIColor = .white, activeTintColor: UIColor = .systemCyan) {
                  self.tintColor = tintColor
                  self.activeTintColor = activeTintColor
              }

