name: Build Harbor iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Source Files
        run: |
          mkdir -p Sources/HarborIOS
          if [ -d "Harbor-iOS-SwiftUI/Sources/HarborIOS" ]; then
            cp -r Harbor-iOS-SwiftUI/Sources/HarborIOS/* Sources/HarborIOS/
          elif [ -f "HarborIOS.swift" ] && [ ! -f "Sources/HarborIOS/HarborViews.swift" ]; then
            cp HarborIOS.swift Sources/HarborIOS/
          else
            find . -maxdepth 2 -name "*.swift" -not -path "*/Sources/*" -not -name "Package.swift" -exec cp {} Sources/HarborIOS/ \;
          fi

          # منع تجميع ملف الإعدادات Package.swift داخل كود التطبيق
          rm -f Sources/HarborIOS/Package.swift

          # منع تكرار الكود إذا وُجد الملف المجمّع مع الملفات المفردة
          if [ -f "Sources/HarborIOS/HarborIOS.swift" ] && [ -f "Sources/HarborIOS/HarborViews.swift" ]; then
            rm -f Sources/HarborIOS/HarborIOS.swift
          fi

          if [ ! -f "project.yml" ] && [ -f "Harbor-iOS-SwiftUI/project.yml" ]; then
            cp Harbor-iOS-SwiftUI/project.yml ./project.yml
          fi

          echo "Files to compile:"
          ls -la Sources/HarborIOS/

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project HarborIOS.xcodeproj \
            -scheme HarborIOS \
            -configuration Release \
            -archivePath build/HarborIOS.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/HarborIOS.xcarchive/Products/Applications/HarborIOS.app build/Payload/Harbor.app
          cd build && zip -r Harbor.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-iOS-IPA
          path: build/Harbor.ipa
