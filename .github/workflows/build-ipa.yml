                              AsyncImage(url: URL(string: track.artworkURL ?? "")) { phase in
                                  switch phase {
                                  case .success(let image):
                                      image
                                          .resizable()
                                          .scaledToFill()
                                          .frame(width: 52, height: 52)
                                          .clipped()
                                  default:
