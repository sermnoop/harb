                  case .yellow: return Color(red: 1.0, green: 0.92, blue: 0.23)
                  case .cyan: return Color(red: 0.35, green: 0.92, blue: 1.0)
                  case .green: return Color(red: 0.45, green: 0.96, blue: 0.55)
                  }
              }
          }

          public enum HarborSubtitleOutlineStyle: String, CaseIterable, Codable, Identifiable, Sendable {
              case dropShadow = "dropShadow"
              case heavyOutline = "heavyOutline"
              case subtleGlow = "subtleGlow"
              case none = "none"

              public var id: String { rawValue }

              public var displayName: String {
                  switch self {
                  case .dropShadow: return "ظل سينمائي"
                  case .heavyOutline: return "حدود داكنة واضحة"
                  case .subtleGlow: return "توهج ناعم"
                  case .none: return "بدون ظل"
