          // MARK: - 1. Ebook Models (Chapters, Bookmarks, Notes, Reading Preferences)

          public enum HarborBookDocumentFormat: String, Codable, CaseIterable, Sendable {
              case pdf = "PDF"
              case epub = "EPUB"
              case txt = "TXT"
              case html = "HTML"

              public static func detect(from url: URL) -> HarborBookDocumentFormat {
                  switch url.pathExtension.lowercased() {
                  case "epub": return .epub
                  case "txt", "md", "text": return .txt
                  case "html", "htm", "xhtml": return .html
