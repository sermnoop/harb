          public struct HarborSubtitlePreferences: Codable, Equatable, Sendable {
              public var isEnabled: Bool {
                  didSet { save() }
              }
              public var preferredLanguageCode: String {
                  didSet { save() }
              }
              public var fontSize: Double {
                  didSet { save() }
              }
              public var fontChoice: HarborSubtitleFontChoice {
                  didSet { save() }
              }
              public var textColorChoice: HarborSubtitleColorChoice {
                  didSet { save() }
              }
              public var backgroundOpacity: Double {
                  didSet { save() }
              }
              public var outlineStyle: HarborSubtitleOutlineStyle {
                  didSet { save() }
              }
              public var verticalOffset: Double {
                  didSet { save() }
              }
              public var timingDelaySeconds: Double {
                  didSet { save() }
              }

              public init(
                  isEnabled: Bool = true,
                  preferredLanguageCode: String = "ara",
                  fontSize: Double = 20.0,
                  fontChoice: HarborSubtitleFontChoice = .thmanyah,
                  textColorChoice: HarborSubtitleColorChoice = .white,
                  backgroundOpacity: Double = 0.55,
                  outlineStyle: HarborSubtitleOutlineStyle = .dropShadow,
                  verticalOffset: Double = 34.0,
                  timingDelaySeconds: Double = 0.0
              ) {
                  self.isEnabled = isEnabled
                  self.preferredLanguageCode = preferredLanguageCode
                  self.fontSize = fontSize
                  self.fontChoice = fontChoice
                  self.textColorChoice = textColorChoice
                  self.backgroundOpacity = backgroundOpacity
                  self.outlineStyle = outlineStyle
                  self.verticalOffset = verticalOffset
                  self.timingDelaySeconds = timingDelaySeconds
              }

              public static func load() -> HarborSubtitlePreferences {
                  let defaults = UserDefaults.standard
                  let isEnabled = defaults.object(forKey: "harbor_sub_enabled") == nil ? true : defaults.bool(forKey: "harbor_sub_enabled")
                  let preferredLanguageCode = defaults.string(forKey: "harbor_sub_lang") ?? "ara"
                  let savedSize = defaults.double(forKey: "harbor_sub_fontsize")
                  let fontSize = savedSize > 10 ? savedSize : 20.0
                  let fontChoice = HarborSubtitleFontChoice(rawValue: defaults.string(forKey: "harbor_sub_fontchoice") ?? "") ?? .thmanyah
                  let textColorChoice = HarborSubtitleColorChoice(rawValue: defaults.string(forKey: "harbor_sub_color") ?? "") ?? .white
                  let backgroundOpacity = defaults.object(forKey: "harbor_sub_bg_opacity") == nil ? 0.55 : defaults.double(forKey: "harbor_sub_bg_opacity")
                  let outlineStyle = HarborSubtitleOutlineStyle(rawValue: defaults.string(forKey: "harbor_sub_outline") ?? "") ?? .dropShadow
                  let verticalOffset = defaults.object(forKey: "harbor_sub_voffset") == nil ? 34.0 : defaults.double(forKey: "harbor_sub_voffset")
                  let timingDelaySeconds = defaults.double(forKey: "harbor_sub_delay")

                  return HarborSubtitlePreferences(
                      isEnabled: isEnabled,
                      preferredLanguageCode: preferredLanguageCode,
                      fontSize: fontSize,
                      fontChoice: fontChoice,
                      textColorChoice: textColorChoice,
                      backgroundOpacity: backgroundOpacity,
                      outlineStyle: outlineStyle,
                      verticalOffset: verticalOffset,
                      timingDelaySeconds: timingDelaySeconds
                  )
              }

              public func save() {
                  let defaults = UserDefaults.standard
                  defaults.set(isEnabled, forKey: "harbor_sub_enabled")
                  defaults.set(preferredLanguageCode, forKey: "harbor_sub_lang")
                  defaults.set(fontSize, forKey: "harbor_sub_fontsize")
                  defaults.set(fontChoice.rawValue, forKey: "harbor_sub_fontchoice")
                  defaults.set(textColorChoice.rawValue, forKey: "harbor_sub_color")
                  defaults.set(backgroundOpacity, forKey: "harbor_sub_bg_opacity")
                  defaults.set(outlineStyle.rawValue, forKey: "harbor_sub_outline")
                  defaults.set(verticalOffset, forKey: "harbor_sub_voffset")
                  defaults.set(timingDelaySeconds, forKey: "harbor_sub_delay")
              }

              public mutating func resetToDefaults() {
                  self = HarborSubtitlePreferences()
                  save()
              }
          }

          // MARK: - 3. Multi-Format Subtitle Parser (SRT, WebVTT, ASS/SSA + RTL Unicode Handling)

          public enum HarborSubtitleParser {

              public static func detectFormat(fileNameOrURL: String, content: String) -> HarborSubtitleFormat {
                  let lower = fileNameOrURL.lowercased()
                  if lower.hasSuffix(".vtt") || content.trimmingCharacters(in: .whitespacesAndNewlines).hasPrefix("WEBVTT") {
                      return .vtt
                  }
                  if lower.hasSuffix(".ass") || lower.hasSuffix(".ssa") || content.contains("[Events]") {
                      return .ass
                  }
                  return .srt
              }

              public static func parse(content: String, format: HarborSubtitleFormat? = nil) -> [HarborSubtitleCue] {
                  let cleaned = content.replacingOccurrences(of: "\u{FEFF}", with: "")
                      .replacingOccurrences(of: "\r\n", with: "\n")
                      .replacingOccurrences(of: "\r", with: "\n")

                  let resolvedFormat = format ?? detectFormat(fileNameOrURL: "", content: cleaned)
                  switch resolvedFormat {
                  case .srt:
                      return parseSRTOrVTT(cleaned, isVTT: false)
                  case .vtt:
                      return parseSRTOrVTT(cleaned, isVTT: true)
                  case .ass:
                      return parseASS(cleaned)
                  case .embeddedHLS:
                      return []
                  }
              }

              public static func parseSRTOrVTT(_ content: String, isVTT: Bool) -> [HarborSubtitleCue] {
                  var cues: [HarborSubtitleCue] = []
                  let lines = content.components(separatedBy: "\n")
                  var index = 0
                  var cueID = 1

                  while index < lines.count {
                      let line = lines[index].trimmingCharacters(in: .whitespaces)
                      if line.isEmpty || (isVTT && (line.hasPrefix("WEBVTT") || line.hasPrefix("NOTE") || line.hasPrefix("STYLE"))) {
                          index += 1
                          continue
                      }

                      // Check if current line is a timestamp line or if the next line is
                      var timeLine = line
                      if !timeLine.contains("-->") && index + 1 < lines.count && lines[index + 1].contains("-->") {
                          index += 1
                          timeLine = lines[index].trimmingCharacters(in: .whitespaces)
                      }

                      guard timeLine.contains("-->") else {
                          index += 1
                          continue
                      }

                      let parts = timeLine.components(separatedBy: "-->")
                      guard parts.count == 2,
                            let start = parseTimestamp(parts[0]),
                            let end = parseTimestamp(parts[1]) else {
                          index += 1
                          continue
                      }

                      index += 1
                      var textLines: [String] = []
                      while index < lines.count {
                          let textLine = lines[index]
                          if textLine.trimmingCharacters(in: .whitespaces).isEmpty {
                              break
                          }
                          textLines.append(cleanMarkupTags(textLine))
                          index += 1
                      }

                      let joinedText = textLines.joined(separator: "\n").trimmingCharacters(in: .whitespacesAndNewlines)
                      if !joinedText.isEmpty && end >= start {
                          cues.append(HarborSubtitleCue(id: cueID, startTime: start, endTime: end, text: joinedText))
                          cueID += 1
                      }
                      index += 1
                  }

                  return cues.sorted { $0.startTime < $1.startTime }
              }

              public static func parseASS(_ content: String) -> [HarborSubtitleCue] {
                  var cues: [HarborSubtitleCue] = []
                  let lines = content.components(separatedBy: "\n")
                  var inEvents = false
                  var formatColumns: [String] = ["layer", "start", "end", "style", "name", "marginl", "marginr", "marginv", "effect", "text"]
                  var cueID = 1

                  for rawLine in lines {
                      let line = rawLine.trimmingCharacters(in: .whitespaces)
                      if line.lowercased() == "[events]" {
                          inEvents = true
                          continue
                      }
                      if line.hasPrefix("[") && line.lowercased() != "[events]" {
                          if inEvents { break }
                          continue
                      }
                      guard inEvents else { continue }

                      if line.lowercased().hasPrefix("format:") {
                          let formatBody = String(line.dropFirst("format:".count))
                          formatColumns = formatBody.components(separatedBy: ",").map {
                              $0.trimmingCharacters(in: .whitespaces).lowercased()
                          }
                          continue
                      }

                      if line.lowercased().hasPrefix("dialogue:") {
                          let dialogueBody = String(line.dropFirst("dialogue:".count)).trimmingCharacters(in: .whitespaces)
                          let maxSplits = max(1, formatColumns.count - 1)
                          let fields = splitWithLimit(dialogueBody, separator: ",", maxSplits: maxSplits)
                          guard fields.count >= formatColumns.count else { continue }

                          let startIdx = formatColumns.firstIndex(of: "start") ?? 1
                          let endIdx = formatColumns.firstIndex(of: "end") ?? 2
                          let textIdx = formatColumns.firstIndex(of: "text") ?? (fields.count - 1)

                          guard startIdx < fields.count, endIdx < fields.count, textIdx < fields.count,
                                let start = parseTimestamp(fields[startIdx]),
                                let end = parseTimestamp(fields[endIdx]) else {
                              continue
                          }

                          let rawText = fields[textIdx]
                              .replacingOccurrences(of: "\\N", with: "\n")
                              .replacingOccurrences(of: "\\n", with: "\n")
                              .replacingOccurrences(of: "\\h", with: " ")
                          let cleanedText = cleanMarkupTags(rawText).trimmingCharacters(in: .whitespacesAndNewlines)
                          if !cleanedText.isEmpty && end >= start {
                              cues.append(HarborSubtitleCue(id: cueID, startTime: start, endTime: end, text: cleanedText))
                              cueID += 1
                          }
                      }
                  }

                  return cues.sorted { $0.startTime < $1.startTime }
              }

              private static func splitWithLimit(_ string: String, separator: Character, maxSplits: Int) -> [String] {
                  var result: [String] = []
                  var current = ""
                  var splits = 0
                  for char in string {
                      if char == separator && splits < maxSplits {
                          result.append(current)
                          current = ""
                          splits += 1
                      } else {
                          current.append(char)
                      }
                  }
                  result.append(current)
                  return result
              }

              public static func parseTimestamp(_ raw: String) -> TimeInterval? {
                  // Strip VTT positioning settings after timestamp (e.g. "00:01:12.400 line:85%")
                  let token = raw.trimmingCharacters(in: .whitespaces)
                      .components(separatedBy: .whitespaces)
                      .first ?? ""
                  let normalized = token.replacingOccurrences(of: ",", with: ".")
                  let parts = normalized.components(separatedBy: ":")
                  if parts.count == 3 {
                      guard let hours = Double(parts[0]),
                            let minutes = Double(parts[1]),
                            let seconds = Double(parts[2]) else { return nil }
                      return (hours * 3600.0) + (minutes * 60.0) + seconds
                  } else if parts.count == 2 {
                      guard let minutes = Double(parts[0]),
                            let seconds = Double(parts[1]) else { return nil }
                      return (minutes * 60.0) + seconds
                  }
                  return nil
              }

              public static func cleanMarkupTags(_ text: String) -> String {
                  // Strip ASS override blocks {...} and HTML/VTT tags <...>
                  var result = ""
                  var insideCurly = false
                  var insideAngle = false
                  for char in text {
                      if char == "{" { insideCurly = true; continue }
                      if char == "}" { insideCurly = false; continue }
                      if char == "<" { insideAngle = true; continue }
                      if char == ">" { insideAngle = false; continue }
                      if !insideCurly && !insideAngle {
                          result.append(char)
                      }
                  }
                  return result
              }

              public static func containsRTLCharacters(_ text: String) -> Bool {
                  for scalar in text.unicodeScalars {
                      let v = scalar.value
                      if (v >= 0x0600 && v <= 0x06FF) ||
                         (v >= 0x0750 && v <= 0x077F) ||
                         (v >= 0x08A0 && v <= 0x08FF) ||
                         (v >= 0xFB50 && v <= 0xFDFF) ||
                         (v >= 0xFE70 && v <= 0xFEFF) {
                          return true
                      }
                  }
                  return false
              }

              public static func activeCue(in cues: [HarborSubtitleCue], at playbackSeconds: TimeInterval, delayOffset: TimeInterval) -> HarborSubtitleCue? {
                  guard !cues.isEmpty else { return nil }
                  // Effective subtitle time: if user sets +1.0s delay, subtitles appear 1.0s later (so we query playbackSeconds - delayOffset)
                  let targetTime = playbackSeconds - delayOffset

                  // Binary search for fast lookup on large 2,000+ cue files
                  var low = 0
                  var high = cues.count - 1
                  while low <= high {
                      let mid = (low + high) / 2
                      let cue = cues[mid]
                      if targetTime < cue.startTime {
                          high = mid - 1
                      } else if targetTime > cue.endTime {
                          low = mid + 1
                      } else {
                          return cue
                      }
                  }
                  return nil
              }
          }

          // MARK: - 4. OpenSubtitles v3 Stremio Addon Client + Embedded Track Controller

          public final class HarborSubtitleController: ObservableObject, @unchecked Sendable {
              @Published public var availableTracks: [HarborSubtitleTrackDescriptor] = []
              @Published public var selectedTrack: HarborSubtitleTrackDescriptor? = nil
              @Published public var activeCues: [HarborSubtitleCue] = []
              @Published public var activeCue: HarborSubtitleCue? = nil
              @Published public var isLoadingSubtitles: Bool = false
              @Published public var subtitleErrorMessage: String? = nil

              @Published public var availableAudioTracks: [HarborAudioTrackOption] = []
              @Published public var selectedAudioTrackID: String = ""

              public var currentCue: HarborSubtitleCue? {
                  get { activeCue }
                  set { activeCue = newValue }
              }

              private var fetchTask: Task<Void, Never>?
              private weak var boundPlayerItem: AVPlayerItem?

              public init() {}

              public func cleanup() {
                  fetchTask?.cancel()
                  fetchTask = nil
                  boundPlayerItem = nil
              }

              public func inspectEmbeddedTracks(in playerItem: AVPlayerItem?) {
                  guard let playerItem else { return }
                  self.boundPlayerItem = playerItem

                  Task {
                      if let asset = playerItem.asset as? AVURLAsset {
                          if let audibleGroup = try? await asset.loadMediaSelectionGroup(for: .audible) {
                              let options = audibleGroup.options.enumerated().map { idx, opt in
                                  HarborAudioTrackOption(id: "\(idx)_\(opt.displayName)", name: opt.displayName)
                              }
                              self.availableAudioTracks = options
                              if let current = playerItem.currentMediaSelection.selectedMediaOption(in: audibleGroup),
                                 let match = options.first(where: { $0.name == current.displayName }) {
                                  self.selectedAudioTrackID = match.id
                              } else if let first = options.first {
                                  self.selectedAudioTrackID = first.id
                              }
                          }

                          if let legibleGroup = try? await asset.loadMediaSelectionGroup(for: .legible) {
                              var embedded: [HarborSubtitleTrackDescriptor] = []
                              for (idx, option) in legibleGroup.options.enumerated() {
                                  let lang = option.extendedLanguageTag ?? option.locale?.identifier ?? "und"
                                  let desc = HarborSubtitleTrackDescriptor(
                                      id: "embedded_\(idx)_\(lang)",
                                      label: "مدمج: \(option.displayName)",
                                      languageCode: lang.lowercased(),
                                      format: .embeddedHLS,
                                      isEmbedded: true
                                  )
                                  embedded.append(desc)
                              }
                              for track in embedded where !self.availableTracks.contains(track) {
                                  self.availableTracks.append(track)
                              }
                          }
                      }
                  }
              }

              public func fetchOpenSubtitles(
                  imdbID: String,
                  type: String,
                  episodeID: String? = nil,
                  preferences: HarborSubtitlePreferences = .load(),
                  playerItem: AVPlayerItem? = nil
              ) async {
                  if let playerItem {
                      self.boundPlayerItem = playerItem
                      inspectEmbeddedTracks(in: playerItem)
                  }
                  guard imdbID.hasPrefix("tt") else { return }

                  self.isLoadingSubtitles = true
                  defer { self.isLoadingSubtitles = false }

                  let cleanType = (type == "series" || type == "anime") ? "series" : "movie"
                  let resourceId: String
                  if cleanType == "series", let ep = episodeID, ep.contains(":") {
                      resourceId = ep
                  } else {
                      resourceId = imdbID
                  }

                  let cacheKey = "opensub_\(cleanType)_\(resourceId)"
                  if let cachedTracks = HarborDiskCacheManager.shared.loadCodable(
                      [HarborSubtitleTrackDescriptor].self,
                      forKey: cacheKey,
                      namespace: .subtitles,
                      maxAgeSeconds: 3 * 86400
                  ), !cachedTracks.isEmpty {
                      self.mergeExternalTracks(cachedTracks, preferences: preferences)
                      return
                  }

                  guard let encodedId = resourceId.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed),
                        let url = URL(string: "https://opensubtitles-v3.strem.io/subtitles/\(cleanType)/\(encodedId).json") else {
                      return
                  }

                  do {
                      var request = URLRequest(url: url)
                      request.timeoutInterval = 10
                      let (data, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, (200...299).contains(http.statusCode) else { return }

                      struct OpenSubResponse: Decodable {
                          struct SubEntry: Decodable {
                              let id: String?
                              let url: String?
                              let lang: String?
                          }
                          let subtitles: [SubEntry]?
                      }

                      let decoded = try JSONDecoder().decode(OpenSubResponse.self, from: data)
                      let entries = decoded.subtitles ?? []
                      var external: [HarborSubtitleTrackDescriptor] = []
                      var langCounters: [String: Int] = [:]

                      for entry in entries {
                          guard let subURL = entry.url, !subURL.isEmpty else { continue }
                          let rawLang = (entry.lang ?? "und").lowercased()
                          guard rawLang.contains("ara") || rawLang == "ar" || rawLang.contains("eng") || rawLang == "en" || external.count < 16 else {
                              continue
                          }
                          let count = (langCounters[rawLang] ?? 0) + 1
                          langCounters[rawLang] = count
                          guard count <= 5 else { continue }

                          let fmt: HarborSubtitleFormat = subURL.lowercased().contains(".vtt") ? .vtt : (subURL.lowercased().contains(".ass") ? .ass : .srt)
                          let readableLang = Self.localizedLanguageName(for: rawLang)
                          external.append(
                              HarborSubtitleTrackDescriptor(
                                  id: entry.id ?? subURL,
                                  label: "\(readableLang) #\(count) (\(fmt.rawValue))",
                                  languageCode: Self.normalizedLangCode(rawLang),
                                  format: fmt,
                                  remoteURL: subURL,
                                  isEmbedded: false
                              )
                          )
                      }

                      if !external.isEmpty {
                          HarborDiskCacheManager.shared.storeCodable(external, forKey: cacheKey, namespace: .subtitles)
                          self.mergeExternalTracks(external, preferences: preferences)
                      }
                  } catch {
                      // Non-fatal: embedded tracks or manual import remain available
                  }
              }

              private func mergeExternalTracks(_ tracks: [HarborSubtitleTrackDescriptor], preferences: HarborSubtitlePreferences) {
                  for track in tracks where !availableTracks.contains(track) {
                      availableTracks.append(track)
                  }
                  let prefLang = preferences.preferredLanguageCode
                  availableTracks.sort { a, b in
                      let aMatch = a.languageCode.hasPrefix(prefLang)
                      let bMatch = b.languageCode.hasPrefix(prefLang)
                      if aMatch != bMatch { return aMatch }
                      return a.label < b.label
                  }

                  if selectedTrack == nil && preferences.isEnabled {
                      if let preferred = availableTracks.first(where: { $0.languageCode.hasPrefix(prefLang) }) ?? availableTracks.first {
                          selectTrack(preferred, playerItem: boundPlayerItem)
                      }
                  }
              }

              public func selectAudioTrack(_ trackID: String, in playerItem: AVPlayerItem? = nil) {
                  selectedAudioTrackID = trackID
                  let targetItem = playerItem ?? boundPlayerItem
                  guard let item = targetItem else { return }
                  let matchedName = availableAudioTracks.first(where: { $0.id == trackID })?.name ?? trackID
                  Task {
                      if let asset = item.asset as? AVURLAsset,
                         let group = try? await asset.loadMediaSelectionGroup(for: .audible),
                         let option = group.options.first(where: { $0.displayName == matchedName }) {
                          item.select(option, in: group)
                      }
                  }
              }

              public func selectTrack(_ track: HarborSubtitleTrackDescriptor?, playerItem: AVPlayerItem? = nil) {
                  if let playerItem { self.boundPlayerItem = playerItem }
                  selectedTrack = track
                  subtitleErrorMessage = nil

                  guard let track else {
                      activeCues = []
                      activeCue = nil
                      disableEmbeddedLegibleTrack()
                      return
                  }

                  if track.isEmbedded {
                      activeCues = []
                      activeCue = nil
                      enableEmbeddedLegibleTrack(matching: track)
                      return
                  }

                  disableEmbeddedLegibleTrack()

                  if let localURL = track.localFileURL {
                      loadLocalSubtitleFile(url: localURL, format: track.format)
                  } else if let remote = track.remoteURL, let url = URL(string: remote) {
                      loadRemoteSubtitleFile(url: url, format: track.format)
                  }
              }

              public func importSubtitleFile(from url: URL, playerItem: AVPlayerItem? = nil) {
                  if let playerItem { self.boundPlayerItem = playerItem }
                  let accessed = url.startAccessingSecurityScopedResource()
                  defer {
                      if accessed { url.stopAccessingSecurityScopedResource() }
                  }

                  do {
                      let data = try Data(contentsOf: url)
                      guard let content = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .windowsCP1256) ?? String(data: data, encoding: .isoLatin1) else {
                          subtitleErrorMessage = "تعذر قراءة ترميز ملف الترجمة"
                          return
                      }

                      let format = HarborSubtitleParser.detectFormat(fileNameOrURL: url.lastPathComponent, content: content)
                      let parsed = HarborSubtitleParser.parse(content: content, format: format)
                      guard !parsed.isEmpty else {
                          subtitleErrorMessage = "ملف الترجمة لا يحتوي على جمل زمنية صالحة"
                          return
                      }

                      let importedTrack = HarborSubtitleTrackDescriptor(
                          id: "local_\(url.lastPathComponent)_\(Date().timeIntervalSince1970)",
                          label: "ملف محلي: \(url.lastPathComponent)",
                          languageCode: HarborSubtitleParser.containsRTLCharacters(content) ? "ara" : "eng",
                          format: format,
                          localFileURL: url,
                          isEmbedded: false
                      )
                      availableTracks.insert(importedTrack, at: 0)
                      selectedTrack = importedTrack
                      activeCues = parsed
                  } catch {
                      subtitleErrorMessage = "فشل استيراد ملف الترجمة: \(error.localizedDescription)"
                  }
              }

              private func loadLocalSubtitleFile(url: URL, format: HarborSubtitleFormat) {
                  do {
                      let data = try Data(contentsOf: url)
                      if let text = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .windowsCP1256) {
                          activeCues = HarborSubtitleParser.parse(content: text, format: format)
                      }
                  } catch {
                      subtitleErrorMessage = "تعذر فتح ملف الترجمة المحلي"
                  }
              }

              private func loadRemoteSubtitleFile(url: URL, format: HarborSubtitleFormat) {
                  let cacheKey = "subfile_\(url.absoluteString)"
                  if let cachedData = HarborDiskCacheManager.shared.loadData(forKey: cacheKey, namespace: .subtitles, maxAgeSeconds: 7 * 86400),
                     let text = String(data: cachedData, encoding: .utf8) ?? String(data: cachedData, encoding: .windowsCP1256) {
                      let cues = HarborSubtitleParser.parse(content: text, format: format)
                      if !cues.isEmpty {
                          self.activeCues = cues
                          return
                      }
                  }

                  Task {
                      self.isLoadingSubtitles = true
                      defer { self.isLoadingSubtitles = false }
                      do {
                          var request = URLRequest(url: url)
                          request.timeoutInterval = 12
                          let (data, response) = try await URLSession.shared.data(for: request)
                          guard let http = response as? HTTPURLResponse, (200...299).contains(http.statusCode) else {
                              self.subtitleErrorMessage = "ملف الترجمة غير متاح من المصدر"
                              return
                          }
                          guard let text = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .windowsCP1256) ?? String(data: data, encoding: .isoLatin1) else {
                              self.subtitleErrorMessage = "ترميز ملف الترجمة غير مدعوم"
                              return
                          }
                          let cues = HarborSubtitleParser.parse(content: text, format: format)
                          if cues.isEmpty {
                              self.subtitleErrorMessage = "لم يتم العثور على نصوص صالحة داخل الترجمة"
                          } else {
                              HarborDiskCacheManager.shared.storeData(data, forKey: cacheKey, namespace: .subtitles)
                              self.activeCues = cues
                          }
                      } catch {
                          self.subtitleErrorMessage = "تعذر تحميل ملف الترجمة"
                      }
                  }
              }

              private func enableEmbeddedLegibleTrack(matching descriptor: HarborSubtitleTrackDescriptor) {
                  guard let item = boundPlayerItem else { return }
                  Task {
                      if let asset = item.asset as? AVURLAsset,
                         let group = try? await asset.loadMediaSelectionGroup(for: .legible) {
                          if let match = group.options.first(where: { descriptor.label.contains($0.displayName) }) ?? group.options.first {
                              item.select(match, in: group)
                          }
                      }
                  }
              }

              private func disableEmbeddedLegibleTrack() {
                  guard let item = boundPlayerItem else { return }
                  Task {
                      if let asset = item.asset as? AVURLAsset,
                         let group = try? await asset.loadMediaSelectionGroup(for: .legible) {
                          item.select(nil, in: group)
                      }
                  }
              }

              public func updatePlaybackTime(_ seconds: TimeInterval, preferences: HarborSubtitlePreferences = .load()) {
                  guard preferences.isEnabled, !activeCues.isEmpty else {
                      if activeCue != nil { activeCue = nil }
                      return
                  }
                  let delay = preferences.timingDelaySeconds
                  let matched = HarborSubtitleParser.activeCue(in: activeCues, at: seconds, delayOffset: delay)
                  if matched != activeCue {
                      activeCue = matched
                  }
              }

              public static func normalizedLangCode(_ raw: String) -> String {
                  let lower = raw.lowercased()
                  if lower == "ar" || lower.contains("ara") { return "ara" }
                  if lower == "en" || lower.contains("eng") { return "eng" }
                  if lower == "fr" || lower.contains("fre") || lower.contains("fra") { return "fre" }
                  if lower == "es" || lower.contains("spa") { return "spa" }
                  return lower
              }

              public static func localizedLanguageName(for code: String) -> String {
                  let norm = normalizedLangCode(code)
                  switch norm {
                  case "ara": return "العربية"
                  case "eng": return "English"
                  case "fre": return "Français"
                  case "spa": return "Español"
                  default: return code.uppercased()
                  }
              }
          }

