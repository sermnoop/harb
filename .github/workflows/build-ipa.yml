          import Foundation
          import SwiftUI

          // MARK: - 14. Harbor Automated Self-Test & Diagnostics Engine (Phase 9 Verification)

          public struct HarborTestCaseResult: Identifiable, Sendable {
              public let id = UUID()
              public let name: String
              public let passed: Bool
              public let detail: String
          }

          public enum HarborSelfTestSuite {
              /// Runs deterministic unit tests for models, stream ranking, subtitle parsing/timing, EPUB XHTML extraction, and cache persistence.
              public static func runAllTests() -> [HarborTestCaseResult] {
                  var results: [HarborTestCaseResult] = []

                  // 1. Model Decoding Test
                  do {
                      let sampleJSON = """
                      {
                        "metas": [
                          {
                            "id": "tt15239678",
                            "type": "movie",
                            "name": "Dune: Part Two",
                            "releaseInfo": "2024",
                            "imdbRating": "8.6",
                            "genres": ["Action", "Adventure", "Sci-Fi"]
                          }
                        ]
                      }
                      """.data(using: .utf8)!
                      let decoded = try JSONDecoder().decode(StremioCatalogResponse.self, from: sampleJSON)
                      let item = decoded.metas.first
                      let ok = (item?.id == "tt15239678" && item?.name == "Dune: Part Two" && item?.displayYear == "2024")
                      results.append(HarborTestCaseResult(
                          name: "Data Models & Stremio JSON Decoding",
                          passed: ok,
                          detail: ok ? "Decoded StremioMetaPreview (\(item?.name ?? ""))" : "Failed decoding metadata fields"
                      ))
                  } catch {
                      results.append(HarborTestCaseResult(
                          name: "Data Models & Stremio JSON Decoding",
                          passed: false,
                          detail: error.localizedDescription
                      ))
                  }

                  // 2. Stream Quality Detection Test (No Fake 4K/HDR Claims)
                  do {
                      let raw4K = StremioRawStream(
                          name: "RD+ 4K",
                          title: "Dune.Part.Two.2024.2160p.UHD.BluRay.HDR10.DV.HEVC.Atmos.mkv 💾 18.4 GB",
                          description: nil,
                          url: "https://example.com/dune4k.mkv",
                          infoHash: nil,
                          fileIdx: nil,
                          externalUrl: nil,
                          behaviorHints: nil
                      )
                      let raw720 = StremioRawStream(
                          name: "WebStream",
                          title: "Dune.Part.Two.2024.720p.WEB-DL.x264.AAC.mp4",
                          description: nil,
                          url: "https://example.com/dune720.mp4",
                          infoHash: nil,
                          fileIdx: nil,
                          externalUrl: nil,
                          behaviorHints: nil
                      )
                      let ranked = HarborStreamEngine.processStreams(
                          rawStreams: [("Torrentio", raw4K), ("Web", raw720)],
                          expectedTitle: "Dune: Part Two",
                          safetyFilter: .strict
                      )
                      let top = ranked.first
                      let second = ranked.last
                      let ok = (top?.tier == .uhd4KDV && top?.hdrFlavor != nil && second?.tier == .hd720p && second?.hdrFlavor == nil)
                      results.append(HarborTestCaseResult(
                          name: "Stream Quality & Honest HDR/4K Detection",
                          passed: ok,
                          detail: ok ? "Verified 2160p DV/HDR10 ranked #1 & 720p has nil HDR badge" : "Stream ranking mismatch"
                      ))
                  }

                  // 3. SRT Subtitle Parsing, RTL Detection & Timing Delay Test
                  do {
                      let sampleSRT = """
                      1
                      00:00:10,000 --> 00:00:14,500
                      <i>مرحباً بكم في تطبيق هاربور</i>

                      2
                      00:00:16,000 --> 00:00:19,000
                      Welcome to Harbor Cinema Player
                      """
                      let cues = HarborSubtitleParser.parse(content: sampleSRT, format: .srt)
                      let firstCue = HarborSubtitleParser.activeCue(in: cues, at: 12.0, delayOffset: 0.0)
                      let delayedCue = HarborSubtitleParser.activeCue(in: cues, at: 13.5, delayOffset: 2.0) // effective 11.5s -> cue 1
                      let ok = (cues.count == 2 &&
                                cues[0].text == "مرحباً بكم في تطبيق هاربور" &&
                                cues[0].isRightToLeft == true &&
                                cues[1].isRightToLeft == false &&
                                firstCue?.index == 1 &&
                                delayedCue?.index == 1)
                      results.append(HarborTestCaseResult(
                          name: "SRT/WebVTT Parser, RTL Detection & Timing Delay",
                          passed: ok,
                          detail: ok ? "Parsed 2 cues, verified Arabic RTL & +2.0s delay synchronization" : "Subtitle parser error"
                      ))
                  }

                  // 4. ASS/SSA Dialogue Parsing & Tag Stripping Test
                  do {
                      let sampleASS = """
                      [Events]
                      Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
                      Dialogue: 0,0:01:05.00,0:01:09.50,Default,,0,0,0,,{\\pos(400,570)\\an2}هذه ترجمة بصيغة ASS\\Nمع سطر ثانٍ
                      """
                      let cues = HarborSubtitleParser.parse(content: sampleASS, format: .ass)
                      let ok = (cues.count == 1 &&
                                abs(cues[0].startTime - 65.0) < 0.01 &&
                                cues[0].text.contains("هذه ترجمة بصيغة ASS\nمع سطر ثانٍ"))
                      results.append(HarborTestCaseResult(
                          name: "ASS/SSA Subtitle Parser & Override Tag Stripping",
                          passed: ok,
                          detail: ok ? "Stripped {\\pos\\an2} tags and converted \\N to newline" : "ASS parser failed"
                      ))
                  }

                  // 5. Reflowable EPUB/HTML Extraction Test
                  do {
                      let xhtml = """
                      <html><head><title>الفصل الأول</title></head>
                      <body><h1>الفصل الأول: البداية</h1><p>كان البحر هادئاً في تلك الليلة.</p></body></html>
                      """
                      let extracted = HarborEPUBParser.extractReadableText(fromXHTML: xhtml, fallbackTitle: "Chapter 1")
                      let ok = (extracted.title.contains("الفصل الأول") && extracted.body.contains("كان البحر هادئاً"))
                      results.append(HarborTestCaseResult(
                          name: "EPUB/XHTML Reflowable Chapter Extractor",
                          passed: ok,
                          detail: ok ? "Extracted chapter title & clean paragraph text" : "XHTML extraction failed"
                      ))
                  }

                  // 6. Bounded Disk Cache Persistence Roundtrip Test
                  do {
                      let key = "selftest.cache.roundtrip"
                      let payload = ["harbor-v3-ok"]
                      HarborDiskCacheManager.shared.setCodable(payload, forKey: key)
                      let restored = HarborDiskCacheManager.shared.getCodable(forKey: key, as: [String].self)
                      let ok = (restored == payload)
                      results.append(HarborTestCaseResult(
                          name: "Bounded LRU Disk Cache Persistence",
                          passed: ok,
                          detail: ok ? "Verified Codable read/write in HarborDiskCache" : "Disk cache roundtrip failed"
                      ))
                  }

                  return results
              }
          }
          EOF

