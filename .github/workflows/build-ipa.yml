                                                          .shadow(color: isActive ? Color.white.opacity(0.48) : .clear, radius: 28, x: 0, y: 0)
                                                          .multilineTextAlignment(.leading)
                                                          .frame(maxWidth: .infinity, alignment: .leading)
                                                          .padding(.vertical, isActive ? 10 : 4)
