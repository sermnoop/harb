name: Build Harbor iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Source Files and Project Spec
        run: |
          mkdir -p Sources/HarborIOS
          if [ -d "Harbor-iOS-SwiftUI/Sources/HarborIOS" ]; then
            cp -r Harbor-iOS-SwiftUI/Sources/HarborIOS/* Sources/HarborIOS/
          elif [ -f "HarborIOS.swift" ] && [ ! -f "Sources/HarborIOS/HarborViews.swift" ]; then
            cp HarborIOS.swift Sources/HarborIOS/
          else
            find . -maxdepth 2 -name "*.swift" -not -path "*/Sources/*" -not -name "Package.swift" -exec cp {} Sources/HarborIOS/ \;
          fi
          rm -f Sources/HarborIOS/Package.swift
          rm -f Sources/HarborIOS/Info.plist
          if [ -f "Sources/HarborIOS/HarborIOS.swift" ] && [ -f "Sources/HarborIOS/HarborViews.swift" ]; then
            rm -f Sources/HarborIOS/HarborIOS.swift
          fi

          cat << 'EOF' >> Sources/HarborIOS/HarborStore.swift

          // MARK: - Smooth Interactive Button Style

          struct SmoothPressButtonStyle: ButtonStyle {
              var scaleAmount: CGFloat = 0.96
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .scaleEffect(configuration.isPressed ? scaleAmount : 1.0)
                      .opacity(configuration.isPressed ? 0.92 : 1.0)
                      .animation(.spring(response: 0.28, dampingFraction: 0.72), value: configuration.isPressed)
              }
          }

          // MARK: - Multi-Engine Music Resolver (JioSaavn Full-Track + Deezer + iTunes SA/US + Piped)

          enum JioSaavnStreamCrypto {
              static func decryptURL(_ enc: String) -> String? {
                  guard let data = Data(base64Encoded: enc.trimmingCharacters(in: .whitespacesAndNewlines)),
                        let key = "38346591".data(using: .utf8), !data.isEmpty else { return nil }
                  let bufSize = data.count + kCCBlockSizeDES
                  var out = [UInt8](repeating: 0, count: bufSize)
                  var outLen: size_t = 0
                  let status = data.withUnsafeBytes { inPtr in
                      key.withUnsafeBytes { keyPtr in
                          CCCrypt(CCOperation(kCCDecrypt), CCAlgorithm(kCCAlgorithmDES),
                                  CCOptions(kCCOptionECBMode | kCCOptionPKCS7Padding),
                                  keyPtr.baseAddress, kCCKeySizeDES, nil,
                                  inPtr.baseAddress, data.count, &out, bufSize, &outLen)
                      }
                  }
                  guard status == kCCSuccess,
                        var str = String(data: Data(bytes: out, count: outLen), encoding: .utf8)?
                            .trimmingCharacters(in: .controlCharacters.union(.whitespacesAndNewlines)),
                        str.hasPrefix("http") else { return nil }
                  return str.replacingOccurrences(of: "http://", with: "https://")
                            .replacingOccurrences(of: "_96.mp4", with: "_160.mp4")
                            .replacingOccurrences(of: "_48.mp4", with: "_160.mp4")
              }

              static func searchFullLengthTracks(query: String) async -> [HarborMusicTrack] {
                  let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? query

                  async let saavnDirectTask = fromJioSaavnDirect(q)
                  async let saavnMirrorTask = fromSaavnMirrors(q)
                  async let deezerTask = fromDeezerAPI(q)
                  async let itunesSATask = fromITunesAPI(q, country: "SA")
                  async let pipedTask = fromPipedAudioAPI(q)

                  let (saavnDirect, saavnMirror, deezer, itunesSA, piped) = await (saavnDirectTask, saavnMirrorTask, deezerTask, itunesSATask, pipedTask)

                  var fullPool: [HarborMusicTrack] = []
                  if let s1 = saavnDirect { fullPool.append(contentsOf: s1) }
                  if let s2 = saavnMirror { fullPool.append(contentsOf: s2) }
                  if let p1 = piped { fullPool.append(contentsOf: p1) }

                  var combined: [HarborMusicTrack] = []
                  var seenKeys = Set<String>()

                  for t in fullPool {
                      let key = "\(t.title.lowercased())|\(t.artist.lowercased().prefix(8))"
                      if !seenKeys.contains(key) {
                          seenKeys.insert(key)
                          combined.append(t)
                      }
                  }

                  let catalogPool = (deezer ?? []) + (itunesSA ?? [])
                  for catTrack in catalogPool {
                      let key = "\(catTrack.title.lowercased())|\(catTrack.artist.lowercased().prefix(8))"
                      if seenKeys.contains(key) { continue }
                      if let fullMatch = fullPool.first(where: {
                          $0.title.lowercased() == catTrack.title.lowercased()
                      }) {
                          let merged = HarborMusicTrack(
                              id: catTrack.id,
                              title: catTrack.title,
                              artist: catTrack.artist,
                              album: "\(catTrack.album) • كامل",
                              artworkURL: catTrack.artworkURL ?? fullMatch.artworkURL,
                              streamURL: fullMatch.streamURL,
                              durationSeconds: max(fullMatch.durationSeconds, catTrack.durationSeconds),
                              genre: catTrack.genre,
                              isLiveStream: false
                          )
                          seenKeys.insert(key)
                          combined.append(merged)
                      } else {
                          seenKeys.insert(key)
                          combined.append(catTrack)
                      }
                  }

                  return combined
              }

              static func resolveBestFullStream(title: String, artist: String) async -> (url: String, duration: Double)? {
                  let q = "\(title) \(artist)".addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? title
                  if let s1 = await fromJioSaavnDirect(q), let first = s1.first {
                      return (first.streamURL, first.durationSeconds)
                  }
                  if let s2 = await fromSaavnMirrors(q), let first = s2.first {
                      return (first.streamURL, first.durationSeconds)
                  }
                  if let p1 = await fromPipedAudioAPI(q), let first = p1.first {
                      return (first.streamURL, first.durationSeconds)
                  }
                  return nil
              }

              private static func fromJioSaavnDirect(_ q: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://www.jiosaavn.com/api.php?_format=json&_marker=0&ctx=web6dot0&api_version=4&__call=search.getResults&q=\(q)&n=20&p=1") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["results"] as? [[String: Any]] else { return nil }
                  return items.compactMap { item in
                      let info = item["more_info"] as? [String: Any]
                      guard let enc = info?["encrypted_media_url"] as? String, let stream = decryptURL(enc) else { return nil }
                      let id = (item["id"] as? String) ?? UUID().uuidString
                      let title = clean((item["title"] as? String) ?? (item["song"] as? String) ?? "Song")
                      let artist = clean((info?["music"] as? String) ?? (item["subtitle"] as? String) ?? "Artist")
                      let album = clean((info?["album"] as? String) ?? "Full Track")
                      let dur = Double((info?["duration"] as? String) ?? "") ?? Double((info?["duration"] as? Int) ?? 210)
                      let art = (item["image"] as? String)?.replacingOccurrences(of: "150x150", with: "500x500").replacingOccurrences(of: "http://", with: "https://")
                      return HarborMusicTrack(id: "saavn-\(id)", title: title, artist: artist, album: "\(album) • كامل", artworkURL: art, streamURL: stream, durationSeconds: max(dur, 60), genre: "Lossless Audio", isLiveStream: false)
                  }
              }

              private static func fromSaavnMirrors(_ q: String) async -> [HarborMusicTrack]? {
                  for host in ["https://saavn.sumit.co", "https://saavn.dev"] {
                      guard let url = URL(string: "\(host)/api/search/songs?query=\(q)&limit=15") else { continue }
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 5
                      guard let (data, _) = try? await URLSession.shared.data(for: req),
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let dataObj = root["data"] as? [String: Any],
                            let items = dataObj["results"] as? [[String: Any]] else { continue }
                      let list: [HarborMusicTrack] = items.compactMap { item in
                          guard let dls = item["downloadUrl"] as? [[String: Any]],
                                let lastDL = dls.last,
                                let rawLink = (lastDL["url"] as? String) ?? (lastDL["link"] as? String) else { return nil }
                          let title = clean((item["name"] as? String) ?? "Song")
                          let dur = (item["duration"] as? Double) ?? Double((item["duration"] as? Int) ?? 210)
                          var artist = "Artist"
                          if let aObj = item["artists"] as? [String: Any], let prim = aObj["primary"] as? [[String: Any]], let firstA = prim.first?["name"] as? String {
                              artist = clean(firstA)
                          } else if let pStr = item["primaryArtists"] as? String, !pStr.isEmpty {
                              artist = clean(pStr)
                          }
                          let imgs = item["image"] as? [[String: Any]]
                          let art = ((imgs?.last?["url"] as? String) ?? (imgs?.last?["link"] as? String))?.replacingOccurrences(of: "http://", with: "https://")
                          return HarborMusicTrack(id: UUID().uuidString, title: title, artist: artist, album: "كامل 320kbps", artworkURL: art, streamURL: rawLink.replacingOccurrences(of: "http://", with: "https://"), durationSeconds: max(dur, 60), genre: "Lossless", isLiveStream: false)
                      }
                      if !list.isEmpty { return list }
                  }
                  return nil
              }

              private static func fromDeezerAPI(_ q: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://api.deezer.com/search?q=\(q)&limit=25") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["data"] as? [[String: Any]] else { return nil }
                  return items.compactMap { item in
                      guard let title = item["title"] as? String,
                            let preview = item["preview"] as? String, !preview.isEmpty else { return nil }
                      let id = (item["id"] as? Int).map { String($0) } ?? UUID().uuidString
                      let dur = Double((item["duration"] as? Int) ?? 210)
                      let artistObj = item["artist"] as? [String: Any]
                      let artist = (artistObj?["name"] as? String) ?? "Artist"
                      let albumObj = item["album"] as? [String: Any]
                      let album = (albumObj?["title"] as? String) ?? "Single"
                      let art = (albumObj?["cover_xl"] as? String) ?? (albumObj?["cover_big"] as? String) ?? (albumObj?["cover_medium"] as? String)
                      return HarborMusicTrack(id: "dz-\(id)", title: title, artist: artist, album: album, artworkURL: art, streamURL: preview, durationSeconds: max(dur, 30), genre: "Apple Music Catalog", isLiveStream: false)
                  }
              }

              private static func fromITunesAPI(_ q: String, country: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://itunes.apple.com/search?term=\(q)&country=\(country)&media=music&entity=song&limit=25") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let decoded = try? JSONDecoder().decode(ITunesSearchResponse.self, from: data) else { return nil }
                  return decoded.results.compactMap { item in
                      guard let preview = item.previewUrl, let title = item.trackName else { return nil }
                      let hiRes = item.artworkUrl100?.replacingOccurrences(of: "100x100bb", with: "600x600bb")
                      return HarborMusicTrack(
                          id: "it-\(item.trackId ?? Int.random(in: 1000...999999))",
                          title: title,
                          artist: item.artistName ?? "Artist",
                          album: item.collectionName ?? "Single",
                          artworkURL: hiRes,
                          streamURL: preview,
                          durationSeconds: Double(item.trackTimeMillis ?? 210000) / 1000.0,
                          genre: item.primaryGenreName,
                          isLiveStream: false
                      )
                  }
              }

              private static func fromPipedAudioAPI(_ q: String) async -> [HarborMusicTrack]? {
                  let instances = ["https://pipedapi.kavin.rocks", "https://api.piped.private.coffee"]
                  for host in instances {
                      guard let searchURL = URL(string: "\(host)/search?q=\(q)&filter=music_songs") else { continue }
                      var req = URLRequest(url: searchURL)
                      req.timeoutInterval = 4
                      guard let (data, resp) = try? await URLSession.shared.data(for: req),
                            let http = resp as? HTTPURLResponse, http.statusCode == 200,
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let items = root["items"] as? [[String: Any]],
                            let firstItem = items.first,
                            let urlPath = firstItem["url"] as? String else { continue }
                      let videoId = urlPath.replacingOccurrences(of: "/watch?v=", with: "")
                      guard let streamEndpoint = URL(string: "\(host)/streams/\(videoId)") else { continue }
                      var sReq = URLRequest(url: streamEndpoint)
                      sReq.timeoutInterval = 4
                      guard let (sData, _) = try? await URLSession.shared.data(for: sReq),
                            let sRoot = try? JSONSerialization.jsonObject(with: sData) as? [String: Any],
                            let audioStreams = sRoot["audioStreams"] as? [[String: Any]] else { continue }
                      if let m4a = audioStreams.first(where: { ($0["mimeType"] as? String)?.contains("mp4") == true }) ?? audioStreams.first,
                         let directAudioURL = m4a["url"] as? String {
                          let title = (firstItem["title"] as? String) ?? "Track"
                          let artist = (firstItem["uploaderName"] as? String) ?? "Artist"
                          let dur = Double((firstItem["duration"] as? Int) ?? 210)
                          let thumb = firstItem["thumbnail"] as? String
                          return [HarborMusicTrack(id: "piped-\(videoId)", title: title, artist: artist, album: "Full Audio • كامل", artworkURL: thumb, streamURL: directAudioURL, durationSeconds: max(dur, 60), genre: "Full Song", isLiveStream: false)]
                      }
                  }
                  return nil
              }

              static func clean(_ s: String) -> String {
                  s.replacingOccurrences(of: "&quot;", with: "\"").replacingOccurrences(of: "&amp;", with: "&").replacingOccurrences(of: "&#039;", with: "'")
              }
          }

          // MARK: - Multi-Addon & 6 Direct Cloud Stream Servers Builder

          enum HarborCloudStreamBuilder {
              static func defaultAddons() -> [StremioManifest] {
                  let specs: [(String, String, String, String)] = [
                      ("com.plaviohd.streams", "PlavioHD Direct HTTPS", "بث مباشر للأفلام والمسلسلات بدقة حتى 4K عبر HTTPS", "https://plaviohd.vercel.app/manifest.json"),
                      ("com.plaviohd.worker", "PlavioHD Edge Mirror", "خادم PlavioHD الاحتياطي للبث المباشر عبر HTTPS", "https://plaviohd.edon.workers.dev/manifest.json"),
                      ("uk.pengu.streams", "PenguPlay HTTP Streams", "سيرفرات بث HTTP مباشرة للأفلام والمسلسلات والأنمي", "https://pengu.uk/manifest.json"),
                      ("org.webstreamrmbg.addon", "WebStreamrMBG HTTP", "روابط بث HTTP مباشرة من 25+ موقع سينمائي", "https://87d6a6ef6b58-webstreamrmbg.baby-beamup.club/manifest.json"),
                      ("app.flixnest.free", "Flix-Streams Free HTTP", "روابط HTTP وHLS مباشرة للأفلام والمسلسلات والأنمي", "https://free.flixnest.app/manifest.json"),
                      ("io.qzz.hdhub", "HdHub Direct Streams", "روابط مشاهدة مباشرة للأفلام والمسلسلات بجودة عالية", "https://hdhub.thevolecitor.qzz.io/manifest.json"),
                      ("com.stremio.torrentio.addon", "Torrentio", "أشهر إضافة مصادر بث 4K/1080p في Stremio", "https://torrentio.strem.fun/manifest.json"),
                      ("mov.peerflix.addon", "Peerflix", "مصادر بث إضافية للأفلام والمسلسلات والأنمي", "https://peerflix.mov/manifest.json"),
                      ("com.linvo.cinemeta", "Cinemeta", "الكتالوج الرسمي للأفلام والمسلسلات في Stremio", "https://v3-cinemeta.strem.io/manifest.json")
                  ]
                  return specs.map { StremioManifest(id: $0.0, version: "1.5.0", name: $0.1, description: $0.2, logo: nil, types: ["movie", "series", "anime"], catalogs: [], transportUrl: $0.3) }
              }

              static func fetchAndRankAllStreams(for item: StremioMetaPreview, episodeId: String?, installedAddons: [StremioManifest], safetyFilter: StreamSafetyFilter) async -> [HarborRankedStream] {
                  let targetId = episodeId ?? item.id
                  let mediaType = item.type == "anime" ? "series" : item.type
                  let parts = targetId.components(separatedBy: ":")
                  let imdbId = parts.first ?? item.id
                  let s = parts.count >= 2 ? (Int(parts[1]) ?? 1) : 1
                  let e = parts.count >= 3 ? (Int(parts[2]) ?? 1) : 1
                  let epTag = mediaType == "movie" ? "" : " S\(String(format: "%02d", s))E\(String(format: "%02d", e))"
                  let isMov = (mediaType == "movie")

                  let cloudList: [(String, String, String, String)] = [
                      ("VidSrc CC v2", "⚡ [RD+] VidSrc CC 1080p FHD", "\(item.name)\(epTag) • 1080p BluRay WEB-DL HDR10 HEVC 5.1 (ترجمة عربية / إنجليزية)\n👤 980 💾 4.2 GB (سيرفر سحابي فوري 1)", isMov ? "https://vidsrc.cc/v2/embed/movie/\(imdbId)" : "https://vidsrc.cc/v2/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("VidLink Pro Cloud", "⚡ [RD+] VidLink Pro 4K/1080p", "\(item.name)\(epTag) • 2160p Dolby Vision / 1080p WEB-DL HEVC Atmos Multi-Subs\n👤 950 💾 6.4 GB (سيرفر سحابي فوري 2)", isMov ? "https://vidlink.pro/movie/\(imdbId)?autoplay=true" : "https://vidlink.pro/tv/\(imdbId)/\(s)/\(e)?autoplay=true"),
                      ("VidSrc ICU", "⚡ [TB+] VidSrc ICU 1080p", "\(item.name)\(epTag) • 1080p WEB-DL AVC AAC Multi-Server Cloud\n👤 640 💾 3.1 GB (سيرفر سحابي سريع 3)", isMov ? "https://vidsrc.icu/embed/movie/\(imdbId)" : "https://vidsrc.icu/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("AutoEmbed Pro", "⚡ [HTTP/HLS] AutoEmbed 1080p FHD", "\(item.name)\(epTag) • 1080p WEB-DL HEVC Multi-Audio Server\n👤 510 💾 2.8 GB (سيرفر مباشر 4)", isMov ? "https://player.autoembed.cc/embed/movie/\(imdbId)" : "https://player.autoembed.cc/embed/tv/\(imdbId)/\(s)/\(e)"),
                      ("MultiEmbed VIP", "⚡ [HTTP/HLS] SuperEmbed 1080p VIP", "\(item.name)\(epTag) • 1080p BluRay WEB-DL Direct VIP Server\n👤 430 💾 2.5 GB (سيرفر مباشر 5)", isMov ? "https://multiembed.mov/directstream.php?video_id=\(imdbId)" : "https://multiembed.mov/directstream.php?video_id=\(imdbId)&s=\(s)&e=\(e)"),
                      ("VidSrc XYZ", "⚡ [HTTP/HLS] VidSrc XYZ 1080p", "\(item.name)\(epTag) • 1080p WEB-DL Backup Cloud Server\n👤 390 💾 2.2 GB (خادم احتياطي 6)", isMov ? "https://vidsrc.xyz/embed/movie/\(imdbId)" : "https://vidsrc.xyz/embed/tv/\(imdbId)/\(s)/\(e)")
                  ]
                  let fallbackURL = cloudList[0].3
                  var collected: [(addonName: String, stream: StremioRawStream)] = cloudList.map {
                      ($0.0, StremioRawStream(name: $0.1, title: $0.2, description: $0.0, url: $0.3, infoHash: nil, fileIdx: nil, externalUrl: $0.3, behaviorHints: nil))
                  }

                  await withTaskGroup(of: [(String, StremioRawStream)].self) { group in
                      for addon in installedAddons where addon.id != "com.linvo.cinemeta" {
                          guard let t = addon.transportUrl, t.hasPrefix("http"), t.hasSuffix("/manifest.json") else { continue }
                          let base = t.replacingOccurrences(of: "/manifest.json", with: "")
                          let addonName = addon.name
                          group.addTask {
                              let enc = targetId.replacingOccurrences(of: ":", with: "%3A")
                              for uStr in ["\(base)/stream/\(mediaType)/\(targetId).json", "\(base)/stream/\(mediaType)/\(enc).json"] {
                                  guard let u = URL(string: uStr) else { continue }
                                  var req = URLRequest(url: u)
                                  req.timeoutInterval = 6
                                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) Stremio/4.4", forHTTPHeaderField: "User-Agent")
                                  if let (data, resp) = try? await URLSession.shared.data(for: req),
                                     let http = resp as? HTTPURLResponse, http.statusCode == 200,
                                     let dec = try? JSONDecoder().decode(StremioStreamResponse.self, from: data), !dec.streams.isEmpty {
                                      return dec.streams.prefix(15).map { r in
                                          (addonName, StremioRawStream(name: r.name ?? addonName, title: r.title ?? r.description ?? item.name, description: r.description, url: r.url ?? r.externalUrl, infoHash: r.infoHash, fileIdx: r.fileIdx, externalUrl: r.externalUrl ?? fallbackURL, behaviorHints: r.behaviorHints))
                                      }
                                  }
                              }
                              return []
                          }
                      }
                      for await batch in group { collected.append(contentsOf: batch) }
                  }
                  return HarborStreamEngine.processStreams(rawStreams: collected, expectedTitle: item.name, safetyFilter: .off)
              }
          }

          // MARK: - Hybrid Smart Video Player (AVPlayer + Ad-Blocked WKWebView Cloud Player)

          struct HarborSmartVideoContainer: View {
              let url: URL
              let player: AVPlayer
              static func isEmbedURL(_ url: URL) -> Bool {
                  let h = (url.host ?? "").lowercased()
                  let p = url.path.lowercased()
                  if p.hasSuffix(".m3u8") || p.hasSuffix(".mp4") || p.hasSuffix(".mkv") || h.contains("real-debrid") || h.contains("torbox") || h.contains("apple.com") || h.contains("googleapis.com") { return false }
                  return h.contains("vidlink") || h.contains("vidsrc") || h.contains("autoembed") || h.contains("multiembed") || p.contains("/embed/") || p.contains("directstream")
              }
              var body: some View {
                  if Self.isEmbedURL(url) {
                      HarborCloudStreamWebView(url: url).ignoresSafeArea().onAppear { player.pause(); player.replaceCurrentItem(with: nil) }
                  } else {
                      VideoPlayer(player: player).ignoresSafeArea()
                  }
              }
          }

          struct HarborCloudStreamWebView: UIViewRepresentable {
              let url: URL
              func makeCoordinator() -> Coordinator { Coordinator(host: url.host) }
              func makeUIView(context: Context) -> WKWebView {
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.allowsAirPlayForMediaPlayback = true
                  cfg.allowsPictureInPictureMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  let adShield = "window.open = function(){ return null; };"
                  cfg.userContentController.addUserScript(WKUserScript(source: adShield, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.backgroundColor = .black
                  wv.isOpaque = false
                  wv.scrollView.backgroundColor = .black
                  wv.scrollView.contentInsetAdjustmentBehavior = .never
                  wv.scrollView.isScrollEnabled = false
                  wv.navigationDelegate = context.coordinator
                  wv.uiDelegate = context.coordinator
                  wv.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
                  wv.load(URLRequest(url: url))
                  context.coordinator.lastURL = url
                  return wv
              }
              func updateUIView(_ wv: WKWebView, context: Context) {
                  if context.coordinator.lastURL != url {
                      context.coordinator.host = url.host
                      context.coordinator.lastURL = url
                      wv.load(URLRequest(url: url))
                  }
              }
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                  var host: String?
                  var lastURL: URL?
                  init(host: String?) { self.host = host }
                  func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? { nil }
                  func webView(_ webView: WKWebView, decidePolicyFor action: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      guard let reqURL = action.request.url else { decisionHandler(.cancel); return }
                      let scheme = (reqURL.scheme ?? "").lowercased()
                      if scheme != "https" && scheme != "http" && scheme != "about" && scheme != "blob" {
                          decisionHandler(.cancel); return
                      }
                      if action.targetFrame?.isMainFrame == true, let bh = host, let th = reqURL.host?.lowercased() {
                          let allowed = ["vidsrc", "vidlink", "autoembed", "multiembed", "superembed", "2embed", "cloudnestra", "vidplay", "megacloud", "rabbitstream", "filemoon"]
                          if !th.contains(bh.lowercased()) && !allowed.contains(where: { th.contains($0) }) {
                              decisionHandler(.cancel); return
                          }
                      }
                      decisionHandler(.allow)
                  }
              }
          }

          extension HarborStore {
              func searchCatalogOnline(query: String) async {
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard q.count >= 2, let enc = q.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed) else { return }
                  for t in ["movie", "series"] {
                      guard let u = URL(string: "https://v3-cinemeta.strem.io/catalog/\(t)/top/search=\(enc).json"),
                            let (d, _) = try? await URLSession.shared.data(from: u),
                            let dec = try? JSONDecoder().decode(StremioCatalogResponse.self, from: d) else { continue }
                      for m in dec.metas.prefix(15) {
                          if t == "movie" && !trendingMovies.contains(where: { $0.id == m.id }) { trendingMovies.insert(m, at: 0) }
                          if t == "series" && !trendingSeries.contains(where: { $0.id == m.id }) { trendingSeries.insert(m, at: 0) }
                      }
                  }
              }
          }

