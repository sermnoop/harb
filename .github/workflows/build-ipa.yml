name: Build Harbor iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Source Files and Project Spec
        run: |
          mkdir -p Sources/HarborIOS
          if [ -d "Harbor-iOS-SwiftUI/Sources/HarborIOS" ]; then
            cp -r Harbor-iOS-SwiftUI/Sources/HarborIOS/* Sources/HarborIOS/
          elif [ -f "HarborIOS.swift" ] && [ ! -f "Sources/HarborIOS/HarborViews.swift" ]; then
            cp HarborIOS.swift Sources/HarborIOS/
          else
            find . -maxdepth 2 -name "*.swift" -not -path "*/Sources/*" -not -name "Package.swift" -exec cp {} Sources/HarborIOS/ \;
          fi
          rm -f Sources/HarborIOS/Package.swift
          rm -f Sources/HarborIOS/Info.plist
          rm -f Sources/HarborIOS/HarborFullStreamingExtension.swift
          if [ -f "Sources/HarborIOS/HarborIOS.swift" ] && [ -f "Sources/HarborIOS/HarborViews.swift" ]; then
            rm -f Sources/HarborIOS/HarborIOS.swift
          fi

          cat << 'EOF' >> Sources/HarborIOS/HarborStore.swift

          // MARK: - Smooth Interactive Button Style

          struct SmoothPressButtonStyle: ButtonStyle {
              var scaleAmount: CGFloat = 0.96
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .scaleEffect(configuration.isPressed ? scaleAmount : 1.0)
                      .opacity(configuration.isPressed ? 0.92 : 1.0)
                      .animation(.spring(response: 0.28, dampingFraction: 0.72), value: configuration.isPressed)
              }
          }

          // MARK: - Multi-Engine Full-Length Studio Music Resolver (Tidal HiFi + JioSaavn 320k + Piped Official Audio)

          enum JioSaavnStreamCrypto {
              private static let bannedInstrumentalWords = [
                  "instrumental", "karaoke", "backing track", "minus one", "ringtone",
                  "8d audio", "tribute", "cover version", "piano version", "lullaby version", "beat only"
              ]

              private static let hifiHosts = [
                  "https://wolf.qqdl.site",
                  "https://maus.qqdl.site",
                  "https://vogel.qqdl.site",
                  "https://katze.qqdl.site",
                  "https://hund.qqdl.site",
                  "https://tidal.kinoplus.online",
                  "https://api.monochrome.tf"
              ]

              static func isAuthenticVocalTrack(title: String, subtitle: String, album: String, query: String) -> Bool {
                  let qLower = query.lowercased()
                  let combined = "\(title) \(subtitle) \(album)".lowercased()
                  for word in bannedInstrumentalWords {
                      if combined.contains(word) && !qLower.contains(word) {
                          return false
                      }
                  }
                  return true
              }

              static func artistMatches(trackArtist: String, expectedArtist: String) -> Bool {
                  let a = trackArtist.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  let b = expectedArtist.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !a.isEmpty, !b.isEmpty else { return false }
                  if a.contains(b) || b.contains(a) { return true }
                  let aTokens = a.components(separatedBy: CharacterSet.alphanumerics.inverted).filter { $0.count >= 3 }
                  let bTokens = b.components(separatedBy: CharacterSet.alphanumerics.inverted).filter { $0.count >= 3 }
                  for tok in bTokens {
                      if aTokens.contains(tok) { return true }
                  }
                  return false
              }

              static func titleMatches(candidateTitle: String, expectedTitle: String) -> Bool {
                  let c = candidateTitle.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  let e = expectedTitle.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !c.isEmpty, !e.isEmpty else { return false }
                  if c == e || c.contains(e) || e.contains(c) { return true }
                  let cleanC = c.components(separatedBy: "(").first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? c
                  let cleanE = e.components(separatedBy: "(").first?.trimmingCharacters(in: .whitespacesAndNewlines) ?? e
                  return !cleanC.isEmpty && (cleanC == cleanE || cleanC.contains(cleanE) || cleanE.contains(cleanC))
              }

              static func decryptURL(_ enc: String) -> String? {
                  guard let data = Data(base64Encoded: enc.trimmingCharacters(in: .whitespacesAndNewlines)),
                        let key = "38346591".data(using: .utf8), !data.isEmpty else { return nil }
                  let bufSize = data.count + kCCBlockSizeDES
                  var out = [UInt8](repeating: 0, count: bufSize)
                  var outLen: size_t = 0
                  let status = data.withUnsafeBytes { inPtr in
                      key.withUnsafeBytes { keyPtr in
                          CCCrypt(CCOperation(kCCDecrypt), CCAlgorithm(kCCAlgorithmDES),
                                  CCOptions(kCCOptionECBMode | kCCOptionPKCS7Padding),
                                  keyPtr.baseAddress, kCCKeySizeDES, nil,
                                  inPtr.baseAddress, data.count, &out, bufSize, &outLen)
                      }
                  }
                  guard status == kCCSuccess,
                        let str = String(data: Data(bytes: out, count: outLen), encoding: .utf8)?
                            .trimmingCharacters(in: .controlCharacters.union(.whitespacesAndNewlines)),
                        str.hasPrefix("http") else { return nil }
                  return str.replacingOccurrences(of: "http://", with: "https://")
                            .replacingOccurrences(of: "_96.mp4", with: "_320.mp4")
                            .replacingOccurrences(of: "_48.mp4", with: "_160.mp4")
              }

              static func searchFullLengthTracks(query: String) async -> [HarborMusicTrack] {
                  let q = query.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? query

                  async let tidalTask = fromTidalHiFiSearch(q, rawQuery: query)
                  async let saavnDirectTask = fromJioSaavnDirect(q, rawQuery: query)
                  async let saavnMirrorTask = fromSaavnMirrors(q, rawQuery: query)
                  async let pipedTask = fromInvidiousAudioAPI(q, rawQuery: query)
                  async let deezerTask = fromDeezerAPI(q, rawQuery: query)
                  async let itunesSATask = fromITunesAPI(q, country: "SA", rawQuery: query)

                  let (tidal, saavnDirect, saavnMirror, piped, deezer, itunesSA) = await (
                      tidalTask, saavnDirectTask, saavnMirrorTask, pipedTask, deezerTask, itunesSATask
                  )

                  var fullPool: [HarborMusicTrack] = []
                  if let s1 = saavnDirect { fullPool.append(contentsOf: s1) }
                  if let s2 = saavnMirror { fullPool.append(contentsOf: s2) }
                  if let p = piped { fullPool.append(contentsOf: p) }

                  var combined: [HarborMusicTrack] = []
                  var seenKeys = Set<String>()

                  // 1. First priority: Tidal Hi-Fi / Monochrome Official Studio Catalog (100% Full-Length & Authentic!)
                  if let tidalTracks = tidal {
                      for t in tidalTracks {
                          let key = "\(t.title.lowercased())|\(String(t.artist.lowercased().prefix(8)))"
                          if seenKeys.contains(key) { continue }
                          // If we already have a pre-decrypted JioSaavn 320k direct URL that strictly matches, attach it for 0ms start, else keep tidal://id for instant resolution on tap
                          if let matchedFull = fullPool.first(where: {
                              titleMatches(candidateTitle: $0.title, expectedTitle: t.title) &&
                              artistMatches(trackArtist: $0.artist, expectedArtist: t.artist)
                          }) {
                              let merged = HarborMusicTrack(
                                  id: t.id,
                                  title: t.title,
                                  artist: t.artist,
                                  album: t.album,
                                  artworkURL: t.artworkURL ?? matchedFull.artworkURL,
                                  streamURL: matchedFull.streamURL,
                                  durationSeconds: max(t.durationSeconds, matchedFull.durationSeconds),
                                  genre: "Hi-Fi Studio • كامل",
                                  isLiveStream: false
                              )
                              seenKeys.insert(key)
                              combined.append(merged)
                          } else {
                              seenKeys.insert(key)
                              combined.append(t)
                          }
                      }
                  }

                  // 2. Second priority: Official Catalog (Deezer + Apple iTunes SA) upgraded to Full-Length via JioSaavn/Tidal/Piped
                  let catalogPool = (deezer ?? []) + (itunesSA ?? [])
                  for catTrack in catalogPool {
                      let key = "\(catTrack.title.lowercased())|\(String(catTrack.artist.lowercased().prefix(8)))"
                      if seenKeys.contains(key) { continue }

                      if let verifiedFull = fullPool.first(where: {
                          titleMatches(candidateTitle: $0.title, expectedTitle: catTrack.title) &&
                          artistMatches(trackArtist: $0.artist, expectedArtist: catTrack.artist)
                      }) {
                          let merged = HarborMusicTrack(
                              id: catTrack.id,
                              title: catTrack.title,
                              artist: catTrack.artist,
                              album: "\(catTrack.album) • كامل",
                              artworkURL: catTrack.artworkURL ?? verifiedFull.artworkURL,
                              streamURL: verifiedFull.streamURL,
                              durationSeconds: max(verifiedFull.durationSeconds, catTrack.durationSeconds),
                              genre: "Studio Full • كامل",
                              isLiveStream: false
                          )
                          seenKeys.insert(key)
                          combined.append(merged)
                      } else {
                          // Mark streamURL with unresolved scheme so play() automatically fetches the exact song's full stream!
                          let autoResolveTrack = HarborMusicTrack(
                              id: catTrack.id,
                              title: catTrack.title,
                              artist: catTrack.artist,
                              album: "\(catTrack.album) • كامل",
                              artworkURL: catTrack.artworkURL,
                              streamURL: "harborfull://resolve?fallback=\(catTrack.streamURL.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "")",
                              durationSeconds: max(catTrack.durationSeconds, 180),
                              genre: "Studio Audio • كامل",
                              isLiveStream: false
                          )
                          seenKeys.insert(key)
                          combined.append(autoResolveTrack)
                      }
                  }

                  // 3. Append any remaining verified full-length tracks
                  for t in fullPool {
                      let key = "\(t.title.lowercased())|\(String(t.artist.lowercased().prefix(8)))"
                      if !seenKeys.contains(key) {
                          seenKeys.insert(key)
                          combined.append(t)
                      }
                  }

                  return combined
              }

              /// Resolves a 100% full-length audio stream for a specific (title, artist) or tidalId
              static func resolveBestFullStream(title: String, artist: String, currentStreamURL: String = "") async -> (url: String, duration: Double)? {
                  // 1. If the track came from Tidal HiFi ("tidal://12345"), resolve the Tidal manifest directly first!
                  if currentStreamURL.hasPrefix("tidal://") {
                      let tidalId = currentStreamURL.replacingOccurrences(of: "tidal://", with: "").components(separatedBy: "?").first ?? ""
                      if !tidalId.isEmpty, let directTidal = await resolveTidalTrackManifest(trackId: tidalId) {
                          return (directTidal, 215)
                      }
                  }

                  let rawQuery = "\(title) \(artist)"
                  let q = rawQuery.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? title

                  // 2. Try Tidal HiFi search + manifest resolution for exact (title + artist)
                  if let tidalTracks = await fromTidalHiFiSearch(q, rawQuery: rawQuery),
                     let matchedTidal = tidalTracks.first(where: {
                         titleMatches(candidateTitle: $0.title, expectedTitle: title) &&
                         artistMatches(trackArtist: $0.artist, expectedArtist: artist)
                     }) ?? tidalTracks.first {
                      let tId = matchedTidal.streamURL.replacingOccurrences(of: "tidal://", with: "")
                      if let directURL = await resolveTidalTrackManifest(trackId: tId) {
                          return (directURL, max(matchedTidal.durationSeconds, 180))
                      }
                  }

                  // 3. Try JioSaavn Direct 320kbps with strict title + artist verification
                  if let s1 = await fromJioSaavnDirect(q, rawQuery: rawQuery),
                     let verified = s1.first(where: {
                         titleMatches(candidateTitle: $0.title, expectedTitle: title) &&
                         artistMatches(trackArtist: $0.artist, expectedArtist: artist)
                     }) {
                      return (verified.streamURL, verified.durationSeconds)
                  }

                  // 4. Try JioSaavn Mirrors with strict title + artist verification
                  if let s2 = await fromSaavnMirrors(q, rawQuery: rawQuery),
                     let verified = s2.first(where: {
                         titleMatches(candidateTitle: $0.title, expectedTitle: title) &&
                         artistMatches(trackArtist: $0.artist, expectedArtist: artist)
                     }) {
                      return (verified.streamURL, verified.durationSeconds)
                  }

                  // 5. Try Piped / YouTube Music Official Audio stream
                  if let inv = await fromInvidiousAudioAPI(q, rawQuery: rawQuery),
                     let first = inv.first {
                      return (first.streamURL, first.durationSeconds)
                  }

                  return nil
              }

              /// Resolves a YouTube Video ID for the [🎧 Audio | 📺 Video] toggle in the YouTube Music player
              static func resolveYouTubeVideoID(title: String, artist: String) async -> String? {
                  let rawQuery = "\(title) \(artist) official"
                  let q = rawQuery.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? title
                  let pipedHosts = [
                      "https://pipedapi.kavin.rocks",
                      "https://api.piped.private.coffee",
                      "https://pipedapi.adminforge.de",
                      "https://pipedapi.drgns.space"
                  ]
                  for host in pipedHosts {
                      guard let u = URL(string: "\(host)/search?q=\(q)&filter=videos") else { continue }
                      var req = URLRequest(url: u)
                      req.timeoutInterval = 4
                      if let (data, resp) = try? await URLSession.shared.data(for: req),
                         let http = resp as? HTTPURLResponse, http.statusCode == 200,
                         let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let items = root["items"] as? [[String: Any]],
                         let firstUrl = items.first?["url"] as? String {
                          let vid = firstUrl.replacingOccurrences(of: "/watch?v=", with: "")
                          if !vid.isEmpty { return vid }
                      }
                  }
                  return nil
              }

              private static func fromTidalHiFiSearch(_ q: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  for host in hifiHosts.prefix(4) {
                      guard let url = URL(string: "\(host)/search/?s=\(q)&limit=18") else { continue }
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 4
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      guard let (data, resp) = try? await URLSession.shared.data(for: req),
                            let http = resp as? HTTPURLResponse, http.statusCode == 200,
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { continue }
                      let dataObj = (root["data"] as? [String: Any]) ?? root
                      guard let items = dataObj["items"] as? [[String: Any]], !items.isEmpty else { continue }

                      let tracks: [HarborMusicTrack] = items.compactMap { item in
                          guard let idNum = item["id"] as? Int,
                                let title = item["title"] as? String else { return nil }
                          let dur = Double((item["duration"] as? Int) ?? 210)
                          guard dur >= 60 else { return nil }
                          var artist = "Artist"
                          if let aObj = item["artist"] as? [String: Any], let aName = aObj["name"] as? String {
                              artist = aName
                          } else if let aArr = item["artists"] as? [[String: Any]], let firstA = aArr.first?["name"] as? String {
                              artist = firstA
                          }
                          let albObj = item["album"] as? [String: Any]
                          let album = (albObj?["title"] as? String) ?? "Single"
                          guard isAuthenticVocalTrack(title: title, subtitle: artist, album: album, query: rawQuery) else { return nil }

                          var artworkURL: String? = nil
                          if let coverUUID = albObj?["cover"] as? String, !coverUUID.isEmpty {
                              let path = coverUUID.replacingOccurrences(of: "-", with: "/")
                              artworkURL = "https://resources.tidal.com/images/\(path)/640x640.jpg"
                          }
                          return HarborMusicTrack(
                              id: "td-\(idNum)",
                              title: title,
                              artist: artist,
                              album: "\(album) • Hi-Fi كامل",
                              artworkURL: artworkURL,
                              streamURL: "tidal://\(idNum)",
                              durationSeconds: dur,
                              genre: "Hi-Fi Lossless",
                              isLiveStream: false
                          )
                      }
                      if !tracks.isEmpty { return tracks }
                  }
                  return nil
              }

              static func resolveTidalTrackManifest(trackId: String) async -> String? {
                  for quality in ["HIGH", "LOSSLESS"] {
                      for host in hifiHosts {
                          guard let url = URL(string: "\(host)/track/?id=\(trackId)&quality=\(quality)") else { continue }
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 4
                          req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                          guard let (data, resp) = try? await URLSession.shared.data(for: req),
                                let http = resp as? HTTPURLResponse, http.statusCode == 200,
                                let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { continue }
                          let dataObj = (root["data"] as? [String: Any]) ?? root
                          if let manifestB64 = dataObj["manifest"] as? String,
                             let mData = Data(base64Encoded: manifestB64),
                             let mJson = try? JSONSerialization.jsonObject(with: mData) as? [String: Any],
                             let urls = mJson["urls"] as? [String],
                             let firstURL = urls.first, firstURL.hasPrefix("http") {
                              return firstURL
                          }
                      }
                  }
                  return nil
              }

              private static func fromJioSaavnDirect(_ q: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://www.jiosaavn.com/api.php?_format=json&_marker=0&ctx=web6dot0&api_version=4&__call=search.getResults&q=\(q)&n=25&p=1") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["results"] as? [[String: Any]] else { return nil }
                  return items.compactMap { item in
                      let info = item["more_info"] as? [String: Any]
                      guard let enc = info?["encrypted_media_url"] as? String, let stream = decryptURL(enc) else { return nil }
                      let id = (item["id"] as? String) ?? UUID().uuidString
                      let title = clean((item["title"] as? String) ?? (item["song"] as? String) ?? "Song")
                      var artist = clean((info?["music"] as? String) ?? (item["subtitle"] as? String) ?? "Artist")
                      if let artistMap = info?["artistMap"] as? [String: Any],
                         let primary = artistMap["primary_artists"] as? [[String: Any]],
                         !primary.isEmpty {
                          let names = primary.compactMap { $0["name"] as? String }.joined(separator: ", ")
                          if !names.isEmpty { artist = clean(names) }
                      }
                      let album = clean((info?["album"] as? String) ?? "Single")
                      guard isAuthenticVocalTrack(title: title, subtitle: artist, album: album, query: rawQuery) else { return nil }

                      let dur = Double((info?["duration"] as? String) ?? "") ?? Double((info?["duration"] as? Int) ?? 210)
                      guard dur >= 60 else { return nil }
                      let art = (item["image"] as? String)?.replacingOccurrences(of: "150x150", with: "500x500").replacingOccurrences(of: "http://", with: "https://")
                      return HarborMusicTrack(id: "saavn-\(id)", title: title, artist: artist, album: "\(album) • كامل", artworkURL: art, streamURL: stream, durationSeconds: dur, genre: "320kbps Studio", isLiveStream: false)
                  }
              }

              private static func fromSaavnMirrors(_ q: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  for host in ["https://saavn.dev", "https://saavn.sumit.co"] {
                      guard let url = URL(string: "\(host)/api/search/songs?query=\(q)&limit=20") else { continue }
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 5
                      guard let (data, _) = try? await URLSession.shared.data(for: req),
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let dataObj = root["data"] as? [String: Any],
                            let items = dataObj["results"] as? [[String: Any]] else { continue }
                      let list: [HarborMusicTrack] = items.compactMap { item in
                          guard let dls = item["downloadUrl"] as? [[String: Any]],
                                let lastDL = dls.last,
                                let rawLink = (lastDL["url"] as? String) ?? (lastDL["link"] as? String) else { return nil }
                          let title = clean((item["name"] as? String) ?? "Song")
                          let dur = (item["duration"] as? Double) ?? Double((item["duration"] as? Int) ?? 210)
                          guard dur >= 60 else { return nil }
                          var artist = "Artist"
                          if let aObj = item["artists"] as? [String: Any], let prim = aObj["primary"] as? [[String: Any]], !prim.isEmpty {
                              let names = prim.compactMap { $0["name"] as? String }.joined(separator: ", ")
                              if !names.isEmpty { artist = clean(names) }
                          } else if let pStr = item["primaryArtists"] as? String, !pStr.isEmpty {
                              artist = clean(pStr)
                          }
                          let albObj = item["album"] as? [String: Any]
                          let album = clean((albObj?["name"] as? String) ?? "Single")
                          guard isAuthenticVocalTrack(title: title, subtitle: artist, album: album, query: rawQuery) else { return nil }

                          let imgs = item["image"] as? [[String: Any]]
                          let art = ((imgs?.last?["url"] as? String) ?? (imgs?.last?["link"] as? String))?.replacingOccurrences(of: "http://", with: "https://")
                          return HarborMusicTrack(id: UUID().uuidString, title: title, artist: artist, album: "\(album) • كامل", artworkURL: art, streamURL: rawLink.replacingOccurrences(of: "http://", with: "https://"), durationSeconds: dur, genre: "Full Audio", isLiveStream: false)
                      }
                      if !list.isEmpty { return list }
                  }
                  return nil
              }

              private static func fromDeezerAPI(_ q: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://api.deezer.com/search?q=\(q)&limit=20") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let items = root["data"] as? [[String: Any]] else { return nil }
                  return items.compactMap { item in
                      guard let title = item["title"] as? String,
                            let preview = item["preview"] as? String, !preview.isEmpty else { return nil }
                      let id = (item["id"] as? Int).map { String($0) } ?? UUID().uuidString
                      let dur = Double((item["duration"] as? Int) ?? 210)
                      let artistObj = item["artist"] as? [String: Any]
                      let artist = (artistObj?["name"] as? String) ?? "Artist"
                      let albumObj = item["album"] as? [String: Any]
                      let album = (albumObj?["title"] as? String) ?? "Single"
                      guard isAuthenticVocalTrack(title: title, subtitle: artist, album: album, query: rawQuery) else { return nil }
                      let art = (albumObj?["cover_xl"] as? String) ?? (albumObj?["cover_big"] as? String) ?? (albumObj?["cover_medium"] as? String)
                      return HarborMusicTrack(id: "dz-\(id)", title: title, artist: artist, album: album, artworkURL: art, streamURL: preview, durationSeconds: max(dur, 180), genre: "Studio Audio", isLiveStream: false)
                  }
              }

              private static func fromITunesAPI(_ q: String, country: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  guard let url = URL(string: "https://itunes.apple.com/search?term=\(q)&country=\(country)&media=music&entity=song&limit=20") else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let decoded = try? JSONDecoder().decode(ITunesSearchResponse.self, from: data) else { return nil }
                  return decoded.results.compactMap { item in
                      guard let preview = item.previewUrl, let title = item.trackName else { return nil }
                      let artist = item.artistName ?? "Artist"
                      let album = item.collectionName ?? "Single"
                      guard isAuthenticVocalTrack(title: title, subtitle: artist, album: album, query: rawQuery) else { return nil }
                      let hiRes = item.artworkUrl100?.replacingOccurrences(of: "100x100bb", with: "600x600bb")
                      return HarborMusicTrack(
                          id: "it-\(item.trackId ?? Int.random(in: 1000...999999))",
                          title: title,
                          artist: artist,
                          album: album,
                          artworkURL: hiRes,
                          streamURL: preview,
                          durationSeconds: Double(item.trackTimeMillis ?? 210000) / 1000.0,
                          genre: item.primaryGenreName,
                          isLiveStream: false
                      )
                  }
              }

              private static func fromInvidiousAudioAPI(_ q: String, rawQuery: String) async -> [HarborMusicTrack]? {
                  let officialQuery = "\(rawQuery) official audio".addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? q
                  let pipedHosts = [
                      "https://pipedapi.kavin.rocks",
                      "https://api.piped.private.coffee",
                      "https://pipedapi.adminforge.de",
                      "https://pipedapi.drgns.space"
                  ]
                  for host in pipedHosts {
                      guard let searchURL = URL(string: "\(host)/search?q=\(officialQuery)&filter=music_songs") else { continue }
                      var req = URLRequest(url: searchURL)
                      req.timeoutInterval = 4
                      guard let (data, resp) = try? await URLSession.shared.data(for: req),
                            let http = resp as? HTTPURLResponse, http.statusCode == 200,
                            let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let items = root["items"] as? [[String: Any]],
                            let firstItem = items.first,
                            let urlPath = firstItem["url"] as? String else { continue }
                      let videoId = urlPath.replacingOccurrences(of: "/watch?v=", with: "")
                      guard let streamEndpoint = URL(string: "\(host)/streams/\(videoId)") else { continue }
                      var sReq = URLRequest(url: streamEndpoint)
                      sReq.timeoutInterval = 4
                      guard let (sData, _) = try? await URLSession.shared.data(for: sReq),
                            let sRoot = try? JSONSerialization.jsonObject(with: sData) as? [String: Any],
                            let audioStreams = sRoot["audioStreams"] as? [[String: Any]] else { continue }
                      if let m4a = audioStreams.first(where: { ($0["mimeType"] as? String)?.contains("mp4") == true }) ?? audioStreams.first,
                         let directAudioURL = m4a["url"] as? String {
                          let title = (firstItem["title"] as? String) ?? "Track"
                          let artist = (firstItem["uploaderName"] as? String) ?? "Artist"
                          guard isAuthenticVocalTrack(title: title, subtitle: artist, album: "", query: rawQuery) else { continue }
                          let dur = Double((firstItem["duration"] as? Int) ?? 210)
                          let thumb = firstItem["thumbnail"] as? String
                          return [HarborMusicTrack(id: "ytm-\(videoId)", title: title, artist: artist, album: "Official Audio • كامل", artworkURL: thumb, streamURL: directAudioURL, durationSeconds: max(dur, 120), genre: "Full Song", isLiveStream: false)]
                      }
                  }
                  return nil
              }

